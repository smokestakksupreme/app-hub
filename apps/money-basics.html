:root{
  --bg:#0b0f16; --bg2:#111823; --card:#131b27; --card-h:#18222f;
  --line:#222d3d; --line2:#31405436;
  --tx:#eaf0f8; --tx2:#9fb0c6; --tx3:#697b93;
  --a1:#4c8dff; --a2:#2ec4a6; --a3:#f2a33c; --a4:#c77dff; --a5:#ff7a8a; --a6:#5fd0e8; --a7:#8fd14f;
  --warn:#f2a33c;
  --c:#4c8dff;
  --r:16px;
  --sans:'InterV',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-size:16.5px;line-height:1.65;
  font-feature-settings:"cv05" 1,"ss03" 1;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:90px;position:relative;overflow-x:hidden;
}
/* ambient background */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(900px 500px at 50% -8%, rgba(76,141,255,.13), transparent 65%),
    radial-gradient(700px 420px at 88% 4%, rgba(46,196,166,.08), transparent 60%),
    radial-gradient(600px 380px at 8% 12%, rgba(199,125,255,.07), transparent 60%);
}

/* keeps the wordmark and search field legible over the light shaft */
.bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 720px 400px at 50% 27%, rgba(11,15,22,.80), rgba(11,15,22,.26) 64%, transparent 80%),
    linear-gradient(180deg, rgba(11,15,22,.45) 0%, rgba(11,15,22,.08) 32%, rgba(11,15,22,.70) 78%, var(--bg) 96%);
}
/* recede on topic pages so long reading stays clean */
body.reading .bg::before{opacity:.10}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

/* ---------- header ---------- */
header{padding:26px 0 40px;position:relative}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:30px}
.topright{display:flex;align-items:center;gap:10px}
.langsw{
  display:flex;gap:2px;border:1px solid var(--line);border-radius:30px;padding:3px;
  background:rgba(11,15,22,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.langsw button{
  border:none;background:none;color:var(--tx3);font:inherit;font-size:11.5px;font-weight:700;
  letter-spacing:.8px;padding:4px 13px;border-radius:30px;cursor:pointer;transition:.16s;
}
.langsw button:hover{color:var(--tx2)}
.langsw button.on{background:rgba(255,255,255,.09);color:var(--tx)}
.byline{
  font-size:12.5px;color:var(--tx3);letter-spacing:.35px;white-space:nowrap;
  border:1px solid var(--line);border-radius:30px;padding:5px 15px;
  background:rgba(11,15,22,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.byline b{color:var(--tx2);font-weight:600;letter-spacing:.2px}
.crumbs{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tx3);min-height:22px}
.crumbs button{background:none;border:none;color:var(--tx2);cursor:pointer;font:inherit;padding:0;transition:.15s}
.crumbs button:hover{color:var(--c)}
.crumbs .now{color:var(--tx)}

.center{text-align:center;max-width:760px;margin:0 auto;padding-top:22px}
.mark{
  width:62px;height:62px;margin:0 auto 22px;border-radius:19px;
  background:linear-gradient(145deg,#5b96ff,#2ec4a6 62%,#8fd14f);
  display:grid;place-items:center;font-size:27px;color:#0b0f16;
  box-shadow:0 14px 40px -10px rgba(76,141,255,.55),inset 0 1px 0 rgba(255,255,255,.35);
}
.eyebrow{
  display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;
  color:var(--tx2);border:1px solid var(--line2);border-radius:30px;padding:5px 15px;margin-bottom:20px;
  background:rgba(11,15,22,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
h1{
  font-family:var(--disp);font-weight:700;font-size:clamp(42px,7vw,68px);line-height:1.02;
  letter-spacing:-.4px;
  color:#05080d;
  -webkit-text-stroke:.05em var(--tx2);
  paint-order:stroke fill;
  text-shadow:0 6px 24px rgba(0,0,0,.45);
}
.sub{color:var(--tx2);font-size:17.5px;line-height:1.6;margin:20px auto 0;max-width:600px}
.stat{margin-top:26px;color:var(--tx3);font-size:13px;letter-spacing:.4px}
.stat b{color:var(--tx2);font-weight:600}

.searchbar{margin:30px auto 0;position:relative;max-width:440px}
.searchbar input{
  width:100%;padding:14px 16px 14px 44px;border-radius:14px;
  background:rgba(11,15,22,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line2);color:var(--tx);
  font:inherit;font-size:15.5px;outline:none;transition:.18s;text-align:left;
}
.searchbar input::placeholder{color:var(--tx3)}
.searchbar input:focus{border-color:#3a5f9e;background:rgba(76,141,255,.06);box-shadow:0 0 0 4px rgba(76,141,255,.09)}
.searchbar span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px}

/* ---------- topic grid ---------- */
.grid{display:grid;gap:18px;margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.tcard{
  display:flex;flex-direction:column;
  background:linear-gradient(170deg,var(--card),#101722);
  border:1px solid var(--line);border-radius:var(--r);
  padding:24px 22px 22px;cursor:pointer;text-align:left;color:inherit;font:inherit;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),border-color .2s,box-shadow .2s,background .2s;
  position:relative;overflow:hidden;
}
.tcard::after{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.5;transition:.25s;
}
.tcard:hover{
  transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));
  box-shadow:0 18px 44px -18px rgba(0,0,0,.9),0 0 0 1px color-mix(in srgb,var(--c) 14%,transparent);
  background:linear-gradient(170deg,var(--card-h),#121a26);
}
.tcard:hover::after{opacity:1}
.chip{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:25px;
  background:color-mix(in srgb,var(--c) 15%,transparent);
  border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
  margin-bottom:18px;transition:.25s;
}
.tcard:hover .chip{transform:scale(1.06) rotate(-3deg)}
.lvl{
  display:inline-block;align-self:flex-start;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);
  border-radius:20px;padding:3px 10px;margin-bottom:11px;
}
.tcard h3{font-family:var(--disp);font-size:24px;font-weight:600;margin-bottom:8px;letter-spacing:-.5px;line-height:1.2}

tag:'When you buy a stock, you are buying a piece of a real business. Everything else is detail.',
blurb:'Owning a slice of a company. How shares work, why prices move, and exactly how to place your first buy and sell.',
deepTeaser:'Order types, how a trade actually gets filled, reading a valuation, position sizing, and the tax rules that quietly eat returns.',
basics:[
{h:'What a stock actually is', body:`
<p>A company that wants money — to build a factory, hire people, pay off founders — can cut its ownership into millions of equal slices and sell them. Each slice is a <strong>share of stock</strong>. Buy one and you legally own that fraction of the business: its buildings, its brand, its profits, its debts.</p>
<p>If a company is cut into 1,000,000 shares and you own 1,000, you own one tenth of one percent of everything it has and everything it earns. That is the whole idea. The ticker symbol, the flashing green and red, the guy yelling on TV — all decoration on top of that one fact.</p>
<div class="box"><b>The mental model</b><p>Think of a company like a rental property that thousands of people co-own. Some of the rent gets paid out to owners, some gets reinvested in the building, and the ownership stakes themselves trade hands at prices that move with how good the building looks that year.</p></div>
<p>Two flavors you will see: <em>common stock</em> (what almost everyone buys — you get voting rights and unlimited upside) and <em>preferred stock</em> (fixed dividend, first in line if things go bad, but limited upside — behaves more like a bond).</p>`},

{h:'How you actually make money', body:`
<p>There are exactly two ways. Everything else is a variation.</p>
<ol>
<li><strong>The price goes up.</strong> You buy at 50, it trades at 80, you sell. That 30 is a <em>capital gain</em>. Until you sell, it is an "unrealized" gain — real on paper, not in your pocket, and not yet taxed.</li>
<li><strong>The company pays you.</strong> Many mature companies send a slice of profit to owners every quarter — a <em>dividend</em>. Own 200 shares of a company paying $0.75 per share quarterly and $150 lands in your account four times a year, whether the stock went up or down.</li>
</ol>
<p>Growth companies usually pay no dividend — they plow every dollar back into growing. Older, steadier companies (utilities, big banks, consumer brands) tend to pay. Neither is better; they are different jobs.</p>
<p>And yes, it runs the other way. The price can go to zero. A share of a bankrupt company is worth exactly nothing, and shareholders are dead last in line behind lenders, bondholders, and the IRS. That is the trade: unlimited upside, total downside.</p>`},

{h:'Why prices move', body:`
<p>A stock price is not a measurement of a company. It is the price where the last buyer and the last seller agreed. It moves because that agreement point moves.</p>
<ul>
<li><strong>Earnings vs. expectations.</strong> This is the big one. A company can report record profit and drop 12% because analysts expected more. The market prices in the future; news only moves the price to the extent it was a <em>surprise</em>.</li>
<li><strong>Interest rates.</strong> When safe government bonds pay 5%, a risky stock has to promise a lot more to be worth owning — so stock prices fall. When rates drop, the reverse. Rates are gravity for every asset you will read about on this site.</li>
<li><strong>The story.</strong> Guidance, a new product, a CEO leaving, a lawsuit, a sector falling out of favor. Fear and greed are real inputs, and in the short run they are the dominant ones.</li>
</ul>
<div class="box"><b>The line worth remembering</b><p>In the short run the market is a voting machine; in the long run it is a weighing machine. Day to day, price reflects mood. Over a decade, it reflects whether the business actually made money.</p></div>`},

{h:'How to buy and sell — step by step', body:`
<ol class="steps">
<li><b>Open a brokerage account</b> Fidelity, Schwab, Vanguard, E*TRADE, Robinhood — all fine, all $0 commission on U.S. stocks. You will need your SSN, address, and employer info. Takes about 10 minutes. Choose a <em>taxable brokerage account</em> for flexible money, or an IRA if this is retirement money (see the Retirement Accounts topic — the tax difference is enormous).</li>
<li><b>Fund it</b> Link your bank and transfer. ACH transfers usually settle in 1–3 business days. Some brokers give you instant buying power up to a limit.</li>
<li><b>Find the ticker</b> Every stock has a short symbol — AAPL for Apple, NSC for Norfolk Southern, VTI for the Vanguard total-market ETF. Type it into the search box.</li>
<li><b>Choose your order type</b> A <em>market order</em> says "buy now at whatever the going price is" — it always fills, but you do not control the price. A <em>limit order</em> says "buy only at $47.50 or better" — you control the price, but it may never fill. For anything liquid, a market order during regular hours is fine. For thin or volatile names, use a limit.</li>
<li><b>Enter share count or dollar amount</b> Most brokers now support <em>fractional shares</em>, so you can put $100 into a $600 stock. Review the estimated total, then submit.</li>
<li><b>Selling is the same screen in reverse</b> Enter a sell order, market or limit. Cash from the sale settles in one business day (T+1), then you can withdraw it.</li>
</ol>
<div class="box warn"><b>Before you press buy</b><p>Know why you own it and what would make you sell. "It went down" is not a reason to sell and "it went up" is not a reason to buy. Write your reason down somewhere — it is the cheapest risk control that exists.</p></div>`},

{h:'What most people should actually buy', body:`
<p>Picking individual winners is hard. Not impossible — hard. The majority of professional fund managers, with teams and data budgets, fail to beat the plain market average over ten years.</p>
<p>Which is why the boring answer is the right starting answer: an <strong>index fund</strong> or <strong>ETF</strong> that owns the whole market at once. One purchase of something like a total-market or S&amp;P 500 fund makes you a part-owner of hundreds or thousands of companies. If one blows up, it barely dents you. The fee is typically 0.03%–0.10% a year — three to ten dollars per ten thousand.</p>
<div class="box"><b>A reasonable structure</b><p>Core of the portfolio in broad index funds. Then, if you enjoy research, a smaller sleeve — call it 5–15% — for individual companies you actually understand. You get the market return on the bulk of your money and a real outlet for conviction, without one bad call rewriting your retirement.</p></div>
<p>Two more mechanics worth knowing early: <strong>dollar-cost averaging</strong> (buying a fixed amount on a schedule, so you buy more shares when prices are low and fewer when high, and stop trying to time entries) and <strong>DRIP</strong> (automatically reinvesting dividends into more shares — free compounding, one checkbox in your account settings).</p>`}

deep:[
{h:'What actually happens when you press "buy"', body:`
<p>Your order does not go to "the stock market" as one place. Your broker routes it — to an exchange (NYSE, Nasdaq), to a dark pool, or most often for retail orders, to a <strong>wholesale market maker</strong> like Citadel Securities or Virtu, who pays your broker for the right to fill it. That payment is <em>payment for order flow</em>, and it is why commissions are $0.</p>
<p>The market maker fills you at or slightly better than the national best bid/offer and keeps a sliver of the spread. On a liquid stock that sliver is a penny or less — genuinely cheap. On a thin stock or a wide-spread option, it is not.</p>
<table>
<tr><th>Order type</th><th>What it does</th><th>Use it when</th></tr>
<tr><td>Market</td><td>Fills immediately at the going price</td><td>Liquid names, regular hours, size that will not move the price</td></tr>
<tr><td>Limit</td><td>Fills only at your price or better; may not fill</td><td>Thin stocks, volatile opens, options, any time price matters more than certainty</td></tr>
<tr><td>Stop (stop-loss)</td><td>Becomes a market order once price hits your trigger</td><td>Capping downside — but it can fill far below your trigger in a gap-down</td></tr>
<tr><td>Stop-limit</td><td>Becomes a limit order at your trigger</td><td>Same idea, price protected — but may not fill at all in a fast drop</td></tr>
<tr><td>Trailing stop</td><td>Trigger follows the price up by a set amount or percent</td><td>Locking in gains on a winner without picking a fixed exit</td></tr>
</table>
<div class="box warn"><b>Two structural traps</b><p><strong>The open and the close.</strong> Spreads are widest in the first and last 10 minutes. Market orders at 9:30:01 get worse prices than the same order at 10:15.</p><p><strong>Extended hours.</strong> Pre-market and after-hours trading has a fraction of the volume and much wider spreads. Limit orders only, and understand that an after-hours print is a weak signal about where the stock opens.</p></div>`},

{h:'Reading a company: the four numbers that matter', body:`
<p>You do not need a finance degree. You need to answer four questions, and every one has a number attached that sits in the company's quarterly filing (free at sec.gov, and summarized on any broker site).</p>
<ul>
<li><strong>Is it growing?</strong> Revenue growth year over year. Look at three to five years, not one quarter — one quarter is noise.</li>
<li><strong>Does growth turn into cash?</strong> <em>Free cash flow</em> — cash from operations minus capital spending. This is the number hardest to fake. Net income is an accounting opinion; free cash flow is closer to a fact. A company with rising revenue and falling free cash flow is a yellow flag.</li>
<li><strong>How much am I paying for it?</strong> P/E (price ÷ earnings per share) is the fast one. Its weakness: it is meaningless for unprofitable companies and distorted by one-time charges. <em>EV/EBITDA</em> handles debt better; <em>P/FCF</em> is often the most honest. Compare a company to its own history and to direct competitors — never to the market as a whole.</li>
<li><strong>Can it survive a bad year?</strong> Debt-to-equity and the interest coverage ratio (operating income ÷ interest expense). Coverage below about 3x on a cyclical business means a downturn gets dangerous.</li>
</ul>
<p>Then the qualitative half, which matters more than the ratios: <strong>what stops a competitor from taking this business?</strong> Switching costs, network effects, a real brand, patents, regulatory position, or a physical network that cannot be rebuilt. That durable advantage is what Buffett called a moat, and it is the difference between a good business and a good quarter.</p>
<div class="box"><b>Sanity check on P/E</b><p>A P/E of 30 means you pay $30 for $1 of current annual profit. That is only rational if profit grows a lot from here. A P/E of 8 usually means the market expects earnings to fall. Neither number is good or bad on its own — it is a statement about expectations, and your edge is in disagreeing with those expectations correctly.</p></div>`},

{h:'Position sizing and risk — the part that actually decides outcomes', body:`
<p>Most people obsess over what to buy and give almost no thought to how much. Sizing is where portfolios are actually made or destroyed.</p>
<p><strong>The asymmetry that ruins accounts:</strong> a 50% loss requires a 100% gain to get back to even. Down 80%? You need 400%. This is why avoiding catastrophic single-position losses matters more than catching winners.</p>
<table>
<tr><th>Rule of thumb</th><th>What it means in practice</th></tr>
<tr><td>Single-name cap</td><td>No individual stock above roughly 5% of the portfolio unless you have a strong reason. At 5%, a total wipeout costs you 5%. Survivable.</td></tr>
<tr><td>Correlation check</td><td>Count exposures, not tickers. Four railroads is one bet on freight volume. Your employer stock plus your paycheck plus your pension is triple exposure to one company — a real issue if you work in a single industry.</td></tr>
<tr><td>Rebalancing</td><td>Once or twice a year, sell down what grew past target and buy what lagged. Mechanically forces sell-high/buy-low and keeps risk from drifting upward as winners take over.</td></tr>
<tr><td>Cash as a position</td><td>Cash is not dead weight — it is optionality. Having dry powder in a crash is worth more than the yield you gave up.</td></tr>
</table>
<p>Also, know the historical shape of what you are signing up for: the U.S. market has averaged roughly 10% a year nominal over the long haul, but has delivered drawdowns of 50%+ multiple times, with recoveries taking anywhere from months to over a decade. The average is made of extremes. Any plan you cannot hold through a 40% drawdown is not a plan.</p>`},

{h:'Taxes — the quiet fee', body:`
<p>In a taxable brokerage account, the IRS is a silent partner. Holding period is the lever you control.</p>
<table>
<tr><th></th><th>Short-term</th><th>Long-term</th></tr>
<tr><td>Holding period</td><td>One year or less</td><td>More than one year</td></tr>
<tr><td>Taxed as</td><td>Ordinary income — your regular bracket</td><td>Preferential capital gains rates (0/15/20% tiers, depending on income)</td></tr>
</table>
<p>For a lot of people that is a difference of 10 to 20 percentage points on the same profit, purely for the calendar. Selling a winner at 11 months is an expensive habit.</p>
<ul>
<li><strong>Tax-loss harvesting.</strong> Realized losses offset realized gains, and up to $3,000 of ordinary income per year, with the rest carried forward indefinitely. Selling a loser can be worth real money.</li>
<li><strong>The wash-sale rule.</strong> If you buy the same or a "substantially identical" security within 30 days before or after selling at a loss, the loss is disallowed for now and added to the new cost basis. The 30-day window runs both directions, and it applies across your accounts — including an IRA, where the loss is destroyed permanently.</li>
<li><strong>Qualified vs. ordinary dividends.</strong> Qualified dividends get capital-gains rates if you have held the stock long enough. REIT and most bond-fund distributions are ordinary income — which is why those often belong in a tax-sheltered account.</li>
<li><strong>Cost basis method.</strong> Set your broker to "specific identification" instead of FIFO. It lets you choose which tax lots to sell, which is free money at tax time.</li>
</ul>
<div class="box"><b>Asset location</b><p>Same investments, different accounts, different outcome. Tax-inefficient things — REITs, high-yield bonds, actively traded positions — belong in an IRA or 401(k). Broad index funds, which throw off little taxable income, are fine in a taxable account. This one structural choice is worth more over 20 years than most stock picks.</p></div>`},

{h:'How index funds and ETFs actually work', body:`
<p>An ETF holds a basket. Its share price should equal the value of that basket per share (the <em>NAV</em>), and it stays there through a mechanism most people never see: <strong>authorized participants</strong>. These are large firms that can create new ETF shares by delivering the underlying basket, or redeem shares to get the basket back. If the ETF trades above NAV, they create and sell; below, they buy and redeem. The arbitrage keeps price glued to value — and, as a side effect, lets ETFs shed appreciated positions without triggering capital gains, which is why ETFs are usually more tax-efficient than mutual funds.</p>
<table>
<tr><th></th><th>ETF</th><th>Index mutual fund</th></tr>
<tr><td>Trading</td><td>All day, like a stock</td><td>Once daily at the 4pm close</td></tr>
<tr><td>Tax efficiency</td><td>Usually higher (in-kind redemptions)</td><td>Can distribute capital gains you did not ask for</td></tr>
<tr><td>Minimums</td><td>One share, or fractional</td><td>Sometimes $1,000–$3,000</td></tr>
<tr><td>Automation</td><td>Depends on the broker</td><td>Easy automatic recurring investment</td></tr>
</table>
<p>What to actually check before buying a fund: the <strong>expense ratio</strong> (under 0.20% for anything broad-market; there is no excuse above that), <strong>tracking difference</strong> (how far it drifts from its index), <strong>assets under management</strong> (small funds get closed and liquidated), and <strong>what is actually inside</strong>. Plenty of thematic ETFs have exciting names and hold the same seven mega-cap tech stocks you already own three other ways. Read the top-10 holdings, always.</p>
<div class="box warn"><b>Avoid unless you know exactly what you are doing</b><p><strong>Leveraged and inverse ETFs</strong> (2x, 3x, "short S&P") reset their leverage daily. Over any period longer than a day, volatility decay means they can lose money even if the underlying index ends up where it started. They are trading instruments, not investments.</p></div>`},

{h:'Options, in one honest paragraph each', body:`
<p>An <strong>option</strong> is a contract giving you the right — not the obligation — to buy (a <em>call</em>) or sell (a <em>put</em>) 100 shares at a set <em>strike price</em> before a set <em>expiration date</em>. You pay a <em>premium</em> for that right. Options are used for three genuinely different purposes, and conflating them is how people get hurt.</p>
<ul>
<li><strong>Hedging.</strong> Buying a put on something you own is portfolio insurance — you cap your downside and the premium is the cost of the policy. Legitimate, conservative, and the original purpose of the instrument.</li>
<li><strong>Income.</strong> Selling a <em>covered call</em> against shares you already own collects premium in exchange for capping your upside above the strike. A real strategy with a real trade-off: you get paid now and give up the big move if it comes.</li>
<li><strong>Speculation.</strong> Buying short-dated out-of-the-money calls because you think a stock will jump this week. This is leverage plus a countdown clock. Time decay (<em>theta</em>) works against you every single day, and the majority of these expire worthless. It can be entertaining; it is not investing, and it should be money you are fully prepared to lose.</li>
</ul>
<p>Selling <em>naked</em> options — calls without owning the shares — carries theoretically unlimited loss. Brokers gate this behind approval levels for good reason. If you go here at all, go through covered calls and cash-secured puts first, in small size, and understand implied volatility before you trade a single contract.</p>`},

{h:'The behavioral edge', body:`
<p>The gap between what funds return and what investors in those funds actually earn runs roughly one to two percentage points a year, and it is entirely behavioral — people buy after run-ups and sell after drops. Every dollar of that gap is self-inflicted.</p>
<ul>
<li><strong>Loss aversion.</strong> Losing $1,000 hurts about twice as much as gaining $1,000 feels good. This is why people hold losers hoping to break even and sell winners early to lock in a feeling.</li>
<li><strong>Recency bias.</strong> Whatever just happened feels like what happens next. It is why fund inflows peak near tops.</li>
<li><strong>Confirmation bias.</strong> Once you own it, you read the bull case and skip the bear case. The fix is mechanical: before buying, write down the three things that would prove you wrong, and check them on a schedule.</li>
<li><strong>Action bias.</strong> Doing nothing feels irresponsible. In investing, doing nothing is frequently the highest-expected-value move available.</li>
</ul>
<div class="box"><b>Systems beat willpower</b><p>Automatic contributions, scheduled rebalancing, a written thesis per position, and an investment policy statement you wrote while calm. These remove the decision from the moment when your judgment is worst. That is the actual edge available to an individual investor — not information, not speed. Temperament, enforced by structure.</p></div>`}
]
});

tag:'A bond is a loan you make instead of take. You are the bank, and the borrower pays you interest.',
blurb:'Lending money for interest. How yields work, why bond prices fall when rates rise, and where they belong in a portfolio.',
deepTeaser:'Duration and interest-rate risk, the yield curve, the credit ladder, TIPS and I-bonds, munis and the tax-equivalent math, and how to build a ladder.',
basics:[
{h:'What a bond is', body:`
<p>Flip the mortgage on your house around. You borrow, you pay interest, the bank collects. A <strong>bond</strong> puts you on the bank's side of that deal. A government or a company needs money, so it borrows from investors and agrees in writing to pay interest on a schedule and return the original amount on a specific date.</p>
<p>Three numbers define almost any bond:</p>
<ul>
<li><strong>Face value (par)</strong> — the amount repaid at the end, typically $1,000 per bond.</li>
<li><strong>Coupon</strong> — the annual interest rate, usually paid in two installments. A 5% coupon on a $1,000 bond pays $50 a year, $25 twice a year.</li>
<li><strong>Maturity</strong> — the date you get your $1,000 back. Could be 90 days, could be 30 years.</li>
</ul>
<p>Hold to maturity and, barring default, you know your exact outcome the day you buy. That certainty is the entire product. Stocks have no such promise.</p>
<div class="box"><b>Why anyone owns them</b><p>Stocks are for growing money. Bonds are for keeping it and generating predictable income. A portfolio holding both usually falls less in bad years, which is not just emotional comfort — it means you are less likely to sell your stocks at the bottom.</p></div>`},

{h:'The one counterintuitive rule', body:`
<p><strong>When interest rates go up, existing bond prices go down.</strong> Everyone stumbles on this once. Here is why it has to be true.</p>
<p>You buy a $1,000 bond paying 3%. Six months later, new bonds of the same quality pay 5%. Nobody will pay you full price for a 3% bond when they can get 5% elsewhere — so to sell yours, you have to discount it until the buyer's effective return matches 5%. Your bond is now worth maybe $850.</p>
<p>Nothing went wrong. The issuer is fine, and if you hold to maturity you still get your $1,000 and every coupon. But the market value fell, and if you need to sell early, that loss is real.</p>
<div class="box warn"><b>This is not theoretical</b><p>In 2022, as the Fed raised rates at the fastest pace in decades, the total U.S. bond market lost about 13% — its worst year on record. "Safe" means the issuer will pay you back, not that the price cannot drop.</p></div>
<p>The longer the maturity, the bigger the swing. A 30-year bond can move violently on a rate change; a 3-month Treasury bill barely twitches. That sensitivity has a name — <em>duration</em> — and it is the first thing in the deep dive.</p>`},

{h:'The main types, safest to riskiest', body:`
<table>
<tr><th>Type</th><th>Who owes you</th><th>Key feature</th></tr>
<tr><td>Treasury bills, notes, bonds</td><td>U.S. federal government</td><td>The benchmark for "risk-free." Interest is exempt from state and local tax.</td></tr>
<tr><td>TIPS</td><td>U.S. government</td><td>Principal adjusts with inflation. Protects purchasing power, not just dollars.</td></tr>
<tr><td>Series I savings bonds</td><td>U.S. government</td><td>Bought directly at TreasuryDirect. Rate tracks inflation. $10,000 per person per year cap.</td></tr>
<tr><td>Municipal bonds</td><td>States, cities, agencies</td><td>Interest usually free of federal tax, and of state tax in your own state. Powerful in a high bracket.</td></tr>
<tr><td>Investment-grade corporate</td><td>Solid companies</td><td>Higher yield than Treasuries in exchange for real, if modest, default risk.</td></tr>
<tr><td>High-yield ("junk")</td><td>Weaker companies</td><td>Big yields, meaningful default risk, and they tend to fall when stocks fall — exactly when you needed the ballast.</td></tr>
</table>
<p>Ratings agencies (Moody's, S&amp;P, Fitch) grade credit quality. AAA down through BBB− is investment grade; BB+ and below is high yield. The rating is a useful shorthand and an imperfect one — agencies were spectacularly wrong on mortgage bonds in 2008.</p>`},

{h:'How to buy and sell', body:`
<ol class="steps">
<li><b>Easiest path: a bond fund or ETF</b> One purchase in your regular brokerage account buys a diversified basket — hundreds or thousands of bonds. Broad total-bond-market funds, short-term Treasury funds, and municipal funds all exist with expense ratios near 0.05%. Instant diversification, daily liquidity, and no minimum beyond one share.</li>
<li><b>Individual Treasuries, direct</b> TreasuryDirect.gov sells straight from the government with no fee and no middleman. It is also the only place to buy Series I bonds. The site is dated but it works.</li>
<li><b>Individual bonds through your broker</b> Fidelity, Schwab, and Vanguard all have bond desks where you can buy new issues and secondary-market bonds. New-issue Treasuries are typically commission-free; corporates and munis carry a markup baked into the price.</li>
<li><b>Selling before maturity</b> Bond funds sell like any ETF or mutual fund. Individual bonds trade over the counter, and the spread on a small retail lot can be wide — a real cost. If you might need the money early, favor funds or short maturities.</li>
</ol>
<div class="box"><b>Fund vs. individual bond — the actual difference</b><p>An individual bond has a maturity date, so you can hold through a price drop and get your par back. A bond fund never matures — it perpetually rolls into new bonds, so its price can stay down. In exchange, the fund gives you diversification and liquidity, and its yield adjusts upward as it buys new higher-rate bonds. For most people, funds win. For a specific known expense on a specific date, an individual bond maturing that year is cleaner.</p></div>`},

{h:'How much should you own', body:`
<p>The old rule of thumb was "your age in bonds" — 40 years old, 40% bonds. Most planners now consider that too conservative given longer lifespans; something like age minus 20 is a more common starting point. Neither is a law.</p>
<p>What actually drives the answer is <strong>when you need the money</strong> and <strong>what you can tolerate</strong>. Money needed in two years does not belong in stocks, period. Money you will not touch for 25 years can be heavily in stocks. And a portfolio you will actually stick with in a crash beats a theoretically optimal one you bail out of.</p>
<p>One more use worth naming: with short-term Treasury yields at meaningful levels, T-bills and money market funds have become a legitimate place to park an emergency fund or a house down payment — safe, liquid, and paying real interest instead of the near-zero your checking account offers.</p>`}
],

'Buying long-duration bonds for short-term money. A 20-year bond fund is not a savings account.',

deep:[
{h:'Duration: the number that predicts your pain', body:`
<p>Duration is expressed in years but it is really a sensitivity measure. <strong>Modified duration</strong> approximates the percentage price change for a 1% change in rates.</p>
<table>
<tr><th>Holding</th><th>Approx. duration</th><th>Price impact if rates rise 1%</th></tr>
<tr><td>3-month T-bill</td><td>0.25</td><td>−0.25%</td></tr>
<tr><td>2-year Treasury</td><td>~1.9</td><td>−1.9%</td></tr>
<tr><td>Total bond market fund</td><td>~6</td><td>−6%</td></tr>
<tr><td>20+ year Treasury fund</td><td>~16</td><td>−16%</td></tr>
<tr><td>30-year zero-coupon</td><td>30</td><td>−30%</td></tr>
</table>
<p>This is the single most useful bond number you can learn, and almost nobody checks it before buying a bond fund. It is published on every fund page. If you know your duration, you know your worst case in a rate shock.</p>
<p>Two refinements. <strong>Convexity</strong> means the relationship is curved, not linear — prices rise slightly more when rates fall than they drop when rates rise by the same amount, which works in your favor. And <strong>duration is also your recovery horizon</strong>: in a rising-rate environment, a fund with duration 6 roughly breaks even after about six years because reinvested coupons now earn the higher rate. Losses in a bond fund are temporary if your holding period exceeds its duration.</p>
<div class="box"><b>The practical rule</b><p>Match duration to your time horizon. Need the money in 3 years? Duration around 3. Retiring in 20? You can carry more. Mismatch is what turns a safe asset into a bad experience.</p></div>`},

{h:'The yield curve and what it is telling you', body:`
<p>Plot yield on the vertical axis and maturity on the horizontal, and you get the <strong>yield curve</strong>. Its shape is one of the most-watched signals in finance.</p>
<ul>
<li><strong>Normal (upward sloping).</strong> Longer money pays more, compensating you for time and uncertainty. This is the healthy default.</li>
<li><strong>Flat.</strong> Short and long yields converge. The market is uncertain about growth.</li>
<li><strong>Inverted.</strong> Short-term yields exceed long-term. This says the market expects the central bank to be cutting rates soon — which usually means it expects economic weakness. An inverted 10-year/2-year curve has preceded every U.S. recession in the past half century, though with lead times ranging from about 6 to 24 months and at least one false signal.</li>
</ul>
<p>Behind the shape sit three forces: expectations about future short rates, a <em>term premium</em> paid for locking money up, and supply/demand from the Treasury, the Fed, foreign central banks, and pensions. The Fed directly controls only the very short end; the long end is the market's collective forecast.</p>
<div class="box warn"><b>Do not trade on it alone</b><p>An inversion is a signal about probability, not timing. Markets have run higher for a year or more after inversions. It is useful for setting expectations and duration, not for calling a top.</p></div>`},

{h:'Credit risk and the yield you get paid for it', body:`
<p>Yield on any bond can be decomposed: the risk-free Treasury rate of the same maturity, plus a <strong>credit spread</strong> compensating you for the chance you do not get paid back.</p>
<p>Historical annual default rates run in the ballpark of a fraction of a percent for investment-grade issuers and a few percent for high yield — but those averages hide the pattern that matters: defaults cluster in recessions, exactly when your stocks are also down. That clustering is why high-yield bonds fail as portfolio ballast. They are best understood as equity risk with a bond label.</p>
<p><strong>Recovery rates</strong> matter too. Senior secured debt has historically recovered a substantial share of face value in bankruptcy; subordinated debt far less. Where you sit in the capital structure — senior secured, senior unsecured, subordinated, preferred, common equity — determines who gets paid first when there is not enough to go around. Equity holders are last, always.</p>
<p>Watch spreads as a market-wide fear gauge. When high-yield spreads over Treasuries compress toward historic lows, investors are being paid very little to take real risk — a reasonable moment to be cautious. When they blow out to 8, 10, 15 points, panic is priced in, and that is historically when forward returns on credit have been best. Uncomfortable, as usual.</p>`},

{h:'Inflation protection: TIPS and I-bonds', body:`
<p>A regular bond promises dollars. It promises nothing about what those dollars will buy. Two instruments fix that.</p>
<p><strong>TIPS.</strong> The principal adjusts with CPI. The coupon rate is fixed but applies to the adjusted principal, so both your interest payment and your final repayment rise with inflation. The quoted yield on a TIPS is a <em>real</em> yield — your return above inflation. The gap between a nominal Treasury yield and a TIPS yield of the same maturity is the market's expected inflation rate, called the <em>breakeven</em>. Buy TIPS if you think actual inflation will exceed the breakeven.</p>
<div class="box warn"><b>TIPS tax quirk</b><p>The annual inflation adjustment to principal is taxable federally in the year it happens, even though you do not receive that cash until maturity. This "phantom income" is why TIPS are usually better held inside an IRA or 401(k).</p></div>
<p><strong>Series I savings bonds.</strong> Bought only at TreasuryDirect. The rate combines a fixed component (locked for the life of the bond) with an inflation component that resets every six months. Limits are $10,000 per person per calendar year. You cannot redeem in the first 12 months, and redeeming before 5 years forfeits the last 3 months of interest. Tax is federal-only and deferred until you cash out. For an emergency fund tier beyond your first few months of cash, they are hard to beat.</p>`},

{h:'Municipal bonds and the math that decides it', body:`
<p>Muni interest is generally exempt from federal income tax, and from state tax if you buy bonds issued in your own state. So a 3.5% muni can beat a 4.5% corporate — it depends entirely on your bracket.</p>
<div class="box"><b>Tax-equivalent yield</b><p><strong>TEY = muni yield ÷ (1 − your marginal tax rate)</strong></p><p>A 3.5% muni in the 32% federal bracket: 0.035 ÷ 0.68 = <strong>5.15%</strong> tax-equivalent. That beats a 4.5% taxable corporate handily. The same muni in the 12% bracket: 3.98% — and now the corporate wins. Munis are a high-bracket instrument; run this number rather than assuming.</p></div>
<p>Two categories: <strong>general obligation</strong> bonds backed by the issuer's taxing power, and <strong>revenue</strong> bonds backed only by a specific project's income — a toll road, a stadium, a hospital. Revenue bonds carry the project's risk, not the government's full faith. Default rates on investment-grade munis have historically been very low, but Detroit and Puerto Rico are reminders that "very low" is not "zero."</p>
<p>One trap: muni interest counts in the calculation that determines how much of your Social Security is taxable, and can affect Medicare IRMAA surcharges. "Tax-free" is not always fully free.</p>`},

{h:'Building a ladder', body:`
<p>A <strong>bond ladder</strong> is a set of individual bonds maturing in consecutive years. Say $60,000 split into six $10,000 rungs maturing in each of the next six years. Every year one matures; you either spend that cash or roll it into a new 6-year rung at whatever rates are then.</p>
<p>What it buys you:</p>
<ul>
<li><strong>No rate-timing bet.</strong> You are continuously averaging into whatever the rate environment is, the same logic as dollar-cost averaging.</li>
<li><strong>Predictable liquidity.</strong> Cash arrives on a known schedule, so you are never forced to sell into a bad market.</li>
<li><strong>Defined outcomes.</strong> Every rung has a known maturity value, which a bond fund cannot give you.</li>
</ul>
<p>Costs: it takes effort, needs enough capital to diversify credit risk (do it with Treasuries and that concern disappears), and small retail lots of corporates or munis carry ugly spreads. <strong>Defined-maturity ETFs</strong> — funds that hold bonds all maturing in one target year and then liquidate — are a legitimate hybrid, giving you ladder mechanics with fund-level diversification.</p>
<p>Common real-world use: a retiree ladders the next 5–10 years of spending in Treasuries, which lets the stock portion of the portfolio ride through a bad stretch without being sold. That structure, more than any allocation formula, is what makes a drawdown survivable.</p>`}
]

TOPICS.push({
id:'retirement', icon:'🎯', c:'#f2a33c', lvl:'Highest priority', name:'Retirement Accounts',
tag:'Not investments — containers. The same investments held inside them are worth dramatically more, because the tax treatment changes everything.',
blurb:'401(k)s, IRAs, Roth vs. traditional, employer matches, and the order of operations that gets the most out of every dollar.',
deepTeaser:'The full funding order, Roth conversions and the backdoor, RMDs, the HSA triple advantage, early-access strategies, and rollover rules that can cost you 20% if you get them wrong.',
basics:[
{h:'The key idea: container, not investment', body:`
<p>People say "I have my money in a 401(k)" the way they would say "I have my money in stocks." Different category. A 401(k) or IRA is a <strong>wrapper</strong> — a legal container that holds investments and changes how they are taxed. Inside it you still choose stocks, bonds, and funds.</p>
<p>The wrapper is worth a lot. In a regular taxable account you pay tax on dividends and on every realized gain along the way. Inside a retirement account, that friction disappears — growth compounds untouched for decades. Same investments, materially different ending number.</p>
<div class="box"><b>Two tax deals, pick your poison</b><p><strong>Traditional:</strong> deduct the contribution now, pay ordinary income tax on every dollar you withdraw later. Tax break today.</p><p><strong>Roth:</strong> contribute after-tax money, and every dollar of growth and withdrawal comes out completely tax-free in retirement. Tax break later.</p></div>`},

{h:'The main accounts', body:`
<table>
<tr><th>Account</th><th>Who it is for</th><th>The point</th></tr>
<tr><td>401(k) / 403(b) / 457</td><td>Employees (403b for nonprofits and schools, 457 for government)</td><td>High contribution limits, payroll-automatic, and often an employer match</td></tr>
<tr><td>Traditional IRA</td><td>Anyone with earned income</td><td>Deduction now (subject to income limits if you have a workplace plan), taxed on withdrawal</td></tr>
<tr><td>Roth IRA</td><td>Anyone under the income limit</td><td>Tax-free growth and tax-free withdrawals. Contributions can come out anytime, penalty-free</td></tr>
<tr><td>SEP-IRA / Solo 401(k)</td><td>Self-employed, side business owners</td><td>Very high limits for freelance or contract income</td></tr>
<tr><td>HSA</td><td>Anyone on a high-deductible health plan</td><td>Deductible in, tax-free growth, tax-free out for medical. The best tax deal in the code</td></tr>
</table>
<p>Contribution limits change annually with inflation, and catch-up contributions kick in at 50. Check the current-year numbers on irs.gov rather than trusting any article, including this one.</p>`},

{h:'The employer match — do this first, always', body:`
<p>Many employers match a portion of what you contribute. A common formula: 100% of the first 3% of your salary, then 50% of the next 2%.</p>
<p>On an $80,000 salary, contributing 5% is $4,000 of your money, and the employer adds $3,200. That is an <strong>80% instant return</strong>, guaranteed, before the market does anything. There is no other investment on earth that does this.</p>
<div class="box warn"><b>Not contributing enough to get the full match is leaving cash on the table.</b><p>If you do exactly one thing after reading this page, log into your plan and confirm your contribution rate is at least high enough to capture the entire match.</p></div>
<p><strong>Vesting</strong> is the catch. Your own contributions are always 100% yours. The employer's portion may require you to stay a few years — either cliff vesting (0% until year three, then 100%) or graded (20% per year). Know your schedule before you consider changing jobs; walking away six months early can cost thousands.</p>`},

{h:'Roth or traditional?', body:`
<p>The clean version of the decision: <strong>pay tax at the lower rate.</strong></p>
<ul>
<li>If your tax rate today is <strong>lower</strong> than you expect it to be in retirement → <strong>Roth</strong>. Pay the cheap tax now.</li>
<li>If your rate today is <strong>higher</strong> than in retirement → <strong>traditional</strong>. Take the deduction at the high rate, pay at the low one.</li>
</ul>
<p>Which usually means: early career, lower bracket, or a long runway of compounding ahead → Roth. Peak earning years in a high bracket → traditional, at least for the workplace plan.</p>
<p>Nobody knows future tax rates, yours or the country's. Which is the honest argument for <strong>holding both</strong>. Having traditional and Roth money in retirement lets you control your taxable income year by year — pulling from Roth to stay under a bracket threshold, an ACA subsidy cliff, or a Medicare premium tier. That flexibility is worth real money.</p>
<div class="box"><b>Roth's underrated features</b><p>Roth IRA <strong>contributions</strong> (not earnings) can be withdrawn at any time, for any reason, with no tax or penalty — they were already taxed. That makes a Roth IRA a reasonable backstop emergency reserve. Roth IRAs also have <strong>no required minimum distributions</strong> during your lifetime, so the money can compound untouched as long as you want and pass to heirs efficiently.</p></div>`},

{h:'The order of operations', body:`
<ol class="steps">
<li><b>401(k) up to the full employer match</b> Free money, immediate, guaranteed. Nothing beats it.</li>
<li><b>Kill high-interest debt</b> Paying off a 22% credit card is a guaranteed 22% return. No investment reliably offers that.</li>
<li><b>Emergency fund: 3–6 months of expenses</b> In a high-yield savings account, money market fund, or T-bills. This is what keeps a bad month from becoming a 401(k) loan.</li>
<li><b>Max the HSA if you have one</b> Deductible going in, tax-free growth, tax-free out for qualified medical costs. Pay current medical bills out of pocket, save the receipts, and let the HSA compound — you can reimburse yourself decades later.</li>
<li><b>Max a Roth IRA (or backdoor Roth if over the income limit)</b> Better investment options than most 401(k) menus, and tax-free forever.</li>
<li><b>Max the 401(k) to the annual limit</b> Big deduction, big compounding.</li>
<li><b>Taxable brokerage account</b> No limits, full flexibility, and long-term capital gains rates are still favorable.</li>
</ol>
<p>This order is not arbitrary — it goes from highest guaranteed return to lowest. Adjust it for your own situation, but understand what you are giving up when you skip a rung.</p>`},

{h:'Getting the money out', body:`
<p><strong>59½</strong> is the general age when withdrawals stop carrying the 10% early-withdrawal penalty. Take money out before that and you typically owe income tax plus 10%, though exceptions exist (disability, certain medical expenses, a first home up to $10,000 from an IRA, substantially equal periodic payments, and the "rule of 55" for a 401(k) at the job you just left).</p>
<p><strong>Required minimum distributions (RMDs)</strong> force money out of traditional accounts starting in your mid-70s, whether you want it or not, and it is taxed as ordinary income. Roth IRAs are exempt. RMDs are a big reason people do Roth conversions in their 60s.</p>
<div class="box warn"><b>The rollover trap</b><p>Changing jobs? Do a <strong>direct (trustee-to-trustee) rollover</strong>. If the check comes to you instead, the plan withholds 20% and you have 60 days to deposit the full original amount — including the 20% you never received — or the shortfall is treated as a taxable distribution with a penalty. Ask for a direct rollover, in those words, every time.</p></div>`}
],

deep:[
{h:'Roth conversions: the retirement lever most people miss', body:`
<p>A <strong>Roth conversion</strong> moves money from a traditional IRA or 401(k) into a Roth. You pay ordinary income tax on the converted amount this year, and everything after that is tax-free forever, with no RMDs.</p>
<p>The play is to convert during low-income years and fill up the cheap brackets deliberately.</p>
<div class="box"><b>The classic window</b><p>Between retiring (say 62) and starting Social Security and RMDs (67–75), many people have unusually low taxable income. Converting enough each year to fill the 12% and 22% brackets during that window can move a large traditional balance to Roth at a much lower rate than the RMDs would have been taxed at later. Done systematically, this is often a six-figure lifetime tax saving.</p></div>
<p>Things to get right:</p>
<ul>
<li><strong>Pay the tax from outside funds.</strong> Using converted dollars to cover the tax bill defeats much of the benefit and can trigger a penalty if you are under 59½.</li>
<li><strong>Each conversion has its own 5-year clock</strong> before converted principal can be withdrawn penalty-free (separate from the 5-year rule for Roth earnings).</li>
<li><strong>Watch the second-order effects.</strong> Conversion income can push more of your Social Security into taxable territory, raise Medicare IRMAA premiums two years later, and affect ACA subsidies. Model it before you pull the trigger.</li>
<li><strong>Recharacterization is gone.</strong> Since 2018 you cannot undo a conversion. Measure twice.</li>
</ul>`},

{h:'The backdoor Roth and the pro-rata rule', body:`
<p>Roth IRAs have income limits. High earners get around them legally: contribute to a <strong>traditional IRA nondeductibly</strong>, then <strong>convert to Roth</strong>. There is no income limit on conversions. Congress has been aware of this for over a decade and has not closed it.</p>
<p>Straightforward, with one landmine.</p>
<div class="box warn"><b>The pro-rata rule</b><p>The IRS treats all your traditional, SEP, and SIMPLE IRAs as one pot when calculating the tax on a conversion. If you have $93,000 of pre-tax IRA money and add a $7,000 nondeductible contribution, then convert $7,000, only 7% of that conversion is treated as the after-tax money. The other 93% is taxable income. Note this counts IRAs only — 401(k) balances are excluded.</p></div>
<p><strong>The standard fix:</strong> roll your existing pre-tax IRA balances <em>into</em> your current employer 401(k) first, if the plan accepts incoming rollovers. That empties the IRA pot, and the backdoor conversion becomes essentially tax-free. File Form 8606 for the nondeductible contribution every year, and keep those forms — the basis tracking is on you, not your custodian.</p>
<p><strong>Mega backdoor Roth:</strong> if your 401(k) allows after-tax contributions (a distinct category from Roth 401(k) deferrals) plus in-service withdrawals or in-plan conversions, you can push a large additional amount into Roth space each year, well beyond the normal deferral limit. Rare in plan documents, enormous when available. Search your summary plan description for "after-tax contributions" and "in-service distribution."</p>`},

{h:'The HSA is the best account in the tax code', body:`
<p>Every other account gives you a tax break on one end. The HSA gives you three: <strong>contributions are deductible</strong>, <strong>growth is untaxed</strong>, and <strong>qualified medical withdrawals are untaxed</strong>. Nothing else does all three. Payroll contributions also escape FICA, which no IRA or 401(k) contribution does.</p>
<p>To qualify you must be enrolled in a high-deductible health plan and not on Medicare.</p>
<div class="box"><b>The strategy most people miss</b><p>Do not use the HSA as a checking account for copays. Invest the balance in index funds, pay current medical costs out of pocket, and <strong>keep every receipt</strong>. There is no deadline on reimbursement — a qualified expense from 2026 can be reimbursed tax-free in 2050, after the money compounded for 24 years. You are effectively converting an unlimited-horizon investment account into tax-free money.</p></div>
<p>After 65, non-medical withdrawals are allowed and taxed as ordinary income with no penalty — so the worst case is that your HSA behaves like a traditional IRA. Meanwhile, given that healthcare is one of the largest retirement expenses most households face, the odds you never need the medical use case are low.</p>
<p>Two cautions: HSAs are not exempt from state tax everywhere (California and New Jersey have historically not conformed), and an HSA inherited by a non-spouse loses its tax status entirely — worth naming a spouse as beneficiary where possible.</p>`},

{h:'Getting at the money before 59½', body:`
<p>Retiring early does not mean your money is locked up. There are legitimate paths.</p>
<ul>
<li><strong>Rule of 55.</strong> Separate from service in or after the calendar year you turn 55, and you can take penalty-free distributions from <em>that employer's</em> 401(k). Critically, this does not apply if you roll it into an IRA first — so if early access matters, leave it in the plan.</li>
<li><strong>72(t) / SEPP.</strong> Substantially equal periodic payments from an IRA, calculated by an IRS-approved method, taken for the longer of five years or until 59½. Rigid: modify the schedule and retroactive penalties apply to everything.</li>
<li><strong>Roth contribution basis.</strong> Your direct Roth IRA contributions come out anytime, tax- and penalty-free. Ordering rules pull contributions first, then conversions, then earnings.</li>
<li><strong>Roth conversion ladder.</strong> The standard early-retirement approach. Convert a year's worth of expenses from traditional to Roth each year; after each conversion seasons five years, that amount can be withdrawn penalty-free. Start the ladder five years before you need the first dollar, and bridge the gap with taxable-account money.</li>
<li><strong>Other exceptions:</strong> total disability, medical expenses above the AGI threshold, health insurance premiums while unemployed, qualified higher education (IRA only), $10,000 lifetime for a first home (IRA only), birth or adoption up to $5,000, and certain federally declared disasters.</li>
</ul>
<div class="box"><b>Withdrawal sequencing in retirement</b><p>The conventional order is taxable first, then traditional, then Roth — but the optimized version deliberately blends: take enough from traditional each year to fill the low brackets (or convert to Roth), use taxable and Roth to top off spending without crossing a bracket, IRMAA tier, or subsidy cliff. Managing your taxable income year by year is the highest-value financial work of early retirement.</p></div>`},

{h:'What is actually inside your 401(k)', body:`
<p>The account is a container. What you hold in it determines the outcome, and plan menus vary from excellent to predatory.</p>
<ul>
<li><strong>Find the expense ratios.</strong> They are in the plan documents or on the fund page. A 1.0% fund versus a 0.05% index fund costs you roughly 20–25% of your final balance over a 30-year career. That is not a rounding error; that is years of retirement.</li>
<li><strong>Watch for revenue sharing and "administrative fees."</strong> Some plans layer a wrap fee on top of fund expenses. It shows up in the annual fee disclosure the plan is legally required to send you.</li>
<li><strong>Target-date funds are a reasonable default</strong> if the expense ratio is low — one fund, automatically rebalanced, glide path built in. But glide paths differ meaningfully between providers, and "2050" from one firm can hold noticeably more or less equity than another firm's 2050.</li>
<li><strong>Brokerage window.</strong> Some plans offer a self-directed option that unlocks the full market. Useful if the core menu is bad; check for extra fees.</li>
<li><strong>Company stock and NUA.</strong> If you hold appreciated employer stock in a 401(k), <em>net unrealized appreciation</em> treatment can let you pay ordinary income tax only on the original cost basis and long-term capital gains on the appreciation when you distribute it in kind. Powerful and easy to blow — this is a "talk to a CPA before you touch it" item. Separately: concentration in your employer's stock means your job and your savings share one point of failure.</li>
</ul>`},

{h:'Social Security, briefly but correctly', body:`
<p>It is a meaningful part of most retirement plans and the claiming decision is one of the largest single financial choices most people make.</p>
<p>Your benefit is calculated from your highest 35 years of indexed earnings. Fewer than 35 years of work means zeros get averaged in. Full retirement age is 67 for anyone born in 1960 or later.</p>
<table>
<tr><th>Claim at</th><th>Effect on monthly benefit</th></tr>
<tr><td>62 (earliest)</td><td>Roughly 30% less, permanently</td></tr>
<tr><td>67 (full retirement age)</td><td>100% of your calculated benefit</td></tr>
<tr><td>70 (latest worth waiting for)</td><td>Roughly 24% more, permanently, plus COLA on the larger base</td></tr>
</table>
<p>Delaying from 67 to 70 is effectively an inflation-adjusted, government-backed annuity yielding about 8% a year for those three years. Nothing in the private market matches that risk-adjusted. The break-even against claiming early typically lands in the early-to-mid 80s.</p>
<p>For a married couple, the higher earner's benefit becomes the survivor benefit — so delaying the <em>higher</em> earner's claim protects the surviving spouse for the rest of their life. That is usually the single most valuable Social Security decision a couple makes. Create an account at ssa.gov and check your earnings record for errors; they do happen, and fixing them later is harder.</p>`}
]

tag:'A contract that gives you the right to buy or sell 100 shares at a set price before a set date. Used well, it is insurance. Used badly, it is a countdown clock attached to your money.',
blurb:'Calls, puts, and what the premium actually pays for. The three legitimate jobs options do, and the ways people lose money doing them.',
deepTeaser:'Intrinsic vs. extrinsic value, the Greeks in plain English, implied volatility and IV crush, the core strategies ranked by risk, assignment mechanics, and the 60/40 tax rule most traders never hear about.',
basics:[
{h:'What an option actually is', body:`
<p>An option is a <strong>contract between two people</strong>. One side pays for a right; the other side gets paid to take on an obligation. That is the whole structure, and almost every mistake comes from forgetting which side you are on.</p>
<p>One contract controls <strong>100 shares</strong>. It has four defining pieces:</p>
<ul>
<li><strong>Type</strong> — a <em>call</em> (right to buy) or a <em>put</em> (right to sell).</li>
<li><strong>Strike price</strong> — the price the contract locks in.</li>
<li><strong>Expiration date</strong> — when the right disappears. After that the contract is worth exactly zero.</li>
<li><strong>Premium</strong> — what you pay or receive for the contract, quoted per share. A premium of $2.40 costs $240 for one contract.</li>
</ul>
<div class="box"><b>The one-sentence version</b><p>A call is a <strong>coupon</strong> — the right to buy something at a fixed price whether or not it goes up. A put is an <strong>insurance policy</strong> — the right to sell at a fixed price even if the thing collapses. In both cases the premium is what the coupon or the policy costs, and it expires.</p></div>
<p>Options are the same instrument farmers have used for a century to lock in a crop price and airlines use to lock in fuel costs. Nothing about them is inherently reckless. What is reckless is a specific way of using them, covered below.</p>`},

{h:'Calls and puts, with real numbers', body:`
<p><strong>Buying a call.</strong> Stock trades at $50. You buy one $55 call expiring in three months for $2.00 — total cost $200. You now have the right to buy 100 shares at $55 anytime before expiration.</p>
<table>
<tr><th>Stock at expiration</th><th>What your call is worth</th><th>Your P/L</th></tr>
<tr><td>$45</td><td>$0 — nobody buys at $55 when the market is $45</td><td>−$200 (total loss)</td></tr>
<tr><td>$55</td><td>$0</td><td>−$200</td></tr>
<tr><td>$57</td><td>$200</td><td>$0 — breakeven is strike + premium</td></tr>
<tr><td>$65</td><td>$1,000</td><td>+$800</td></tr>
</table>
<p>Notice the shape. Your maximum loss is the $200 you paid — that is real and it is capped. Your upside is uncapped. But you needed the stock to move more than 14% in three months just to break even. <strong>Being right about direction is not enough; you have to be right about direction, size, and timing simultaneously.</strong></p>
<p><strong>Buying a put</strong> is the mirror. You own 100 shares at $50 and buy a $45 put for $1.50. If the stock crashes to $30, your shares lost $2,000 but your put is worth $1,500. You paid $150 for that protection. That is portfolio insurance, and it works exactly like the insurance on your car — most years you pay the premium and nothing happens.</p>
<div class="box"><b>Selling instead of buying</b><p>Every option bought was sold by someone. The <strong>seller</strong> (or "writer") collects the premium up front and takes on the obligation: a call seller must deliver 100 shares if assigned, a put seller must buy 100 shares. Sellers win most of the time and lose big occasionally; buyers lose most of the time and win big occasionally. Neither side is free money — the premium is priced so both are roughly fair, minus the spread.</p></div>`},

{h:'The three jobs options do', body:`
<p>Conflating these is how people get hurt. They are genuinely different activities that happen to use the same instrument.</p>
<ol class="steps">
<li><b>Hedging — buying protection</b> You own something and want to cap the downside. Buying puts on a large position, or a <em>collar</em> (buy a put, sell a call to pay for it) around a concentrated holding like employer stock. Conservative, deliberate, and the original purpose of the entire market.</li>
<li><b>Income — getting paid to accept an obligation</b> Selling a <em>covered call</em> against 100 shares you already own collects premium in exchange for capping your upside above the strike. Selling a <em>cash-secured put</em> collects premium in exchange for agreeing to buy a stock you already wanted at a lower price. Real strategies with honest trade-offs: you get paid now and give something up later.</li>
<li><b>Speculation — buying leverage with a timer</b> Buying short-dated out-of-the-money calls because you expect a jump this week. This is where most retail money goes and where most of it dies. Time decay works against you every single day, and a large majority of these contracts expire worthless.</li>
</ol>
<div class="box warn"><b>The number that should shape your expectations</b><p>Roughly 90% of the money individual investors put into short-dated out-of-the-money options is lost over time. Not because the market is rigged — because the position requires a large move in a short window, and the premium already prices in the probability of that move. You are not getting an edge; you are paying for a lottery ticket with a spread on it.</p></div>`},

{h:'How to actually trade one', body:`
<ol class="steps">
<li><b>Get approval from your broker</b> Options require an application and brokers assign tiers — typically Level 1 (covered calls, protective puts), Level 2 (buying calls and puts), Level 3 (spreads), Level 4 (naked selling). They ask about income, net worth, and experience. The tiers exist because the risk genuinely escalates.</li>
<li><b>Read the chain</b> The options chain lists every strike and expiration. Calls on one side, puts on the other, with bid, ask, volume, open interest, and implied volatility for each. Only trade contracts with real volume — a wide bid/ask spread is a guaranteed loss the moment you enter.</li>
<li><b>Always use limit orders</b> Never a market order on an option. Spreads can be 5–10% of the contract value; a market order hands that away instantly. Start at the mid-price and work toward the ask.</li>
<li><b>Understand what "buy to open" means</b> Four actions: buy to open, sell to close (you were long), sell to open, buy to close (you were short). Picking the wrong one can leave you short a contract you thought you closed.</li>
<li><b>Know how you exit before you enter</b> Most options are closed by trading them, not exercised. You sell the contract back for whatever it is worth. Set a profit target and a loss limit in advance — options move fast enough that improvising is expensive.</li>
<li><b>Watch expiration week</b> In-the-money options are automatically exercised at expiration by default. If you do not have the cash or shares to cover that, close the position before the final bell. Assignment surprises are a very common and very avoidable disaster.</li>
</ol>`},

{h:'Where to actually start', body:`
<p>If you want to use options and you are starting from zero, there is a defensible progression. It goes from "gets paid for taking a risk you already accept" to "requires you to be right about the future."</p>
<table>
<tr><th>Step</th><th>Strategy</th><th>What you are really doing</th></tr>
<tr><td>1</td><td>Covered call</td><td>You own 100 shares. You get paid to promise to sell them at a higher price. Worst case: you sell a winner too early</td></tr>
<tr><td>2</td><td>Cash-secured put</td><td>You have cash set aside. You get paid to promise to buy a stock you wanted anyway, at a lower price. Worst case: you own a stock that kept falling</td></tr>
<tr><td>3</td><td>Protective put / collar</td><td>You are buying insurance on a position that matters to you</td></tr>
<tr><td>4</td><td>Vertical spreads</td><td>Defined risk, defined reward, cheaper than buying a naked option. Requires an actual view</td></tr>
<tr><td>5</td><td>Everything else</td><td>Only after you have run the above through a full market cycle</td></tr>
</table>
<div class="box"><b>Rules that keep this from getting expensive</b><p>Trade one contract until the mechanics are boring. Never risk more on options than you would be fine losing entirely. Keep total options exposure to a small slice of the portfolio — think 5%, not 30%. Avoid earnings week until you understand IV crush. And never sell a naked call: the loss is theoretically unlimited, and that is not a figure of speech.</p></div>
<p>None of this replaces the core of a portfolio. Options are a tool for shaping risk on positions you already have or want. They are not an investment strategy on their own, and treating them as one is the single most common path to a large loss in a small amount of time.</p>`}
],
