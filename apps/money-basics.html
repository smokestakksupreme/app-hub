a posición que ya tienes. Costo: le pones tope a la ganancia, y te quitan justo las ganadoras</td></tr>\n<tr><td><strong>Put cubierta con efectivo</strong></td><td>Vendes una put, guardas efectivo para comprar</td><td>El strike menos la prima, si se va a cero</td><td>Legítima si de verdad quieres las acciones a ese precio. Ilegítima como puro esquema de ingresos sobre acciones que no tendrías</td></tr>\n<tr><td><strong>Put protectora</strong></td><td>Tienes acciones, compras una put</td><td>La prima más la distancia hasta el strike</td><td>Un seguro de verdad. Cara si la usas todo el tiempo; apropiada alrededor de un evento conocido o de una posición concentrada</td></tr>\n<tr><td><strong>Collar</strong></td><td>Tienes acciones, compras una put, vendes una call</td><td>Definida por el strike de la put</td><td>A menudo con costo casi cero gracias al sesgo. La herramienta estándar para alguien sentado sobre una posición grande en acciones de su empleador</td></tr>\n<tr><td><strong>Spread vertical</strong></td><td>Compras un strike, vendes otro</td><td>El débito neto pagado</td><td>La estructura minorista más subestimada. Más barata que una compra suelta, riesgo definido, y reduce la exposición a vega</td></tr>\n<tr><td><strong>La rueda</strong></td><td>Puts cubiertas con efectivo hasta que te asignen, luego calls cubiertas</td><td>Quedarte con una acción que cae</td><td>Funciona en mercados planos o al alza con nombres de calidad. En una caída de verdad simplemente estás largo en la acción con pasos extra</td></tr>\n<tr><td><strong>Iron condor</strong></td><td>Vendes un spread de calls y uno de puts</td><td>El ancho del spread más amplio menos el crédito</td><td>Gana con que no pase nada. Muchas ganancias pequeñas, alguna pérdida grande de vez en cuando. Requiere una disciplina que la mayoría no tiene</td></tr>\n<tr><td><strong>Spread calendario</strong></td><td>Vendes el vencimiento cercano, compras el lejano, mismo strike</td><td>Débito neto</td><td>Una apuesta al desgaste por tiempo y a que suba la IV. Genuinamente complejo; conoce tu vega antes de tocarlo</td></tr>\n<tr><td><strong>LEAPS / PMCC</strong></td><td>Compras una call muy dentro del dinero y de largo plazo, y opcionalmente vendes calls de corto plazo contra ella</td><td>El débito pagado</td><td>Un sustituto de la acción eficiente en capital. Riesgo real: no hay dividendos, y una tesis de varios años igual puede vencer</td></tr>\n<tr><td><strong>Call descubierta</strong></td><td>Vendes una call sin tener las acciones</td><td><strong>Teóricamente ilimitada</strong></td><td>No lo hagas</td></tr>\n</table>\n<div class=\"box\"><b>Elegir la operación</b><p>Haz que la estructura coincida con el entorno. <strong>IV rank alto</strong> → conviene vender prima (calls cubiertas, spreads de crédito, puts cubiertas con efectivo). <strong>IV rank bajo</strong> → conviene comprar (calls/puts compradas, spreads de débito, calendarios). Opinión direccional fuerte → verticales. Solo quieres cubrirte → put protectora o collar. Si no puedes nombrar en cuál de esas cuatro situaciones estás, no tienes una operación, tienes una corazonada.</p></div>"},{"h":"Asignación, ejercicio y mecánica del vencimiento","body":"\n<p>El lado operativo, donde ocurren los desastres evitables.</p>\n<ul>\n<li><strong>Estilo americano vs. europeo.</strong> Casi todas las opciones sobre acciones individuales son americanas — el tenedor puede ejercer en cualquier momento antes del vencimiento. La mayoría de las opciones sobre índices (SPX, NDX) son europeas, ejercibles solo al vencimiento, lo que elimina por completo el riesgo de asignación anticipada. Esa diferencia por sí sola es una buena razón para usar opciones sobre índices en ciertas estrategias.</li>\n<li><strong>Ejercicio automático.</strong> La cámara de compensación ejerce automáticamente las opciones que terminan más de $0.01 dentro del dinero. Si estás corto y está dentro del dinero, cuenta con que te van a asignar. Si estás largo y no puedes pagar 100 acciones, ciérrala antes del cierre del día de vencimiento.</li>\n<li><strong>Asignación anticipada por dividendos.</strong> El único escenario predecible de asignación anticipada: si estás corto en una call y el valor extrínseco que queda es menor que el dividendo próximo, da por hecho que te van a asignar el día antes de la fecha ex-dividendo. Revisa las fechas ex-dividendo antes de vender calls cubiertas, siempre.</li>\n<li><strong>Riesgo de pin (pin risk).</strong> La acción cierra casi exactamente en tu strike. No sabes si te van a asignar hasta después del horario de mercado, lo que te deja con una exposición inesperada durante el fin de semana. Cierra las posiciones que estén cerca del strike en vez de apostar a ver qué pasa.</li>\n<li><strong>La asignación es aleatoria.</strong> La OCC asigna a los brókers, y los brókers asignan a las cuentas con su propio método. Estar corto no significa que te asignen en el instante en que la opción entra al dinero — normalmente pasa cuando el valor extrínseco ya casi desapareció.</li>\n<li><strong>Los spreads se pueden romper.</strong> Si la pata corta de tu spread es asignada anticipadamente, ahora tienes acciones más una opción comprada, no una posición de riesgo definido, y tu bróker puede emitir una llamada de margen antes de que siquiera lo hayas visto.</li>\n</ul>\n<div class=\"box warn\"><b>Nunca dejes que un spread llegue al vencimiento dentro del dinero</b><p>La pesadilla: la pata corta es asignada, la pata larga vence o se ejerce en otro momento, y cargas con una posición grande en acciones sin cobertura de un día para otro. Cierra los spreads antes del día de vencimiento. Los últimos centavos de ganancia no valen el riesgo de gap.</p></div>"},{"h":"Impuestos — la parte que casi nadie conoce","body":"\n<p>La tributación de las opciones tiene una regla genuinamente valiosa y varias trampas.</p>\n<div class=\"box\"><b>Section 1256: la regla 60/40</b><p>Las opciones sobre <strong>índices</strong> amplios (SPX, NDX, RUT, VIX y similares) son contratos Section 1256. Las ganancias tributan <strong>60% como largo plazo y 40% como corto plazo sin importar cuánto tiempo las hayas tenido</strong> — aunque la operación haya durado una hora. Para un trader activo en un tramo impositivo alto, esto es una tasa efectiva bastante más baja que operar opciones sobre SPY, que tributan como ganancias ordinarias de corto plazo. La misma exposición subyacente, un resultado después de impuestos materialmente distinto.</p><p>La contrapartida: los contratos 1256 se valoran <em>a precio de mercado</em> al cierre del año, o sea que pagas impuestos sobre ganancias no realizadas al 31 de diciembre. Las pérdidas se pueden aplicar retroactivamente tres años contra ganancias 1256 anteriores, lo cual es inusual y útil.</p></div>\n<ul>\n<li><strong>Las opciones sobre acciones individuales</strong> siguen las reglas normales de ganancias de capital. Un año o menos significa corto plazo, que tributa como ingreso ordinario. Casi todas las operaciones con opciones son de corto plazo por naturaleza.</li>\n<li><strong>Las reglas de wash sale aplican</strong>, y aplican <em>entre</em> instrumentos distintos. Vender una acción con pérdida y comprar una call del mismo nombre dentro de 30 días activa la regla, igual que cerrar una opción con pérdida y volver a abrir una sustancialmente idéntica.</li>\n<li><strong>Las calls cubiertas te pueden costar un dividendo calificado.</strong> Vender una call cubierta muy dentro del dinero puede suspender el período de tenencia de las acciones subyacentes, convirtiendo un dividendo que de otro modo sería calificado en ingreso ordinario y poniendo en riesgo el tratamiento de largo plazo sobre la acción.</li>\n<li><strong>La asignación ajusta la base de costo.</strong> La prima cobrada por una put asignada reduce tu base de costo en las acciones; la prima de una call cubierta asignada aumenta tus ingresos por la venta. La mayoría de los brókers lo maneja automáticamente, pero vale la pena verificarlo.</li>\n<li><strong>Las opciones dentro de una IRA</strong> evitan todo esto — no hay wash sales que rastrear, ni tasas de corto plazo. La mayoría de los brókers permite calls cubiertas y puts cubiertas con efectivo en una IRA, aunque no la venta descubierta ni la mayoría de los spreads que usan margen.</li>\n</ul>"},{"h":"Qué revienta las cuentas de verdad","body":"\n<p>Las opciones no destruyen cuentas por sí solas. Cuatro conductas específicas sí lo hacen, y son lo bastante predecibles como para dejarlas por escrito.</p>\n<ol>\n<li><strong>Riesgo indefinido en tamaño grande.</strong> Calls descubiertas, puts descubiertas sobre un nombre apalancado, o strangles vendidos dimensionados como si la cola nunca llegara. La estrategia funciona durante meses, que es justamente lo que hace grande la pérdida final — el tamaño de la posición crece con la confianza hasta el momento exacto del gap.</li>\n<li><strong>Confundir apalancamiento con tamaño de posición.</strong> $10,000 en calls compradas pueden cargar la exposición direccional de $150,000 en acciones. La gente mira el monto en dólares que gastó y nunca calcula el delta. Calcula el delta.</li>\n<li><strong>Negarse a asumir una pérdida definida.</strong> Rolar una posición perdedora hacia adelante y hacia abajo, una y otra vez, convierte una pérdida de $400 en una de $6,000. La prima que cobras cada vez se siente como progreso y en realidad solo está financiando el error original.</li>\n<li><strong>0DTE como rutina.</strong> La gamma cerca del vencimiento es enorme, así que los resultados son casi binarios y están completamente desconectados de cualquier análisis que hayas hecho. Es la actividad con expectativa negativa más consistente que tiene disponible una cuenta minorista.</li>\n</ol>\n<div class=\"box\"><b>Los arreglos estructurales</b><p>Ponle un tope a la exposición total en opciones como un porcentaje pequeño de la cartera y cuenta la exposición por delta, no por dólares gastados. Prefiere estructuras de riesgo definido — spreads en vez de posiciones descubiertas — para que el peor caso se pueda conocer antes de entrar. Escribe la salida (objetivo de ganancia y límite de pérdida) antes de abrir. Opera solo subyacentes líquidos, donde el spread sea de centavos. Y toma ganancias temprano cuando vendiste prima: cerrar una operación de crédito al 50% de la ganancia máxima en vez de aguantar hasta el vencimiento mejora bastante el resultado ajustado por riesgo, porque la última mitad de la prima es la que más tarda y la que más riesgo de gamma carga.</p></div>\n<p>Un último encuadre. En el tema de <strong>Acciones</strong>, el argumento era que el temperamento impuesto por la estructura es la verdadera ventaja del inversionista individual. Aquí eso es doblemente cierto, porque las opciones comprimen una década de errores de inversión en un ciclo de vencimiento de dos semanas. El instrumento no es el problema. La velocidad sí.</p>"}]});
TOPICS_ES.push({"id":"crypto","icon":"🪙","c":"#ffcc4d","lvl":"Riesgo alto","name":"Criptomonedas","tag":"Dinero digital e infraestructura digital que funciona sobre un libro contable público y compartido, sin ninguna empresa detrás. Un puñado de activos serios ocupa la cima de este mercado y una cantidad enorme de basura queda por debajo — saber en qué escalón estás parado es casi todo el juego.","blurb":"Qué es realmente una blockchain, qué hacen de verdad Bitcoin y Ethereum, cómo distinguir los activos serios de la basura, y cómo comprarlas y guardarlas de forma segura.","deepTeaser":"Bitcoin y Ethereum explicados como se debe, cómo funciona el consenso, qué son realmente los contratos inteligentes y qué ejecutan, autocustodia y herencia, valuación sin flujos de efectivo, la mecánica de las stablecoins, las reglas fiscales y un dimensionamiento honesto dentro de la cartera.","basics":[{"h":"Qué es en realidad","body":"\n<p>Quítale el ruido y una criptomoneda es un <strong>libro contable público y compartido</strong> — una lista de quién posee qué — mantenida simultáneamente por miles de computadoras independientes, sin que ningún banco, empresa o gobierno esté a cargo.</p>\n<p>Tu banco lleva un libro contable privado de tu saldo. Confías en que lo mantenga de forma honesta y, en la práctica, no tienes manera de verificarlo. Una blockchain reemplaza esa confianza con matemáticas y economía: cada participante guarda una copia del libro, las reglas criptográficas hacen impráctico falsificar registros, y los incentivos financieros hacen que atacar salga caro y que seguir las reglas sea rentable.</p>\n<div class=\"box\"><b>Qué significa realmente \"tener\" cripto</b><p>No posees un archivo. Lo que tienes es una <strong>llave privada</strong> — un número secreto que demuestra que controlas una dirección específica del libro contable. Quien tenga la llave controla los fondos, de forma permanente e irreversible. No hay restablecimiento de contraseña, no hay departamento de fraudes, no hay contracargo. Esa es al mismo tiempo la propiedad más poderosa y la más peligrosa de todo el sistema.</p></div>\n<p>Aquí hay dos innovaciones que son reales, pienses lo que pienses de los precios. Primero, <strong>una forma de que desconocidos se pongan de acuerdo sobre un registro sin un intermediario de confianza</strong> — un avance genuino de las ciencias de la computación. Segundo, <strong>escasez digital demostrable</strong>: el tope de suministro de Bitcoin de 21 millones lo hace cumplir el software que ejecuta cada participante, no una promesa. Si esas innovaciones justifican tal o cual precio de mercado es otra pregunta, y mucho más difícil.</p>"},{"h":"Los escalones: Bitcoin, Ethereum y los otros 20,000","body":"\n<p>\"Cripto\" no es un solo activo, igual que \"la bolsa\" no es una sola empresa. Tratarlo como una sola cosa es el error que hace que todo el sector parezca un casino — y es el error que comete la mayoría de la cobertura, en ambas direcciones.</p>\n<p>Hay un verdadero gradiente de calidad aquí, y es empinado. Arriba hay dos activos con quince y diez años de operación continua, acceso vía ETF regulados, custodia institucional, liquidez profunda y ninguna entidad que los controle. Abajo hay tokens creados esta mañana por equipos anónimos que se quedaron con la mayor parte del suministro. <strong>Meterlos en la misma bolsa es como meter bonos del Tesoro y acciones de primera línea junto con acciones de centavo y llamarlo \"el mercado\".</strong> Misma palabra, riesgo completamente distinto.</p>\n<table>\n<tr><th>Categoría</th><th>Ejemplos</th><th>El argumento de venta</th><th>La lectura honesta</th></tr>\n<tr><td><strong>Reserva de valor</strong></td><td>Bitcoin</td><td>Suministro fijo, el más descentralizado, el historial más largo, ahora accesible vía ETF al contado y en manos de algunas instituciones</td><td>El único con una pretensión seria de ser un activo monetario. Aun así es lo bastante volátil como para caer más de 70% en un ciclo</td></tr>\n<tr><td><strong>Plataformas de contratos inteligentes</strong></td><td>Ethereum, Solana y competidores</td><td>Dinero programable — la capa base para aplicaciones, con comisiones pagadas en el token nativo</td><td>Más parecido a una inversión en tecnología. Júzgalos por su uso real y sus ingresos por comisiones, no por la narrativa</td></tr>\n<tr><td><strong>Stablecoins</strong></td><td>USDC, USDT</td><td>Tokens anclados 1:1 al dólar, usados para pagos y como colateral de trading</td><td>Plomería útil, y el producto más claro del mundo real. No son una inversión — y la calidad del respaldo varía según el emisor</td></tr>\n<tr><td><strong>Tokens de aplicación</strong></td><td>Protocolos DeFi, exchanges, infraestructura</td><td>Propiedad o gobernanza en un negocio específico en cadena</td><td>Evalúalos como una startup: ingresos, usuarios, competencia. La mayoría no sobrevivirá</td></tr>\n<tr><td><strong>Memecoins</strong></td><td>Demasiadas para nombrarlas</td><td>Comunidad, cultura, el próximo 100x</td><td>Cero flujo de efectivo, cero utilidad, propiedad extremadamente concentrada. Esto es apostar con un ticker</td></tr>\n</table>\n<div class=\"box\"><b>Dónde está de verdad el dinero serio</b><p>Históricamente, Bitcoin y Ethereum juntos han representado alrededor de dos tercios del valor total del mercado cripto, y son los dos únicos con ETF al contado en EE. UU., custodia de instituciones grandes y liquidez suficiente para mover tamaños reales sin deslizamiento. Si quieres exposición a esta clase de activo sin lo peor de su riesgo, <strong>concentrarte en la parte alta del mercado es el filtro más efectivo que existe</strong> — no elimina la volatilidad, pero sí elimina el riesgo de fraude, el riesgo de rug pull y la casi certeza de irse a cero que aplica a la cola. Las stablecoins de emisores establecidos son otra categoría aparte, de menor riesgo: son equivalentes de efectivo, no inversiones.</p></div>\n<div class=\"box warn\"><b>Cómo se ve realmente la cola</b><p>Por debajo del escalón superior, la distribución se pone fea rápido. De las decenas de miles de tokens creados, la abrumadora mayoría se fue a cero o cerca de cero, y el sesgo de supervivencia es severo — solo escuchas de los que funcionaron. Un token recién lanzado se parece más, en perfil de riesgo, a una startup privada que a una acción, salvo que sin divulgaciones, sin estados financieros auditados y a menudo con un equipo fundador que tiene la mayor parte del suministro. Aquí es donde cripto se ganó su reputación, y se puede evitar simplemente no yendo ahí.</p></div>"},{"h":"Cómo comprarlas y dónde guardarlas","body":"\n<ol class=\"steps\">\n<li><b>Elige tu vía de acceso</b> Hay tres opciones reales. Un <strong>ETF al contado</strong> en tu cuenta de corretaje actual (lo más simple, funciona dentro de una IRA, sin llaves que administrar, comisión anual pequeña, y es la única vía que encaja limpiamente en un plan financiero normal). Un <strong>exchange grande</strong> — Coinbase, Kraken, Gemini — que te deja realmente tener y mover el activo. O la <strong>autocustodia</strong>, donde compras en un exchange y retiras a una billetera que tú controlas.</li>\n<li><b>Si usas un exchange, tómate en serio la seguridad</b> Una contraseña única, y autenticación de dos factores con una app autenticadora o una llave de hardware — <strong>nunca por SMS</strong>. Los ataques de SIM swap son la forma más común en que a los tenedores individuales les vacían la cuenta, y tu número de teléfono no es una credencial de seguridad.</li>\n<li><b>Empieza pequeño y manda una transacción de prueba</b> Antes de mover cualquier cantidad real, envía el mínimo. Confirma que llegue. Las transacciones en blockchain son irreversibles; un error de tipeo en la dirección o la red equivocada significa que el dinero simplemente desapareció, sin nadie a quien llamar.</li>\n<li><b>Decide la custodia de forma deliberada</b> Dejar los activos en un exchange significa confiar en la solvencia y la seguridad de esa empresa — Mt. Gox, Celsius y FTX son la razón por la que \"no son tus llaves, no son tus monedas\" se volvió un lema. La autocustodia te transfiere ese riesgo a ti: pierde la frase semilla y los fondos son irrecuperables.</li>\n<li><b>Si te autocustodias, usa una billetera de hardware</b> Ledger, Trezor o similar. El dispositivo mantiene tus llaves fuera de línea. Genera una <strong>frase semilla</strong> — 12 o 24 palabras que pueden restaurar tu billetera entera. Escríbela en papel o en acero. Nunca la fotografíes, nunca la teclees en ningún aparato, nunca la guardes en notas en la nube ni en un gestor de contraseñas.</li>\n<li><b>Registra cada transacción</b> Cada operación, swap y venta es un evento gravable. Usa software de impuestos que se conecte a tus exchanges desde el primer día; reconstruir años de historial después es miserable y caro.</li>\n</ol>\n<div class=\"box\"><b>La pregunta del ETF, respondida sin rodeos</b><p>Si tu objetivo es exposición al precio y no te interesa usar la red, <strong>el ETF al contado suele ser el mejor instrumento</strong>: funciona dentro de una IRA, tiene reporte fiscal limpio, no requiere administrar llaves y elimina el riesgo de contraparte del exchange. La autocustodia tiene sentido cuando de verdad quieres usar el activo — tenerlo fuera del sistema bancario, transaccionar en cadena o interactuar con aplicaciones. Elige según cuál de esas cosas realmente quieres, no según cuál suena más sofisticada.</p></div>"},{"h":"Por qué el precio se mueve como se mueve","body":"\n<p>Una acción tiene ganancias. Un bono tiene cupones. Los bienes raíces tienen renta. <strong>La mayoría de los criptoactivos no tienen ningún flujo de efectivo</strong>, lo que significa que no hay ancla para la valuación — el precio lo fija por completo lo que el próximo comprador esté dispuesto a pagar. Por eso la volatilidad no es un defecto que se vaya a arreglar; es estructural.</p>\n<ul>\n<li><strong>Liquidez y tasas de interés.</strong> Cripto se ha comportado como un activo de riesgo de beta alta — sube más fuerte cuando el dinero está barato y cae más fuerte cuando las tasas suben. Hasta ahora no se ha comportado como una cobertura contra el estrés financiero en el momento en que el estrés llega.</li>\n<li><strong>Calendario de suministro.</strong> La emisión de Bitcoin se reduce a la mitad más o menos cada cuatro años, lo que históricamente ha enmarcado un ciclo de auge y caída. Si ese patrón continúa a medida que el subsidio por bloque se encoge hacia la irrelevancia es una pregunta abierta, no una ley.</li>\n<li><strong>Acceso y flujos.</strong> La llegada de los ETF al contado abrió una gran bolsa de capital que antes no podía participar. Los movimientos impulsados por flujos son reales, pero no son lo mismo que el valor fundamental.</li>\n<li><strong>Reflexividad.</strong> Los precios que suben atraen atención, que atrae compradores, que suben los precios. El mecanismo funciona idéntico a la inversa, y el apalancamiento en el sistema acelera ambas direcciones.</li>\n<li><strong>Regulación y eventos de seguridad.</strong> La quiebra de un exchange grande, una acción de las autoridades o el exploit de un protocolo pueden revalorizar el sector entero en un día.</li>\n</ul>\n<div class=\"box warn\"><b>Calibra tus expectativas con la historia real</b><p>Bitcoin ha tenido múltiples caídas superiores al 70–80%, con recuperaciones que tomaron años. Las altcoins individuales han caído rutinariamente 90–99% y nunca volvieron. Cualquier posición que tengas debería estar dimensionada de modo que una caída del 80% sea sobrevivible financiera y emocionalmente — porque ya pasó repetidamente y no hay razón para suponer que no volverá a pasar.</p></div>"},{"h":"Cuánto, si es que algo","body":"\n<p>La respuesta defendible para la mayoría de la gente es una asignación pequeña y deliberada a la parte alta del mercado, o ninguna en absoluto — y \"ninguna\" es una elección completamente respetable que no te cuesta nada a lo que tuvieras derecho. Lo que <em>no</em> es defendible es una asignación grande, o cualquier asignación a la cola.</p>\n<p>Si sí quieres exposición, la secuencia importa más que el precio de entrada:</p>\n<ul>\n<li><strong>Todo lo demás va primero.</strong> Aporte igualado del empleador capturado, deudas de interés alto eliminadas, fondo de emergencia financiado, cuentas con ventajas fiscales en uso. Cripto está en el extremo lejano del espectro de riesgo y va después de que las cosas aburridas estén resueltas.</li>\n<li><strong>Dimensiónalo como una pérdida total que puedas absorber.</strong> Un encuadre común es 1–5% de los activos invertibles. La prueba es simple: si esto se fuera a cero mañana, ¿cambia algo en tu vida? Si sí, es demasiado grande.</li>\n<li><strong>Concéntrate en los activos más grandes.</strong> Bitcoin y Ethereum — o los ETF al contado que los tienen — cargan con la volatilidad de la clase de activo sin el riesgo de fraude y abandono de la cola. Mientras más bajes en la lista de capitalización de mercado, más te acercas a riesgo de capital de riesgo sin la diversificación ni la información del capital de riesgo.</li>\n<li><strong>Compra según un calendario.</strong> Promediar el costo en dólares te quita la decisión de sincronización en un activo cuya dirección de corto plazo nadie ha demostrado poder predecir.</li>\n<li><strong>Define tus reglas de venta mientras estás tranquilo.</strong> Escribe qué te haría recortar o salir. Rebalancear una posición que creció de 3% a 12% de vuelta al objetivo es la forma en que una asignación especulativa se convierte de verdad en dinero realizado.</li>\n</ul>"}],"pitfalls":["Guardar una frase semilla como foto, como nota en tu teléfono, como entrada en un gestor de contraseñas o como correo que te mandas a ti mismo. Esta es la forma más común en que roban cripto en autocustodia.","Confiar en cualquiera que te contacte primero. El soporte no te manda mensajes privados, los sorteos que exigen que envíes fondos primero siempre son falsos, y \"conecta tu billetera para verificar\" es un ataque de drenaje.","Suponer que las ganancias en cripto son invisibles para el IRS. Los exchanges reportan al IRS, las blockchains son permanentemente públicas, y el reporte con el Form 1099-DA ya está entrando en vigor por etapas.","Usar apalancamiento. Cripto ya se mueve más de 10% en un día; el apalancamiento convierte un martes cualquiera en una liquidación.","Perseguir rendimiento. Los retornos \"garantizados\" de dos dígitos sobre una stablecoin salen de algún lado — normalmente de un riesgo de préstamo que no te divulgaron. Celsius, BlockFi y Voyager pagaron rendimiento hasta el día en que dejaron de hacerlo.","Enviar fondos por la red equivocada o a una dirección mal escrita. Las transacciones son irreversibles y no hay línea de soporte que pueda deshacerlo.","Confundir la capitalización de mercado con la valuación totalmente diluida. Un token puede parecer pequeño mientras la mayoría del suministro sigue sin desbloquearse y esperando para llegar al mercado.","Poner cerca de esto dinero que vas a necesitar dentro de unos pocos años. Las caídas de 70-80% han durado años, no semanas.","Nunca dejar por escrito instrucciones de herencia. La cripto en autocustodia sin un plan de recuperación desaparece para siempre cuando desaparece su dueño."],"terms":[{"t":"Blockchain","d":"Un libro contable compartido, de solo agregar, mantenido simultáneamente por muchas computadoras independientes."},{"t":"Llave privada","d":"El número secreto que controla los fondos en una dirección. Quien la tenga es dueño del dinero."},{"t":"Frase semilla","d":"12 o 24 palabras que regeneran todas las llaves de tu billetera. La cosa más sensible que jamás vas a escribir."},{"t":"Billetera (wallet)","d":"Software o hardware que guarda tus llaves. No guarda monedas — las monedas viven en el libro contable."},{"t":"Billetera caliente vs. fría","d":"Conectada a internet vs. mantenida fuera de línea. El almacenamiento en frío es dramáticamente más seguro para todo lo que no estés usando activamente."},{"t":"Autocustodia","d":"Tener tus propias llaves en vez de confiar en que un exchange las guarde por ti."},{"t":"CEX / DEX","d":"Exchange centralizado (una empresa, como Coinbase) vs. exchange descentralizado (un contrato inteligente, sin necesidad de cuenta)."},{"t":"Comisión de gas","d":"La comisión de transacción que se le paga a la red. Sube cuando la red está congestionada."},{"t":"Stablecoin","d":"Un token diseñado para mantener una paridad de $1, respaldado por reservas o por un algoritmo. La calidad del respaldo varía enormemente."},{"t":"Prueba de trabajo","d":"Consenso asegurado gastando electricidad para resolver acertijos. Bitcoin usa esto."},{"t":"Prueba de participación","d":"Consenso asegurado por validadores que depositan capital como colateral, que puede destruirse si hacen trampa. Ethereum usa esto."},{"t":"Staking","d":"Bloquear tokens para ayudar a asegurar una red de prueba de participación a cambio de recompensas. Es ingreso gravable al recibirlo."},{"t":"Capa 1 / Capa 2","d":"La blockchain base vs. una red más rápida construida encima que liquida de vuelta en ella."},{"t":"Halving","d":"La emisión de suministro nuevo de Bitcoin reduciéndose a la mitad más o menos cada cuatro años."},{"t":"Contrato inteligente","d":"Código desplegado en una blockchain que se ejecuta automáticamente. Sus errores son explotables e irreversibles."},{"t":"DeFi","d":"Servicios financieros — préstamos, trading, derivados — construidos como contratos inteligentes en vez de empresas."},{"t":"Capitalización de mercado vs. FDV","d":"Valor del suministro circulante vs. valor si todos los tokens que existirán estuvieran circulando. La brecha es dilución futura."},{"t":"ETF al contado","d":"Un fondo cotizado en bolsa que tiene el activo real, comprado en una cuenta de corretaje normal."},{"t":"Rug pull","d":"Un equipo que abandona un proyecto y vende sus tenencias, colapsando el token."},{"t":"Ataque del 51%","d":"Una sola parte controlando suficiente de una red como para reescribir la historia reciente. Un riesgo real en cadenas pequeñas, impráctico en las grandes."},{"t":"Almacenamiento en frío","d":"Llaves mantenidas totalmente fuera de línea, típicamente en un dispositivo de hardware."},{"t":"Multifirma","d":"Exigir varias llaves para autorizar una transacción. El estándar para montos significativos."},{"t":"ERC-20 / ERC-721","d":"Las interfaces estándar de contratos inteligentes para tokens fungibles y para NFT en cadenas tipo Ethereum."},{"t":"Aprobación de token","d":"Permiso que le das a un contrato para mover tus tokens. A menudo se pide ilimitado y permanente — revoca los que estén viejos."},{"t":"Oráculo","d":"Un servicio que alimenta datos externos, normalmente precios, a un contrato inteligente. Manipular uno es un ataque común."},{"t":"Préstamo flash","d":"Tomar prestada una suma enorme sin colateral, siempre que se devuelva dentro de la misma transacción. Herramienta legítima, y el motor de muchos exploits."},{"t":"Puente (bridge)","d":"Un contrato que bloquea un activo en una cadena y acuña una representación en otra. Históricamente, la categoría más explotada en cripto."},{"t":"DAO","d":"Una organización cuya tesorería y decisiones corren a través de contratos inteligentes, gobernada por votos de los tenedores del token."},{"t":"Reentrada","d":"Un exploit clásico donde se engaña a un contrato para que repita un retiro antes de actualizar sus propios registros. La falla detrás del hackeo de The DAO."}],"deep":[{"h":"Bitcoin, en concreto — qué es en realidad","body":"\n<p>Casi todo el mundo ha oído hablar de Bitcoin y muy poca gente sabe decir qué es. Vale la pena ir despacio aquí, porque es el único activo del sector con un historial de más de quince años y funciona distinto a todo lo que se construyó después.</p>\n<p><strong>Bitcoin es tres cosas a la vez</strong>, y la palabra se usa para las tres indistintamente:</p>\n<ul>\n<li><strong>Una red</strong> — decenas de miles de computadoras en todo el mundo ejecutando el mismo software de código abierto, cada una guardando una copia completa del libro contable y verificando de forma independiente cada transacción.</li>\n<li><strong>Un libro contable</strong> — el registro público permanente de cada transacción desde enero de 2009, que cualquiera puede descargar y verificar desde cero.</li>\n<li><strong>Una unidad</strong> — la moneda misma, que no es más que una entrada en ese libro que dice que una dirección determinada controla un saldo determinado.</li>\n</ul>\n<p>Se publicó como un documento de nueve páginas en octubre de 2008 por alguien que usaba el nombre <strong>Satoshi Nakamoto</strong>, y el primer bloque se minó en enero de 2009. Satoshi dejó de participar en 2011 y nunca ha sido identificado. Aproximadamente un millón de monedas que se cree que son suyas nunca se han movido. <strong>No hay empresa, no hay CEO, no hay junta directiva y no hay oficinas centrales</strong> — algo lo bastante inusual como para detenerse a pensarlo. Nadie puede emitir más, congelar tu saldo ni cambiar las reglas unilateralmente.</p>\n<div class=\"box\"><b>El problema que resolvió</b><p>Los archivos digitales se copian a la perfección, y por eso se consideraba imposible tener efectivo digital sin un banco en medio que impidiera que gastaras el mismo dólar dos veces. Bitcoin resolvió ese <em>problema del doble gasto</em> sin un tercero de confianza — la primera solución funcional a una pregunta en la que los científicos de la computación llevaban décadas trabajando. Pase lo que pase con el precio, ese resultado sigue en pie.</p></div>\n<p><strong>Cómo funciona, mecánicamente.</strong> Las transacciones se transmiten a la red y se agrupan en bloques más o menos cada diez minutos. Los mineros compiten por resolver un acertijo computacional a cambio del derecho a agregar el siguiente bloque, y el ganador se lleva monedas recién emitidas más comisiones. La dificultad se ajusta automáticamente cada dos semanas para que los bloques sigan llegando a ese ritmo sin importar cuánto poder de minado entre o salga. Todo el mundo sigue la cadena con más trabajo acumulado, que es lo que hace impráctico reescribir la historia.</p>\n<p><strong>El calendario de suministro es la característica estrella.</strong> Solo existirán 21 millones de bitcoin, algo que hace cumplir el software que corre cada nodo. La emisión nueva se reduce a la mitad más o menos cada cuatro años — el \"halving\". El subsidio actualmente es de 3.125 monedas por bloque, tras haberse reducido a la mitad en abril de 2024, y el próximo recorte toca en 2028. Ya se han minado más de 20 millones, así que quedan menos de un millón, liberados según un calendario que se desacelera y que corre hasta cerca del año 2140. Ningún comité decide esto y ningún voto lo cambia sin un acuerdo casi universal entre usuarios, mineros y operadores de nodos.</p>\n<div class=\"box\"><b>No compras uno entero</b><p>Cada bitcoin se divide en 100 millones de unidades llamadas <strong>satoshis</strong>. El precio que tenga cualquier día es irrelevante para si puedes participar — compras $50 igual que compras una fracción de una acción. El precio que ves en los titulares espanta a la gente sin ninguna razón.</p></div>\n<p><strong>Lo que Bitcoin no es</strong>, porque los malentendidos aquí sostienen mucho peso:</p>\n<ul>\n<li><strong>No es anónimo.</strong> Es seudónimo. Cada transacción es permanentemente pública, y las firmas de análisis de cadena rastrean flujos de forma rutinaria. Podría decirse que es peor que el efectivo para el crimen, y por eso las condenas siguen saliendo.</li>\n<li><strong>No es rápido ni barato a escala.</strong> La capa base maneja un puñado de transacciones por segundo por diseño. La <em>Lightning Network</em> es una segunda capa construida para pagos instantáneos de bajo costo que liquidan de vuelta en la cadena principal.</li>\n<li><strong>No es programable.</strong> Su lenguaje de scripting es deliberadamente limitado. Bitcoin no va a alojar las aplicaciones que se describen más adelante en esta inmersión profunda — esa contención es justamente el punto, y es la razón por la que existe Ethereum.</li>\n<li><strong>No está respaldado por nada</strong>, en el sentido de un derecho sobre activos o flujo de efectivo. Su valor descansa en la credibilidad del tope de suministro más la demanda de gente que quiere un activo fuera del control de cualquier estado. Eso te alcanza o no te alcanza, y ambas conclusiones son defendibles.</li>\n</ul>\n<p><strong>Por qué ocupa un escalón distinto.</strong> Tiene el historial de operación más largo, nunca ha sido atacado con éxito a nivel de protocolo, no tiene ninguna entidad controladora a la que presionar o que pueda quebrar, y ahora tiene ETF al contado regulados y custodia institucional. Su conservadurismo — actualizaciones famosamente lentas y peleadas — se critica seguido como estancamiento y se entiende mejor como la postura correcta para algo cuyo único trabajo es no cambiar. Cualquier otro activo del sector, incluido Ethereum, tiene más piezas móviles y por lo tanto más maneras de romperse.</p>"},{"h":"Ethereum, en concreto — el programable","body":"\n<p>Si Bitcoin es una calculadora hecha para hacer una sola cosa extremadamente bien, <strong>Ethereum es una computadora de propósito general</strong>. Se lanzó en 2015, propuesto por Vitalik Buterin junto con un grupo de cofundadores, sobre una premisa simple: si una red puede ponerse de acuerdo sobre quién posee qué, puede ponerse de acuerdo sobre el resultado de cualquier código.</p>\n<p>Ese código son los contratos inteligentes que se cubren en las siguientes tres secciones. La cadena ejecuta una máquina virtual compartida — la <strong>EVM</strong> — cuyo estado todos los participantes acuerdan. Despliega un programa en ella y correrá idéntico para todo el mundo, para siempre, sin un operador.</p>\n<div class=\"box\"><b>Qué hace realmente ETH como activo</b><p>A diferencia de bitcoin, ETH tiene trabajos explícitos dentro de su propio sistema. <strong>Paga la computación</strong> (cada transacción quema gas), se <strong>deposita como colateral</strong> para asegurar la red, y sirve como <strong>el activo colateral base</strong> de la economía en cadena — la cosa sobre la que se construyen los protocolos de préstamo y las stablecoins. Eso le da algo más parecido a un motor de demanda fundamental de lo que tienen la mayoría de los criptoactivos, y es por eso que los analistas a veces lo tratan como una inversión tecnológica en vez de monetaria.</p></div>\n<p><strong>Tres cambios que definen al Ethereum moderno:</strong></p>\n<ul>\n<li><strong>The Merge (septiembre de 2022).</strong> Ethereum pasó de prueba de trabajo a prueba de participación, recortando su consumo de energía en aproximadamente 99.9% de un día para otro — una de las migraciones en vivo más grandes de la historia del software, ejecutada sin caídas. La seguridad ahora viene de validadores que depositan 32 ETH como colateral, que puede destruirse si se portan mal. Los tenedores más pequeños participan mediante staking agrupado o líquido.</li>\n<li><strong>EIP-1559 (agosto de 2021).</strong> Reestructuró las comisiones para que una parte de cada comisión de transacción se <em>queme</em> — se destruya permanentemente. Cuando el uso de la red es alto, el ETH quemado puede superar al ETH emitido, haciendo que el suministro sea deflacionario neto. No hay un tope fijo como el de Bitcoin, pero la emisión es baja y está parcialmente compensada por esa quema.</li>\n<li><strong>Rollups y la hoja de ruta de escalado.</strong> En vez de hacer más rápida la cadena base, Ethereum empujó la actividad a redes de <strong>Capa 2</strong> — Arbitrum, Optimism, Base y otras — que ejecutan transacciones fuera de la cadena y publican pruebas comprimidas de vuelta para liquidar. La introducción en 2024 de espacio de datos dedicado para rollups recortó dramáticamente las comisiones de L2. Las actualizaciones ahora salen a un ritmo de aproximadamente dos por año, con Pectra y Fusaka continuando esa hoja de ruta.</li>\n</ul>\n<p><strong>Qué corre realmente encima.</strong> La gran mayoría del valor en stablecoins, la mayor parte de los préstamos y el trading descentralizados, la mayoría de los productos de fondos y Tesoro tokenizados, y la mayor parte de la infraestructura de NFT viven en Ethereum o en rollups que liquidan en ella. Pienses lo que pienses del precio del token, es la capa de liquidación donde se concentró la actividad económica real del sector.</p>\n<table>\n<tr><th></th><th>Bitcoin</th><th>Ethereum</th></tr>\n<tr><td>Propósito central</td><td>Un activo monetario — escaso, neutral, difícil de cambiar</td><td>Una plataforma — liquidación programable para aplicaciones</td></tr>\n<tr><td>Suministro</td><td>Tope duro de 21 millones, calendario fijo</td><td>Sin tope; emisión baja, parcialmente quemada por el uso</td></tr>\n<tr><td>Seguridad</td><td>Prueba de trabajo — electricidad</td><td>Prueba de participación — capital depositado</td></tr>\n<tr><td>Rendimiento</td><td>Ninguno de forma nativa</td><td>Recompensas de staking, un dígito bajo, gravables como ingreso</td></tr>\n<tr><td>Filosofía de cambio</td><td>Deliberadamente resistente al cambio</td><td>Actualizado activamente según un calendario</td></tr>\n<tr><td>Riesgo principal</td><td>Que la demanda nunca se materialice más allá de la especulación; la economía de comisiones para los mineros en el largo plazo</td><td>Ejecución y competencia — otras plataformas, fragmentación de L2, complejidad de las actualizaciones</td></tr>\n<tr><td>Encuadre razonable</td><td>Un activo escaso parecido a una materia prima</td><td>Más cercano a poseer infraestructura con demanda ligada al uso</td></tr>\n</table>\n<div class=\"box warn\"><b>Los riesgos honestos de Ethereum</b><p>La apuesta de Bitcoin es esencialmente binaria: o un activo neutral de suministro fijo es valioso o no lo es. La apuesta de Ethereum tiene más modos de fallo. Plataformas competidoras con distintos compromisos le siguen quitando cuota. Que la actividad se mueva a las Capa 2 plantea preguntas reales sobre cuánto valor le llega a la capa base. Cada actualización es una superficie significativa para que algo salga mal. Y los arreglos de staking como servicio han atraído atención regulatoria de una forma que la tenencia pasiva no. Más capacidad significa más maneras de equivocarse.</p></div>"},{"h":"Cómo funciona realmente el consenso, y cuánto cuesta","body":"\n<p>El problema difícil que resuelve una blockchain: ¿cómo hacen miles de computadoras que no confían entre sí para acordar una sola historia, cuando algunas de ellas podrían estar mintiendo?</p>\n<p>La <strong>prueba de trabajo</strong> (Bitcoin) hace que mentir sea caro. Los mineros queman electricidad compitiendo por resolver un acertijo sin sentido; el ganador propone el siguiente bloque y se lleva monedas recién emitidas más comisiones. Reescribir la historia significa rehacer todo ese trabajo más rápido que la red honesta — económicamente absurdo a la escala de Bitcoin. El presupuesto de seguridad es literalmente la factura de la luz, que es a la vez el argumento más fuerte a favor de su durabilidad y el argumento más fuerte contra sus externalidades.</p>\n<p>La <strong>prueba de participación</strong> (Ethereum y la mayoría de las cadenas más nuevas) hace que mentir sea caro de otra manera. Los validadores depositan capital como colateral; el mal comportamiento demostrable lo destruye. Muchísima menos energía, y la finalidad es más rápida. La crítica es que el capital tiende a concentrarse — los grandes proveedores de staking acumulan influencia — y que el modelo de seguridad es más joven y menos probado en batalla.</p>\n<div class=\"box\"><b>El trilema, dicho con honestidad</b><p>Descentralización, seguridad y velocidad se sacrifican entre sí. Cada cadena que anuncia un rendimiento dramáticamente mayor lo compró reduciendo el número de participantes que pueden verificar el libro contable de forma independiente, o apoyándose en la capa base para liquidar. Eso no es automáticamente un mal trato — pero cuando alguien dice que una cadena es \"más rápida que Bitcoin\", la pregunta de seguimiento correcta es \"¿qué entregó a cambio?\".</p></div>\n<p>Qué significa esto en la práctica: <strong>la descentralización es el producto entero.</strong> Si te sientes cómodo confiando en una institución, una base de datos es más rápida, más barata y mejor en todas las dimensiones. La única razón racional para aceptar la enorme ineficiencia de una blockchain es que específicamente no quieres una parte de confianza en medio. Cualquier proyecto que no pueda explicar por qué necesita esa propiedad suele ser una base de datos con un token pegado.</p>"},{"h":"Contratos inteligentes: qué son y qué hacen realmente","body":"\n<p>Un <strong>contrato inteligente</strong> es un programa desplegado en una blockchain. Una vez que está ahí, vive en una dirección igual que tu billetera, cualquiera en el mundo puede llamarlo, y se ejecuta exactamente igual para todos. Nadie lo opera. Nadie puede cambiar en silencio lo que hace. No hay una empresa detrás que pueda decidir que hoy no tienes permitido usarlo.</p>\n<p>El nombre es engañoso — no es un contrato legal y no es inteligente. Es una máquina expendedora. Metes una entrada específica, las reglas de la máquina determinan la salida, y a la máquina no le importa quién eres, cómo está tu crédito, ni si son las 3 de la mañana de un día festivo. Toda la innovación está en que a la máquina no se le puede torcer el brazo.</p>\n<div class=\"box\"><b>La mecánica, en concreto</b><p>Alguien escribe código (normalmente en Solidity sobre Ethereum) y paga una comisión para desplegarlo. Ahora tiene una dirección. Cualquiera puede mandarle una transacción llamando a una de sus funciones, pagando <em>gas</em> para compensar a la red por la computación. Miles de nodos ejecutan el mismo código de forma independiente y deben coincidir en el resultado — por eso la computación en cadena es miles de veces más cara que un servidor común, y por eso solo la lógica que genuinamente necesita funcionar sin confianza pertenece ahí.</p></div>\n<p>Dos propiedades hacen todo el trabajo, y ambas cortan en los dos sentidos:</p>\n<ul>\n<li><strong>Determinista y sin permisos.</strong> Las reglas corren tal como están escritas para todos, sin que un intermediario apruebe la transacción. Ese es el punto entero.</li>\n<li><strong>Inmutable.</strong> El código desplegado por lo general no se puede editar. Eso es lo que hace creíble la promesa — y también significa que un error es permanente, y que nadie puede revertir una equivocación, incluido el autor.</li>\n</ul>"},{"h":"Para qué se usan realmente los contratos inteligentes","body":"\n<p>Las explicaciones abstractas de los contratos inteligentes son inútiles. Esto es lo que está corriendo de verdad, más o menos en orden de cuánto dinero real pasa por ahí.</p>\n<table>\n<tr><th>Caso de uso</th><th>Qué hace el contrato</th><th>Por qué un contrato en vez de una empresa</th></tr>\n<tr><td><strong>Tokens</strong><br><span style=\"font-size:13px\">USDC, la mayoría de los criptoactivos</span></td><td>Lleva un libro de saldos y una función de transferencia. El estándar ERC-20 son unas 20 líneas de lógica significativa — un token literalmente <em>es</em> un contrato inteligente</td><td>Cualquiera puede tenerlo y enviarlo sin una cuenta, y cualquier aplicación puede integrarlo sin pedir permiso</td></tr>\n<tr><td><strong>Exchange descentralizado</strong><br><span style=\"font-size:13px\">Uniswap y similares</span></td><td>Guarda dos tokens en un pool y cotiza los swaps con una fórmula. La de Uniswap es famosamente solo <code>x × y = k</code>: el producto de los dos saldos se mantiene constante, así que comprar un lado sube automáticamente su precio</td><td>Sin libro de órdenes, sin corredor, sin contraparte. Los proveedores de liquidez depositan ambos tokens y cobran una parte de las comisiones de trading</td></tr>\n<tr><td><strong>Préstamos</strong><br><span style=\"font-size:13px\">Aave, Compound</span></td><td>Depositas $150 de colateral y pides prestados $100 en stablecoins. Si tu colateral cae por debajo de un umbral, el contrato deja que cualquiera lo liquide automáticamente. Las tasas de interés flotan algorítmicamente con la utilización del pool</td><td>Sin revisión de crédito, sin solicitud, sin posibilidad de rechazarte. El compromiso es que los préstamos tienen que estar sobrecolateralizados — esto no puede reemplazar una hipoteca</td></tr>\n<tr><td><strong>Emisión de stablecoins</strong></td><td>Acuña y quema tokens contra reservas y — algo importante — normalmente incluye una función de congelamiento para el emisor</td><td>Un recordatorio útil de que \"en cadena\" no significa \"descentralizado\". El emisor de USDC puede congelar direcciones, y lo hace</td></tr>\n<tr><td><strong>Staking y staking líquido</strong></td><td>Acepta depósitos, opera validadores o delega en ellos, y emite un token de recibo que representa tu posición depositada más las recompensas</td><td>Permite que tenedores pequeños participen en la seguridad de la red sin operar infraestructura</td></tr>\n<tr><td><strong>NFT</strong><br><span style=\"font-size:13px\">ERC-721</span></td><td>Un registro que mapea IDs de tokens a direcciones de dueños, con reglas de transferencia y a menudo un enganche de regalías</td><td>Genuinamente útil como registro público de propiedad — para boletos, credenciales, objetos de videojuegos o nombres de dominio. La especulación con arte fue una aplicación, no la tecnología</td></tr>\n<tr><td><strong>Puentes</strong></td><td>Bloquea un activo en una cadena y acuña una representación en otra</td><td>Plomería necesaria entre cadenas — e históricamente la categoría más explotada de todo el sector</td></tr>\n<tr><td><strong>DAO / gobernanza</strong></td><td>Los tenedores del token votan propuestas; las propuestas aprobadas se ejecutan automáticamente contra una tesorería compartida</td><td>Control colectivo de fondos sin cuenta bancaria ni firmante. En la práctica, el poder de voto se concentra igual que la propiedad accionaria</td></tr>\n<tr><td><strong>Bonos del Tesoro y fondos tokenizados</strong></td><td>Un fondo regulado emite participaciones como tokens que liquidan en cadena, a menudo con reglas de transferencia con permisos</td><td>El caso de uso institucional más claro: liquidación continua y colateral programable para instrumentos que la gente ya entiende</td></tr>\n</table>\n<div class=\"box\"><b>Un ejemplo trabajado — un swap en Uniswap</b><p>Un pool tiene 100 ETH y 300,000 USDC, así que <code>k = 30,000,000</code>. Envías 1 ETH al contrato. Para mantener el producto constante con 101 ETH en el pool, el saldo de USDC debe caer a unos 297,030 — así que el contrato te manda aproximadamente 2,970 USDC, menos una comisión que se queda en el pool para los proveedores de liquidez. Nadie cotizó ese precio. Nadie aprobó la operación. Lo hizo la fórmula, y el mismo código lo habría hecho idéntico a cualquier hora para cualquier dirección del planeta. <em>Eso</em> es lo que la gente quiere decir con \"sin confianza\", y vale la pena entenderlo una vez, en concreto, porque todo lo demás en las finanzas descentralizadas es una variación de esto.</p></div>\n<p>El contrapunto honesto: para la gran mayoría de las ideas a las que les pegan un token, una base de datos normal operada por una empresa que responde por ella es más rápida, más barata y mejor. Los contratos inteligentes se ganan su enorme ineficiencia solo cuando quitar al intermediario de confianza es el producto de verdad. Aplicar ese filtro elimina a la mayoría de los proyectos en unos diez segundos.</p>"},{"h":"Cómo fallan los contratos inteligentes — y cómo evitar que te vacíen","body":"\n<p>Código que controla dinero, es público, es inmutable y puede ser llamado por cualquiera es el entorno de software más hostil jamás creado. Se han perdido miles de millones, y los patrones de fallo se repiten.</p>\n<ul>\n<li><strong>Errores de lógica.</strong> The DAO perdió en 2016 alrededor de 3.6 millones de ETH por una falla de <em>reentrada</em> — el contrato enviaba fondos antes de actualizar su propio saldo, así que un atacante podía retirar de forma recursiva. Las consecuencias dividieron a Ethereum en ETH y Ethereum Classic, y sigue siendo la discusión que define al sector sobre si \"el código es la ley\" sobrevive al contacto con una pérdida lo bastante grande.</li>\n<li><strong>Manipulación de oráculos.</strong> Los contratos necesitan precios del exterior, y los obtienen de <em>oráculos</em>. Manipula la fuente de precios — a menudo usando un <em>préstamo flash</em> que pide y devuelve millones dentro de una sola transacción — y puedes engañar a un contrato de préstamos para que acepte colateral sin valor. Esta es una de las clases de exploit más comunes.</li>\n<li><strong>Exploits de puentes.</strong> Los puentes guardan saldos agrupados enormes y dependen de conjuntos de validadores o de multifirmas. Ronin perdió unos $625M en 2022 por llaves de validador comprometidas; Wormhole perdió aproximadamente $320M por una falla en la verificación de firmas. Asume que los activos puenteados cargan bastante más riesgo que los nativos.</li>\n<li><strong>Llaves de administración y proxies actualizables.</strong> Muchos contratos \"inmutables\" están detrás de un proxy que un equipo puede actualizar. Eso es ingeniería prudente y también una puerta trasera — si esas llaves se comprometen o el equipo se vuelve malicioso, el contrato cambia debajo de ti. Revisa si una actualización tiene bloqueo temporal y quién tiene las llaves.</li>\n<li><strong>Aprobaciones de tokens.</strong> Esta es la que golpea a los usuarios comunes. Para dejar que un contrato mueva tus tokens, otorgas una <em>aprobación</em> — y muchas interfaces piden por defecto un permiso <strong>ilimitado</strong>, que dura para siempre. Si ese contrato luego es explotado o era malicioso desde el principio, puede drenar ese token de tu billetera en cualquier momento futuro, sin que tú hagas nada más.</li>\n</ul>\n<div class=\"box warn\"><b>Defensa práctica, en orden de valor</b><p><strong>1.</strong> Usa una billetera \"desechable\" aparte que solo tenga lo que estás usando activamente; mantén las tenencias de largo plazo en una billetera de hardware que nunca toque una dApp. <strong>2.</strong> Revisa y revoca periódicamente las aprobaciones de tokens viejas. <strong>3.</strong> Lee lo que estás firmando — una billetera de hardware que muestra la llamada real vale su costo exactamente por esto. <strong>4.</strong> Trata las auditorías como necesarias, no suficientes: a montones de contratos auditados los han vaciado, y una auditoría cubre el código a una fecha, no las llaves de administración ni la actualización que salió después. <strong>5.</strong> Prefiere contratos que hayan sostenido saldos grandes durante años sin incidentes — el tiempo es la única prueba real, y por eso perseguir a ciegas el rendimiento de un protocolo nuevo suele ser pagar por ser la liquidez de salida de alguien más.</p></div>\n<p>Vale la pena decir la tensión de fondo sin rodeos: <strong>la misma inmutabilidad que hace confiable a un contrato inteligente hace permanentes sus errores e irreversibles sus robos.</strong> No hay contracargo, no hay un regulador ante quien apelar, y a menudo no hay contraparte identificable. Cada interacción es final. Eso no es una falla de la implementación — es el diseño, y es el precio de la propiedad que la gente quiere de él.</p>"},{"h":"Custodia, en serio","body":"\n<p>Esta es la sección que de verdad protege el dinero. El modo de fallo de cripto no es un mal trimestre — es una pérdida total, instantánea e irreversible, y le pasa a gente sofisticada todo el tiempo.</p>\n<p><strong>La escalera de custodia, de tenencias más pequeñas a más grandes:</strong></p>\n<table>\n<tr><th>Enfoque</th><th>Apropiado para</th><th>Riesgo principal</th></tr>\n<tr><td>ETF al contado en una cuenta de corretaje</td><td>Cualquiera que solo quiera exposición al precio</td><td>Ninguno fuera de lo común — es un valor normal con custodia de corretaje cubierta por SIPC</td></tr>\n<tr><td>Cuenta en un exchange grande</td><td>Montos pequeños, trading activo</td><td>Insolvencia del exchange, robo de cuenta, congelamiento de retiros</td></tr>\n<tr><td>Billetera de hardware, una sola semilla</td><td>Tenencias personales significativas</td><td>Perder la semilla; robo físico del respaldo; una llave inglesa de $5</td></tr>\n<tr><td>Multifirma (2 de 3)</td><td>Tenencias grandes</td><td>Complejidad — pero sin un único punto de fallo</td></tr>\n<tr><td>Custodio institucional calificado</td><td>Tenencias muy grandes o fiduciarias</td><td>Contraparte, pero asegurado y auditado profesionalmente</td></tr>\n</table>\n<div class=\"box warn\"><b>Reglas de la frase semilla, sin excepción</b><p>Escríbela a mano en papel, o estámpala en acero si el monto lo justifica. Nunca la fotografíes. Nunca la teclees en una computadora o teléfono salvo que estés restaurando una billetera activamente, y nunca en un sitio web — el software legítimo jamás te la pide. Guarda copias en dos ubicaciones seguras físicamente separadas. Considera una <strong>passphrase</strong> (una palabra número 25) para que, por sí solo, un respaldo de la semilla que alguien encuentre no alcance. Prueba tu proceso de recuperación con una cantidad trivial antes de confiarle dinero real.</p></div>\n<p><strong>Las estafas que de verdad funcionan</strong>, porque conocer la forma es la mayor parte de la defensa: cuentas de soporte falsas que responden a tu queja pública en cuestión de minutos; páginas de \"validación\" o \"sincronización\" de billetera que te piden la semilla; aprobaciones de tokens maliciosas que le dan a un contrato permiso ilimitado para drenar una billetera; envenenamiento de direcciones, donde un atacante te manda una transacción de polvo desde una dirección parecida esperando que la copies de tu historial; SIM swaps que derrotan al 2FA por SMS; y billeteras de hardware falsas vendidas en mercados de terceros. Compra los dispositivos solo directamente al fabricante.</p>\n<div class=\"box\"><b>Herencia — la parte que todos se saltan</b><p>La cripto en autocustodia sin un plan de recuperación desaparece para siempre cuando tú desapareces. Esto conecta directamente con el tema de <strong>Fideicomisos</strong>: deja instrucciones escritas y claras junto con tus documentos sucesorios describiendo qué existe y cómo acceder a ello, sin poner la frase semilla en sí en un documento que va a convertirse en un registro público de sucesión. Las opciones incluyen una multifirma donde una persona de confianza o un abogado tenga una llave, una carta de instrucciones sellada con tu albacea, o un servicio de herencia creado para eso. Decide esto ahora; no se vuelve más fácil después.</p></div>"},{"h":"Valuar algo que no tiene flujos de efectivo","body":"\n<p>Todos los métodos de valuación de los temas de Acciones y Bienes Raíces arrancan con flujos de efectivo. La mayoría de los criptoactivos no tienen ninguno, así que el punto de partida honesto es que <strong>aquí no hay modelo de flujo de efectivo descontado, y quien te presente uno con confianza te está vendiendo algo.</strong> Lo que existe son marcos — útiles para estructurar un argumento, no para producir un precio objetivo.</p>\n<ul>\n<li><strong>Demanda monetaria / dimensionamiento del mercado.</strong> Comparar contra el mercado del oro de aproximadamente $20T o contra la oferta monetaria global, y luego asignar una probabilidad subjetiva de capturar alguna porción. Honesto sobre sus propios supuestos, y completamente dependiente de ellos.</li>\n<li><strong>Ratios de valor de red.</strong> NVT (valor de red sobre volumen de transacciones) es un análogo rudimentario del P/E. Interesante en cuanto a dirección, fácilmente distorsionado por wash trading y actividad fuera de la cadena.</li>\n<li><strong>Ingresos por comisiones.</strong> La métrica más defendible para las plataformas de contratos inteligentes: la red cobra comisiones, y en una cadena de prueba de participación esas comisiones les llegan a quienes hacen staking. Esto te permite tratar una capa base algo así como un negocio con ingresos — todavía con múltiplos enormes, pero al menos anclado a algo medible.</li>\n<li><strong>Efectos de red al estilo Metcalfe.</strong> Valor que escala con el cuadrado de los usuarios activos. Encaja con algunos datos históricos, aunque es un ajuste de curva más que una teoría.</li>\n<li><strong>Stock-to-flow.</strong> Muy promocionado, y ha fallado feo fuera de muestra. Trátalo como un ejemplo de advertencia sobre narrativas retroajustadas, no como un modelo.</li>\n</ul>\n<div class=\"box\"><b>Mejores preguntas que \"cuánto vale\"</b><p>¿Quién usa esto de verdad y para qué, medido en algo que no sea el precio? ¿Qué hace esto que no pueda hacer una base de datos o una vía de pago que ya existe? ¿Quién tiene el suministro, y cuánto se desbloquea en los próximos dos años? ¿Cuáles son los ingresos por comisiones, y están creciendo? Si el token desapareciera mañana, ¿el producto seguiría funcionando — y si sí, por qué existe el token? Estas preguntas matan rápido a la mayoría de los proyectos, que es exactamente lo que quieres que hagan.</p></div>"},{"h":"Stablecoins, rendimiento y de dónde sale el dinero","body":"\n<p>Las stablecoins son el producto real más claro del sector — tokens denominados en dólares que se mueven globalmente en segundos por centavos. También son donde mucho dinero minorista se ha evaporado en silencio.</p>\n<p><strong>Tres diseños, riesgos muy distintos:</strong></p>\n<ul>\n<li><strong>Respaldadas por dinero fiduciario</strong> (USDC, USDT). Se supone que cada token está respaldado por efectivo y bonos del Tesoro de corto plazo en un banco. El riesgo es del emisor y bancario, y la calidad de la divulgación varía materialmente entre emisores. USDC rompió brevemente su paridad en marzo de 2023 cuando parte de sus reservas estaban en Silicon Valley Bank — un recordatorio de que \"totalmente respaldado\" sigue significando respaldado por algo que puede fallar.</li>\n<li><strong>Sobrecolateralizadas y respaldadas por cripto</strong> (estilo DAI). Respaldadas por más de un dólar de cripto volátil por cada dólar emitido, con liquidaciones automatizadas. Transparentes, ineficientes en capital, y vulnerables a una caída lo bastante rápida.</li>\n<li><strong>Algorítmicas.</strong> Mantienen la paridad mediante mecánicas de acuñar y quemar, sin respaldo real. Terra/UST vaporizó aproximadamente $40 mil millones en cuestión de días en mayo de 2022. Trata esta categoría como una pregunta ya resuelta.</li>\n</ul>\n<div class=\"box warn\"><b>Siempre pregunta de dónde sale el rendimiento</b><p>Un dólar es un dólar. Si alguien te ofrece 12% sobre un token denominado en dólares mientras los bonos del Tesoro pagan mucho menos, el exceso es la compensación por un riesgo que no te explicaron — típicamente prestar tus fondos a traders apalancados, o exposición a un protocolo que puede ser explotado. Celsius, BlockFi y Voyager anunciaban todos rendimientos que sonaban seguros y todos quebraron con el dinero de sus clientes. Existen fuentes legítimas de rendimiento (recompensas de staking, prestar a tasas de mercado, creación de mercado), y cada una de ellas carga un riesgo que deberías poder enunciar en una frase antes de participar.</p></div>\n<p>Relacionado: el <strong>staking</strong> te paga por ayudar a asegurar una red de prueba de participación. Es real, pero no es gratis — tu capital puede quedar bloqueado durante un periodo de desvinculación, los validadores pueden ser penalizados por caídas o mal comportamiento, y las recompensas son gravables como ingreso ordinario cuando las recibes, al valor de esa fecha, vendas o no.</p>"},{"h":"Impuestos: propiedad, no moneda","body":"\n<p>En EE. UU., el IRS trata a los activos digitales como <strong>propiedad</strong>, no como moneda. Esa sola clasificación determina todo lo demás, y sorprende a casi todos los tenedores nuevos.</p>\n<ul>\n<li><strong>Cada disposición es un evento gravable.</strong> Vender por dólares, intercambiar un token por otro, gastarlo en una compra o convertirlo a una stablecoin realizan ganancia o pérdida. Cambiar el token A por el token B se siente como moverse entre posiciones; el IRS lo trata como una venta de A a valor justo de mercado.</li>\n<li><strong>El periodo de tenencia sigue importando.</strong> Más de un año obtiene las tasas de ganancias de capital de largo plazo; un año o menos es ingreso ordinario. La misma palanca que con las acciones.</li>\n<li><strong>Los eventos de ingreso se gravan al recibirlos.</strong> Las recompensas de staking, los ingresos de minería, los airdrops y la cripto recibida como pago son ingreso ordinario al valor justo de mercado del día en que los recibes, y ese valor pasa a ser tu base de costo de ahí en adelante.</li>\n<li><strong>El hueco de la venta ficticia.</strong> Como la cripto es propiedad y no un valor, la regla de venta ficticia (wash sale) que gobierna a las acciones por lo general no ha aplicado — o sea que se podía cosechar una pérdida y recomprar el mismo activo de inmediato. El Congreso ha propuesto cerrar esto repetidamente y sigue siendo un objetivo legislativo vivo, así que confirma la regla vigente con un profesional de impuestos antes de apoyarte en ella.</li>\n<li><strong>El reporte se ha endurecido.</strong> Los intermediarios ahora emiten el <strong>Form 1099-DA</strong> para transacciones de activos digitales, primero con el reporte de ingresos brutos y con el reporte de base de costo entrando por etapas. La base debe rastrearse por billetera o por cuenta, en vez de agruparse entre todo. Si tu historial abarca varios exchanges y billeteras en autocustodia, reconstrúyelo ahora y no durante la temporada de declaración.</li>\n<li><strong>Las pérdidas siguen jugando a tu favor.</strong> Las pérdidas realizadas en cripto compensan ganancias de capital de cualquier fuente — incluidas las ganancias en acciones — más $3,000 de ingreso ordinario al año, con el resto trasladado hacia adelante.</li>\n</ul>\n<div class=\"box warn\"><b>La trampa que atrapa a la gente</b><p>Alguien opera activamente a lo largo de un mercado alcista, va rodando ganancias de token en token sin jamás sacar a dólares, y termina el año con una gran obligación fiscal realizada y una cartera que desde entonces cayó 70%. El impuesto se debe sobre las ganancias tal como se realizaron; la caída posterior no lo borra. Si operas, ve apartando el impuesto estimado en dólares sobre la marcha.</p></div>"},{"h":"Dimensionamiento de la posición, y el caso bajista honesto","body":"\n<p>Todo lo que compres aquí debería dimensionarse suponiendo que el caso bajista podría tener razón. Así que enúncialo como corresponde.</p>\n<p><strong>El caso bajista:</strong> después de más de quince años, el uso cotidiano fuera del trading y la especulación sigue siendo escaso; las stablecoins son el único producto con tracción clara, y sirven mayormente a la propia economía cripto. La mayoría de los tokens son valores no registrados con personas internas que tienen el suministro concentrado. La historia de la industria incluye los mayores fraudes financieros de la última década. Las valuaciones descansan en narrativas de adopción y no en flujos de efectivo. Y la correlación con los activos de riesgo significa que no ha cumplido la promesa de diversificación cuando importaba.</p>\n<p><strong>El caso alcista:</strong> un activo al portador de suministro fijo, fuera del control de cualquier gobierno, es genuinamente novedoso y tiene un público obvio en un mundo de déficits grandes y controles de capital. Bitcoin ha sobrevivido múltiples caídas del 80%, una década de obituarios anunciados, y ahora tiene acceso vía ETF regulados y custodia institucional. Una infraestructura de liquidación que funciona de forma continua sin intermediarios tiene utilidad real, sobre todo visible en los pagos transfronterizos. Y el argumento de la asimetría — que una posición del 2% se puede dar por perdida entera mientras ofrece un potencial de alza significativo — es matemáticamente sólido si se respeta el dimensionamiento.</p>\n<div class=\"box\"><b>Cómo se ve aquí la disciplina</b><p>Decide la asignación por adelantado como porcentaje — lo más común es 1–5% de los activos invertibles — y deja que el tamaño, no la convicción, sea tu control de riesgo. Compra según un calendario fijo. <strong>Rebalancea</strong>: si sube de 3% a 12%, recorta de vuelta al objetivo y mueve lo obtenido a las partes aburridas de la cartera. Esa única regla mecánica es la forma en que las asignaciones especulativas se vuelven riqueza realizada en vez de viajes de ida y vuelta. Y guárdala de una manera que te sobreviva — el trabajo de custodia y herencia de esta inmersión profunda importa más que cualquier precio de entrada que llegues a elegir.</p></div>\n<p>Encuadre final: cripto es el único tema de esta guía donde la tecnología y el mercado merecen veredictos completamente separados. Puedes encontrar la ingeniería genuinamente interesante, creer que algo de esto va a importar dentro de veinte años, y aun así concluir que la mayor parte de lo que hoy se le vende a los compradores minoristas no vale la pena tener. Esas posiciones son totalmente consistentes.</p>"}]});
TOPICS_ES.push({"id":"annuities","icon":"⏳","c":"#8fd14f","lvl":"Ingresos","name":"Anualidades","tag":"Le entregas a una aseguradora un montón de dinero y ella te entrega un cheque que no se te puede acabar mientras vivas. Ese es el producto. Todo lo demás es empaque.","blurb":"Cambiar una suma global por ingreso garantizado. Los cuatro tipos principales, cuáles son las comisiones de verdad, y los pocos casos en los que sí tienen sentido.","deepTeaser":"Créditos de mortalidad y por qué las anualidades le ganan matemáticamente a los bonos, la mecánica de los topes en las anualidades indexadas, las cuentas del rider GLWB, la trampa fiscal LIFO, los calendarios de rescate, los QLAC, y cómo comprar una sin que te la vendan.","basics":[{"h":"Qué es realmente una anualidad","body":"\n<p>Todos los demás temas de este sitio resuelven el problema de <em>acumular</em> dinero. Una anualidad resuelve un problema distinto: <strong>no sabes cuánto vas a vivir.</strong></p>\n<p>Planea gastar una cartera de $700,000 a lo largo de 20 años y vas bien — salvo que vivas 32 años más. Eso es el <strong>riesgo de longevidad</strong>, y es el único riesgo financiero que no puedes diversificar por tu cuenta. Una aseguradora sí puede, porque agrupa a miles de personas. Algunas mueren pronto, otras llegan a los 100, y el promedio del grupo es muy predecible aunque para ti sea imposible de saber.</p>\n<p>Así que el trato es: le das dinero a la aseguradora y ella queda obligada por contrato a pagarte — empezando ahora o en una fecha futura, durante un número fijo de años o por el resto de tu vida. Estás comprando un <strong>contrato</strong>, no una inversión. Su valor está en la garantía.</p>\n<div class=\"box\"><b>El modelo mental limpio</b><p>El Seguro Social es una anualidad. Una pensión tradicional también. Ambos te pagan un monto mensual fijo de por vida, ajustado o no por inflación, respaldado por una entidad que agrupa el riesgo de longevidad. Una anualidad comercial tiene la misma estructura, vendida a ti de forma privada, con un precio puesto por una aseguradora que necesita ganar dinero en la transacción.</p></div>\n<p>Esa última frase es toda la razón por la que las anualidades son polémicas. La estructura es legítima y de verdad útil. Los productos construidos encima van desde limpios y baratos hasta opacos y caros, y los incentivos de venta apuntan con fuerza hacia el extremo caro.</p>"},{"h":"Los cuatro tipos, y qué tan distintos son en realidad","body":"\n<p>La gente dice \"anualidad\" como si fuera un solo producto. Estos cuatro no tienen casi nada en común más allá del nombre y el tratamiento fiscal.</p>\n<table>\n<tr><th>Tipo</th><th>Qué obtienes</th><th>Complejidad</th><th>Costo típico</th></tr>\n<tr><td><strong>Inmediata (SPIA)</strong></td><td>Pagas una suma global, el ingreso empieza dentro del primer año y dura de por vida</td><td>Muy baja — un solo número que comparar</td><td>Va incluido en la tasa de pago; comisión ~1–4%</td></tr>\n<tr><td><strong>Ingreso diferido (DIA / QLAC)</strong></td><td>Pagas ahora, el ingreso empieza a una edad futura que tú eliges (digamos 80)</td><td>Baja</td><td>Parecido al SPIA</td></tr>\n<tr><td><strong>Fija / MYGA</strong></td><td>Una tasa de interés garantizada por un plazo fijo. Básicamente un CD emitido por una aseguradora</td><td>Baja</td><td>La tasa ya viene neta de costos; aplican cargos por rescate</td></tr>\n<tr><td><strong>Indexada fija (FIA)</strong></td><td>Crédito ligado a un índice, piso de 0%, alza con tope</td><td>Alta</td><td>Los topes y las tasas de participación son el costo; comisión 5–8%</td></tr>\n<tr><td><strong>Variable (VA)</strong></td><td>El efectivo se invierte en subcuentas de mercado, normalmente con un rider de ingreso</td><td>Muy alta</td><td>2–4% al año todo incluido con riders; comisión 5–7%</td></tr>\n</table>\n<div class=\"box\"><b>La división que importa</b><p>Los primeros tres son <strong>contratos simples</strong> — puedes comparar cotizaciones de cinco aseguradoras con un solo número y quedarte con la mejor. Los últimos dos son <strong>productos de acumulación con un envoltorio de seguro</strong>, donde la aseguradora puede ajustar los términos después de que firmas y el costo real está repartido entre topes, spreads, comisiones de riders y calendarios de rescate. Casi toda historia de terror sobre anualidades involucra las dos últimas filas.</p></div>"},{"h":"Cómo paga en realidad una anualidad inmediata","body":"\n<p>Toma la versión más simple. Alguien de 67 años le entrega $200,000 a una aseguradora por una anualidad inmediata de prima única. Según las tasas y el género, eso podría comprar algo así como $1,200–$1,400 al mes de por vida.</p>\n<p>Anualizado, eso es más o menos una <em>tasa de pago (payout rate)</em> de 7–8% — que parece imposible al lado de un bono al 4%. No es un rendimiento. Cada cheque es en parte tu propio capital que regresa, en parte intereses, y en parte <strong>crédito de mortalidad</strong> — dinero que el fondo común libera gracias a los que murieron antes del promedio. Ese tercer componente es real, es exclusivo de las anualidades y crece muchísimo con la edad. También es la razón por la que, pasada cierta edad, no puedes replicar una anualidad con una escalera de bonos.</p>\n<p>El costo de todo esto es brutal y conviene decirlo en voz alta antes de firmar: <strong>en la versión simple, si mueres en el año tres, la aseguradora se queda con el resto.</strong> Puedes quitarte eso de encima con opciones del contrato, y cada una baja tu cheque mensual.</p>\n<table>\n<tr><th>Opción de pago</th><th>Qué hace</th><th>Efecto en tu cheque</th></tr>\n<tr><td>Solo vida</td><td>Paga hasta que mueres, y ahí se acaba</td><td>El pago más alto</td></tr>\n<tr><td>Vida con 10 años garantizados</td><td>Si mueres en el año 4, tus beneficiarios cobran los 6 años restantes</td><td>Un poco más bajo</td></tr>\n<tr><td>Reembolso en efectivo</td><td>Los beneficiarios recuperan el capital que no se haya pagado</td><td>Más bajo</td></tr>\n<tr><td>Conjunta y de sobreviviente</td><td>Continúa para el cónyuge, muchas veces al 100% o al 50%</td><td>Bastante más bajo — pero normalmente lo correcto para una pareja</td></tr>\n<tr><td>Ajustada por inflación (COLA)</td><td>El pago sube 2–3% al año</td><td>Mucho más bajo al principio; se empareja cuando llegas a los 80</td></tr>\n</table>"},{"h":"Cuándo una anualidad sí tiene sentido","body":"\n<p>Vale la pena ser claro con esto, porque los usos honestos son reales y son pocos.</p>\n<ul>\n<li><strong>Quieres tu piso cubierto, garantizado.</strong> Suma tus gastos mensuales no negociables — vivienda, comida, servicios, seguros, medicinas. Réstale el Seguro Social y cualquier pensión. Si queda un hueco, una anualidad inmediata simple que tape exactamente ese hueco convierte el \"¿me va a alcanzar la cartera?\" en \"mi piso está cubierto, y el resto de la cartera puede seguir invertido\". Ese cambio psicológico vale dinero de verdad, porque evita que la gente venda acciones en pánico cuando el mercado cae.</li>\n<li><strong>No tienes pensión y tienes una esperanza de vida larga.</strong> Buena salud y longevidad familiar hacen que las cuentas del crédito de mortalidad jueguen a tu favor.</li>\n<li><strong>Te preocupa tu propio deterioro cognitivo, o la capacidad de un cónyuge sobreviviente para manejar dinero.</strong> Un cheque que llega solo, de por vida, es protección contra una falla real y muy común de la vejez.</li>\n<li><strong>Quieres retrasar el Seguro Social hasta los 70.</strong> Una anualidad corta de plazo cierto puede tender el puente de los 65 a los 70 y comprarte un beneficio permanentemente mayor, ajustado por inflación y respaldado por el gobierno. Ese suele ser el uso de mayor valor que tiene una anualidad.</li>\n<li><strong>Una MYGA como alternativa a un CD.</strong> Si una anualidad fija a 5 años paga más que un CD o un Treasury a 5 años y no vas a necesitar el dinero, es una opción razonable y aburrida. Nada más ten claro tu calendario de rescate.</li>\n</ul>\n<div class=\"box warn\"><b>Cuándo no</b><p>Todavía tienes match del empleador sin aprovechar. Tienes menos de 55 años y sigues acumulando. No has llenado al máximo el 401(k), la IRA o la HSA. Necesitas el dinero líquido. O ya tienes una pensión más Seguro Social que cubren tu piso — en cuyo caso ya tienes ingreso garantizado de sobra y agregar más es pagar una comisión por algo que ya tienes.</p></div>"},{"h":"Cómo comprar una sin que te la vendan","body":"\n<ol class=\"steps\">\n<li><b>Primero define qué problema estás resolviendo</b> Escribe en dólares el hueco mensual de ingreso que realmente tienes. Compra exactamente esa cantidad de ingreso garantizado y nada más. Entrar a la conversación con un número es lo que evita que salgas con una anualidad variable de $400,000.</li>\n<li><b>Empieza con el producto más simple que lo resuelva</b> Un SPIA o un DIA en casi todos los casos. Si alguien te empuja hacia un producto indexado o variable antes de explicarte por qué un SPIA no encaja, eso es información sobre esa persona, no sobre los SPIA.</li>\n<li><b>Pide cotizaciones a varias aseguradoras</b> immediateannuities.com y las mesas de anualidades de Fidelity, Schwab y Vanguard cotizan varias compañías en la misma pantalla. Para un SPIA el producto es un commodity — las únicas variables son el pago mensual y la solidez financiera de la aseguradora. Los pagos pueden diferir 5–10% entre compañías por un contrato idéntico.</li>\n<li><b>Revisa las calificaciones de la aseguradora</b> AM Best A o mejor, y contrasta con S&amp;P o Moody's. Vas a depender de esta empresa durante 30 años, y aquí no hay FDIC (ver el análisis a fondo sobre las asociaciones estatales de garantía).</li>\n<li><b>Nunca anualices todo</b> Un techo común es 25–40% de tus activos invertibles. Necesitas liquidez para emergencias, y quieres que las acciones sigan trabajando contra la inflación.</li>\n<li><b>Considera escalonar la compra</b> Comprar en tramos a lo lar
