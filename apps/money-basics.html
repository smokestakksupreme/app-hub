deep:[
{h:'Mortality credits: the one thing annuities do that nothing else can', body:`
<p>This is the mathematical core, and almost nobody explains it. Understand this and every annuity sales pitch becomes easy to evaluate.</p>
<p>Imagine 1,000 people aged 65 each put in $100,000. The insurer invests it conservatively and pays everyone an income. Each year some participants die and stop collecting — and their remaining balances stay in the pool, funding higher payments to survivors. That transfer is the <strong>mortality credit</strong>.</p>
<p>The effect compounds with age, because the annual probability of death rises steeply. At 65 the mortality credit is a small share of your payment. At 85 it can be the dominant component — an implied return no bond portfolio can match, because bonds have no mechanism to capture money from people who died.</p>
<div class="box"><b>The practical consequence</b><p>Annuities are priced most attractively for people who are <strong>older</strong> and <strong>expect to live longer than average</strong>. This is why a deferred income annuity bought at 65 with payments starting at 80 is often the most capital-efficient way to insure longevity: you commit a small amount now, and the mortality credits over the deferral period do enormous work. Roughly 10–15% of a portfolio in a DIA can cover the tail risk that the other 85% has to fund otherwise.</p></div>
<p>Two consequences flow from this. First, <strong>buying an annuity in your 50s is usually inefficient</strong> — you get little mortality credit and lock up capital for decades. Second, <strong>adverse selection is real</strong>: healthy people buy annuities, which insurers know, so pricing already assumes a longer-lived buyer pool. If you have a health condition that shortens life expectancy, ask about <strong>medically underwritten</strong> or "impaired risk" annuities, which pay substantially more. Very few buyers know these exist.</p>`},

{h:'Fixed indexed annuities: where the money actually goes', body:`
<p>An FIA is pitched as market upside with no downside. Mechanically, here is what the insurer does with your premium: it buys a bond portfolio yielding, say, 5%, and uses a slice of that yield to buy call options on an index. The bonds guarantee your principal; the options fund whatever index credit you get. Your realistic long-run return is bounded by that bond yield minus the insurer's profit and distribution costs.</p>
<p>Which means <strong>an FIA is a bond-like product with an equity-shaped payoff pattern</strong>, not an equity product with a safety net. Once you see it that way, the levers make sense — and every one of them is adjustable by the insurer after you sign:</p>
<table>
<tr><th>Lever</th><th>How it limits you</th></tr>
<tr><td><strong>Cap rate</strong></td><td>Index up 18%, cap is 8%, you get 8%. Caps get lowered when bond yields fall</td></tr>
<tr><td><strong>Participation rate</strong></td><td>You get 60% of the index move. Index up 10%, you get 6%</td></tr>
<tr><td><strong>Spread / margin</strong></td><td>Insurer subtracts a fixed amount first. Index up 6% with a 2% spread, you get 4%</td></tr>
<tr><td><strong>No dividends</strong></td><td>Index credits track price return only. Historically that is roughly 2% a year of total return you never see</td></tr>
<tr><td><strong>Annual reset / point-to-point</strong></td><td>A mid-year spike that reverses by the anniversary earns you nothing</td></tr>
<tr><td><strong>Volatility-controlled indices</strong></td><td>Custom indices built for these products, with low volatility by design — which means low returns by design. Backtested histories on them are marketing, not evidence</td></tr>
</table>
<div class="box warn"><b>The three questions that cut through any FIA illustration</b><p><strong>1.</strong> What is the <em>minimum guaranteed</em> cap or participation rate — the worst you can legally be moved to? <strong>2.</strong> What are the current and minimum rates on every index option in the contract? <strong>3.</strong> Has this insurer lowered caps on in-force contracts before? Insurers can and do. The illustration is not a promise; only the guaranteed column is.</p></div>
<p>The 0% floor is real and worth something — but understand precisely what it protects. It protects the index credit from being negative. It does not protect your account value from rider fees, which are deducted regardless. A contract with a 1.05% GLWB fee in a flat market loses value every year.</p>`},

{h:'Income riders and the "income base" illusion', body:`
<p>The most-sold and least-understood feature. A <strong>GLWB</strong> (guaranteed lifetime withdrawal benefit) rider promises you can withdraw a fixed percentage for life even if the account value drops to zero — and unlike annuitizing, you keep access to whatever balance remains.</p>
<p>The pitch usually sounds like: "Your income base grows at a guaranteed 7% a year." That is where people get confused, and it is worth being blunt about.</p>
<div class="box warn"><b>The income base is not your money</b><p>There are two ledgers in the contract. The <strong>account value</strong> is real — you can withdraw it, surrender it, or leave it to heirs. The <strong>income base</strong> (or benefit base, or roll-up value) is a bookkeeping number whose only purpose is to multiply against a withdrawal percentage. You cannot cash it out. You cannot bequeath it. A contract can show a $300,000 income base and a $190,000 account value at the same time, and only one of those numbers is yours.</p></div>
<p>To evaluate a rider, ignore the roll-up rate entirely and compute the actual dollars:</p>
<ul>
<li><strong>Income base × withdrawal percentage = annual income.</strong> A 7% roll-up sounds enormous, but if the withdrawal percentage at your start age is 4.5%, a $300,000 base yields $13,500 a year. Compare <em>that number</em> against what a plain SPIA with the same premium pays today. Frequently the SPIA wins outright, at a fraction of the complexity.</li>
<li><strong>Count all the fees:</strong> rider fee (0.95–1.50%), mortality &amp; expense charge on a VA (1.00–1.40%), administrative fee, and subaccount expenses (0.50–1.00%+). All-in on a loaded variable annuity, 2.5–3.5% a year is common. That is the entire long-run real return of a bond portfolio, gone.</li>
<li><strong>Watch the fee base.</strong> Some contracts charge the rider fee against the <em>income base</em>, not the account value — so the fee rises as the phantom number grows, draining the real money faster.</li>
<li><strong>Excess withdrawals reset everything.</strong> Take one dollar more than the permitted amount in a year and many contracts recalculate the guarantee downward, permanently.</li>
</ul>`},

{h:'Taxes: qualified, non-qualified, and the LIFO trap', body:`
<p>Annuity taxation splits hard depending on the money's origin.</p>
<p><strong>Qualified</strong> (bought inside an IRA or 401(k)): the whole thing follows retirement account rules. Every distribution is ordinary income and RMDs apply. Nothing about the annuity changes that.</p>
<p><strong>Non-qualified</strong> (bought with after-tax money): growth is tax-deferred, and there is no contribution limit — which is the one legitimate tax argument for a deferred annuity, applicable to someone who has already maxed every other tax-advantaged account.</p>
<div class="box warn"><b>Last in, first out</b><p>Withdraw from a non-qualified deferred annuity and the IRS treats the <strong>gains as coming out first</strong>, taxed as ordinary income, plus a 10% penalty before 59½. You only reach your tax-free principal after all the gain is exhausted. This is the opposite of a brokerage account, where you would pay long-term capital gains rates. All annuity growth is converted to ordinary income — so you have traded a preferential tax rate for deferral.</p></div>
<p>Two more that matter:</p>
<ul>
<li><strong>Exclusion ratio.</strong> If you <em>annuitize</em> a non-qualified contract rather than taking withdrawals, each payment is split into a tax-free return-of-principal portion and a taxable interest portion, based on your life expectancy at the start. Much friendlier than LIFO withdrawals — annuitizing and withdrawing are taxed very differently, and people rarely realize they are choosing.</li>
<li><strong>No step-up in basis.</strong> Heirs who inherit a non-qualified annuity owe ordinary income tax on all the gain. An inherited brokerage account gets a full step-up and the gain disappears. If leaving assets to heirs is a priority, annuities are among the worst assets to bequeath and the best to spend down.</li>
</ul>
<p><strong>1035 exchange</strong> lets you move from one annuity to another without triggering tax — useful for escaping a bad contract. But it usually restarts a surrender schedule and generates a new commission, which is exactly why some agents recommend it. Ask what specifically improves, in dollars.</p>
<p><strong>QLAC:</strong> a qualified longevity annuity contract lets you move a limited amount of IRA money into a deferred income annuity that is excluded from RMD calculations until payments start (as late as 85). It shrinks your RMDs and hedges longevity at the same time. Limits are indexed annually — check the current figure.</p>`},

{h:'Surrender schedules, liquidity, and what happens if the insurer fails', body:`
<p>Two risks that get glossed over at the point of sale.</p>
<p><strong>Liquidity.</strong> A typical surrender schedule starts at 7–10% in year one and steps down by roughly a point a year. Some contracts run 10 years; a few run longer. Most allow a 10% free withdrawal annually after the first year. Some include a <strong>market value adjustment</strong> that further reduces your surrender value if rates rose since purchase — a second penalty stacked on the first. Any annuity purchase should assume the money is genuinely unavailable for the full schedule.</p>
<p><strong>Credit risk.</strong> An annuity is an unsecured promise from one insurance company. There is no FDIC and no SIPC. What exists is the <strong>state guaranty association</strong> system: if an insurer becomes insolvent, your state's association covers contracts up to a limit — commonly $250,000 in present value for annuities, though it varies by state and coverage is generally based on your state of residence.</p>
<div class="box"><b>Practical protection</b><p>Buy only from insurers rated A or better by AM Best, and if you are placing more than your state's guaranty limit, <strong>split it across two or three carriers</strong>. Two $200,000 contracts at different insurers is materially safer than one $400,000 contract, and the payout difference is usually trivial. Insurance insolvencies are rare but not hypothetical — Executive Life in 1991 and Penn Treaty in 2017 both left policyholders in years-long receiverships.</p></div>
<p>Also worth knowing: the private equity firms that have acquired a number of annuity writers in recent years typically hold more complex, less liquid assets on the balance sheet than traditional mutual insurers. It does not make them unsound, but it is a reason to look at the rating and the ownership rather than the brand name on the brochure.</p>`},

{h:'Annuity vs. bond ladder vs. just staying invested', body:`
<p>The real decision is rarely "annuity or nothing." It is which tool covers guaranteed spending.</p>
<table>
<tr><th></th><th>SPIA</th><th>TIPS / Treasury ladder</th><th>Diversified portfolio, 4% withdrawal</th></tr>
<tr><td>Longevity protection</td><td>Complete — cannot outlive it</td><td>Ends when the ladder ends</td><td>None guaranteed; depends on returns</td></tr>
<tr><td>Inflation protection</td><td>Only if you buy a COLA rider, at real cost</td><td>Excellent with TIPS</td><td>Good over long periods via equities</td></tr>
<tr><td>Liquidity</td><td>None once annuitized</td><td>Full</td><td>Full</td></tr>
<tr><td>Leaves an estate</td><td>Generally no</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Sequence-of-returns risk</td><td>Eliminated</td><td>Eliminated for the laddered years</td><td>The central risk of early retirement</td></tr>
<tr><td>Cost / complexity</td><td>Low if you buy a plain SPIA</td><td>Low</td><td>Very low</td></tr>
</table>
<div class="box"><b>The structure most planners actually converge on</b><p>Cover your <strong>essential</strong> expenses with guaranteed income — Social Security first, delayed to 70 if you can, then a plain SPIA or DIA sized only to close whatever gap remains. Fund <strong>discretionary</strong> spending from a diversified portfolio that stays invested for growth and inflation protection. This is sometimes called flooring, and it is the version of the annuity argument that survives scrutiny: buy the guarantee for the floor, not for the whole house.</p></div>
<p>Sizing sanity check: guaranteed income sources — Social Security, pension, annuity — covering roughly 100% of essential expenses, with annuity premium held to 25–40% of investable assets. Beyond that you are paying insurance company margin on money that would do better staying invested, and giving up the liquidity you will want when something unexpected happens.</p>
<p>Final framing worth carrying into any sales meeting: <strong>the mortality-credit math genuinely works, and the product built around it frequently does not.</strong> A stripped-down immediate annuity from a highly rated insurer is a clean, useful, boring instrument. The further a product drifts from that — riders, indices, roll-ups, bonuses — the more of the value is being converted into fees and commission. Simplicity here is not a compromise; it is the actual best version.</p>`}
]

blurb:'Term vs. whole life, how much you actually need, and why the expensive kind gets sold so hard.',
deepTeaser:'How cash value really works, IUL and VUL mechanics, the 7-pay/MEC rule, riders worth having, underwriting, and where permanent insurance genuinely makes sense.',
basics:[
{h:'What it is and who needs it', body:`
<p>You pay a <strong>premium</strong>. If you die while the policy is in force, the insurer pays a <strong>death benefit</strong> — a lump sum, income-tax-free — to whoever you named as beneficiary. That is the entire product.</p>
<p>The real question is not "should I have life insurance" but "does anyone lose money if I die?"</p>
<ul>
<li><strong>Yes:</strong> a spouse who depends on your income, kids, a parent you support, a mortgage that a survivor could not carry alone, a business partner, or co-signed debt.</li>
<li><strong>Probably not:</strong> single with no dependents and no co-signed obligations, or already wealthy enough that your assets cover everything.</li>
</ul>
<div class="box"><b>Life insurance on children</b><p>Agents pitch it as "locking in insurability" and as a savings vehicle. But children have no income to replace, and the savings component is weak. A 529 plan or a custodial brokerage account does the savings job far better. The exception is genuinely limited: a documented family history that would make future coverage hard to obtain.</p></div>`},

{h:'Term vs. permanent — the whole debate in one table', body:`
<table>
<tr><th></th><th>Term life</th><th>Whole / permanent life</th></tr>
<tr><td>How long</td><td>A set period: 10, 20, 30 years</td><td>Your entire life, if premiums are paid</td></tr>
<tr><td>Cost</td><td>Cheap. Often 5–15x cheaper for the same death benefit</td><td>Expensive</td></tr>
<tr><td>Cash value</td><td>None</td><td>Yes — a savings component that builds slowly</td></tr>
<tr><td>Best for</td><td>The 20–30 years when a family depends on your income</td><td>Estate tax planning, lifelong dependents, business succession, high earners who have maxed everything else</td></tr>
<tr><td>Typical outcome</td><td>You outlive it, having paid a modest amount for real protection</td><td>Roughly a third of policies lapse before paying out — often after years of high premiums</td></tr>
</table>
<p>The standard advice — "buy term and invest the difference" — is standard because the math usually supports it. A healthy 35-year-old might pay a few hundred dollars a year for $1,000,000 of 20-year term. The equivalent whole life policy could run several thousand a year. Invest that gap in an index fund for 20 years and it will typically outperform the policy's cash value substantially.</p>
<div class="box warn"><b>Why you get pitched permanent so hard</b><p>Commissions. First-year commission on a whole life policy commonly runs 50–110% of the first year's premium; on term it is a small fraction of that. That does not make permanent insurance a scam — it has legitimate uses — but it does mean the person recommending it may not be neutral. Ask directly how they are compensated, and ask whether they are a fiduciary.</p></div>`},

{h:'How much coverage', body:`
<p>The lazy rule is 10–12x your income. It is a fine starting number. The better method is to add up what actually needs funding:</p>
<ol class="steps">
<li><b>Income replacement</b> Annual income your household would lose, times the number of years the survivors need it. Until the youngest kid finishes college is a common marker.</li>
<li><b>Debt payoff</b> Mortgage balance, car loans, private student loans (federal loans are generally discharged at death; private ones often are not), and any co-signed debt.</li>
<li><b>Future obligations</b> College costs, care for a dependent with special needs, a plan to keep a business running.</li>
<li><b>Final expenses</b> Funeral, medical bills, estate settlement — typically $10,000–$25,000.</li>
<li><b>Subtract what exists</b> Current savings, investments, existing group coverage, and Social Security survivor benefits.</li>
</ol>
<p>Do not skip coverage on a non-earning spouse. Replacing full-time childcare, household management, and logistics costs real money — often $40,000–$60,000 a year. A smaller policy there is legitimate.</p>`},

{h:'How to buy it', body:`
<ol class="steps">
<li><b>Check what you already have</b> Employer group life is usually 1–2x salary. It is nearly free and worth having — but it ends when the job does, so do not build your plan on it.</li>
<li><b>Decide term length</b> Match it to the obligation. Youngest child is 3? A 20-year term carries you to their college years. Mortgage has 25 years left? Consider 30-year term. Some people <em>ladder</em> — a 30-year and a 20-year policy stacked, so coverage steps down as obligations shrink.</li>
<li><b>Compare across carriers</b> Rates for identical coverage vary widely because each insurer underwrites health conditions differently. Use an independent broker who quotes many carriers, or an online comparison service. The policy is a commodity; the price is not.</li>
<li><b>Check the insurer's financial strength</b> AM Best rating of A or better. You are buying a promise that may need to be honored 30 years from now.</li>
<li><b>Get through underwriting</b> Application, health questionnaire, usually a paramedical exam — blood, urine, height/weight, blood pressure, at your home. They will pull your prescription history, MVR, and MIB file. Answer honestly; misrepresentation lets them deny the claim later, which is the worst possible time to find out.</li>
<li><b>Name beneficiaries, and name contingents</b> Then review after every marriage, divorce, birth, or death. This designation overrides your will.</li>
</ol>
<div class="box"><b>Get it early</b><p>Premiums are locked at issue and priced on your age and health that day. A policy bought at 32 in good health costs a fraction of the same policy at 48 after a diagnosis. If you know you will need coverage, waiting is expensive — and a new condition can make you uninsurable outright.</p></div>`}
],

deep:[
{h:'What cash value actually is', body:`
<p>Marketing describes cash value as savings inside your policy. Mechanically, it is what is left after the insurance company takes its cut.</p>
<p>Your premium gets split three ways: the <strong>cost of insurance</strong> (the actual mortality charge, which rises every year as you age), <strong>fees and commissions</strong> (heavily front-loaded — in year one, most or all of your premium can go here), and whatever remains goes to <strong>cash value</strong>, which then earns a credited rate.</p>
<p>This is why cash value is typically near zero for the first two or three years, and why the internal rate of return on a whole life policy over 20 years often lands in the low single digits. It improves the longer you hold, which is exactly why the illustration you get shown emphasizes year 30 and not year 5.</p>
<div class="box warn"><b>Reading an illustration</b><p>Every illustration has a <strong>guaranteed</strong> column and a <strong>non-guaranteed</strong> column. Only the guaranteed column is a promise. The projected column assumes dividend scales or crediting rates that the insurer can and does change. Ask for the illustration run at guaranteed rates and at the current rate minus 1–2%, then decide based on that.</p></div>
<p>And the detail that surprises people most: with a traditional whole life policy, <strong>when you die, your beneficiaries generally get the death benefit — not the death benefit plus the cash value.</strong> The cash value effectively funds the death benefit. Some policies offer a "return of premium" or increasing death benefit option, at additional cost.</p>`},

{h:'Accessing cash value without wrecking the policy', body:`
<p>Three ways out, with very different consequences.</p>
<ul>
<li><strong>Withdrawal.</strong> Take money out up to your basis (total premiums paid) tax-free; above that it is taxable. Permanently reduces the death benefit.</li>
<li><strong>Policy loan.</strong> Borrow against cash value. Not a taxable event, no credit check, no repayment schedule. But interest accrues, and unpaid loans plus interest reduce the death benefit. If the loan balance ever exceeds cash value, the policy <strong>lapses — and the entire gain becomes taxable income in that year</strong>, with no cash coming in to pay the bill. This is the single nastiest failure mode in permanent insurance, and it usually hits people in their 70s.</li>
<li><strong>Surrender.</strong> Cancel and take the cash value minus surrender charges. Gains above basis are taxed as ordinary income.</li>
</ul>
<div class="box"><b>1035 exchange</b><p>If you are stuck in a bad permanent policy, a <strong>1035 exchange</strong> lets you move the cash value into a different policy or an annuity without triggering tax. Better than surrendering and eating the tax bill. Note that surrendering at a loss does not generally give you a deductible loss.</p></div>
<p><strong>The "be your own bank" / infinite banking pitch</strong> is built on policy loans. The mechanics are real — you can borrow against cash value and keep the underlying credited rate running. What the pitch omits: years of front-loaded costs before the cash value is meaningful, loan interest that is usually close to or above the crediting rate, and the lapse risk above. It can work for someone who is already maxing every tax-advantaged account and wants a genuinely low-volatility asset. It is not a substitute for a 401(k), and it is sold to people for whom it is exactly that.</p>`},

{h:'IUL and VUL: read the fine print', body:`
<p><strong>Indexed universal life (IUL)</strong> credits interest based on an index like the S&amp;P 500, with a floor (usually 0%, so you cannot lose to market drops) and a cap or participation rate limiting the upside. It gets sold as "market upside with no downside."</p>
<p>The constraints that get less airtime:</p>
<ul>
<li><strong>Index credits typically exclude dividends</strong> — historically around 2% a year of total return, gone.</li>
<li><strong>Caps are not guaranteed.</strong> The insurer can lower the cap after you buy. An illustration run at a 10% cap can become reality at 6%.</li>
<li><strong>The cost of insurance rises with age</strong> and is deducted from cash value. In flat or low-return years, that drag can shrink the cash value even with a 0% floor — the floor applies to the index credit, not to your account balance after charges.</li>
<li><strong>Underfunding risk.</strong> Flexible premium sounds like a feature; it means an underfunded policy can consume its own cash value and lapse decades in, at the exact age when replacing it is unaffordable.</li>
</ul>
<p><strong>Variable universal life (VUL)</strong> invests cash value in market subaccounts. Real market exposure, real market losses, plus insurance charges and subaccount fees layered on top. It requires a securities license to sell, which tells you something about the complexity.</p>
<div class="box warn"><b>The honest use cases for permanent insurance</b><p>They exist, and they are narrower than the sales pitch: <strong>estate liquidity</strong> when an estate is large enough to face estate tax and is illiquid (a family business, farm, or real estate portfolio that heirs would otherwise have to sell); <strong>a lifelong dependent</strong>, such as a child with special needs, funded through a special needs trust; <strong>business continuity</strong> — key person coverage and buy-sell agreement funding; <strong>a high earner who has already maxed 401(k), IRA, and HSA</strong> and wants additional tax-deferred space; and <strong>charitable or legacy goals</strong> where a guaranteed payout is the point. If none of those describe you, term is very likely the answer.</p></div>`},

{h:'Riders worth paying for', body:`
<table>
<tr><th>Rider</th><th>What it does</th><th>Verdict</th></tr>
<tr><td>Convertibility</td><td>Convert term to permanent with no new medical exam, until a stated age</td><td>Often free or near-free. Take it — it is real optionality if your health changes</td></tr>
<tr><td>Waiver of premium</td><td>Insurer pays your premiums if you become disabled</td><td>Usually worth it, especially if you lack strong disability coverage</td></tr>
<tr><td>Accelerated death benefit</td><td>Access part of the benefit early on terminal or chronic illness diagnosis</td><td>Frequently included at no cost. Confirm you have it</td></tr>
<tr><td>Guaranteed insurability</td><td>Buy additional coverage later without underwriting</td><td>Useful if you expect income or family size to grow</td></tr>
<tr><td>Return of premium</td><td>Refunds premiums if you outlive the term</td><td>Usually a poor deal — the extra cost invested elsewhere typically beats it</td></tr>
<tr><td>Child rider</td><td>Small coverage on children</td><td>Cheap, mostly emotional value. Low stakes either way</td></tr>
</table>
<div class="box"><b>The coverage people skip and shouldn't</b><p><strong>Long-term disability insurance.</strong> During your working years you are far more likely to be disabled than to die. Employer group LTD typically replaces only 60% of base salary, is taxable if the employer paid the premium, and ends with the job. An individual own-occupation policy costs real money and is, for many working people, more urgently needed than the life policy they already bought.</p></div>`},

{h:'Underwriting, pricing, and taxes', body:`
<p><strong>Health classes</strong> — Preferred Plus, Preferred, Standard Plus, Standard, and then rated or table-rated — can swing your premium by 2–3x for the same coverage. Build, blood pressure, cholesterol ratio, A1c, nicotine use (including cigars and vaping, and generally marijuana), family history of early cardiac events or cancer, driving record, and risky hobbies all feed in.</p>
<ul>
<li>Carriers weight these differently. One insurer may rate a controlled condition Standard while another issues Preferred. This is precisely why an independent broker who shops many carriers matters more than the brand name.</li>
<li><strong>Accelerated / no-exam underwriting</strong> uses data instead of a paramedical exam. Faster, sometimes competitive if you are young and healthy; usually more expensive if you would have earned a top health class on a full exam.</li>
<li>If you are borderline on a metric, it is legitimate to postpone the exam a few months and address it. Fasting, hydration, and not working out the morning of the exam are standard advice for a reason.</li>
</ul>
<p><strong>Tax treatment.</strong> The death benefit is generally income-tax-free to beneficiaries — but it <em>is</em> included in your taxable estate if you own the policy. For estates near the federal exemption, an <strong>irrevocable life insurance trust (ILIT)</strong> owns the policy so the proceeds sit outside the estate (see the Trusts topic). Cash value grows tax-deferred. And if you overfund a policy past the <strong>7-pay test</strong>, it becomes a <em>modified endowment contract</em> — loans and withdrawals then get taxed on a last-in-first-out basis with a 10% penalty before 59½, which quietly destroys the main reason someone overfunds in the first place.</p>`}
]

basics:[
{h:'The four ways real estate makes money', body:`
<p>Stocks pay you one or two ways. Real estate has four running at once, which is why it builds wealth quietly even when the headline price is flat.</p>
<ol>
<li><strong>Cash flow.</strong> Rent minus mortgage, taxes, insurance, maintenance, vacancy, and management. What is left is monthly income.</li>
<li><strong>Appreciation.</strong> The property gains value over time. Historically U.S. home prices have tracked a bit above inflation over long periods — less than stocks, but that ignores the next item.</li>
<li><strong>Loan paydown.</strong> Your tenant's rent pays down your mortgage. Every month a slice of someone else's money converts into your equity. This is the most underrated of the four.</li>
<li><strong>Tax benefits.</strong> Depreciation deductions can shelter rental income on paper while you collect real cash; mortgage interest and operating expenses are deductible; and 1031 exchanges let you defer capital gains indefinitely when you trade up.</li>
</ol>
<div class="box"><b>And then there is leverage</b><p>Put 20% down on a $300,000 property — $60,000 of your money. If it appreciates 5% to $315,000, you made $15,000 on $60,000 invested. That is a <strong>25% return</strong> on your cash, from a 5% move. No other retail asset class offers 5:1 leverage at fixed 30-year rates.</p></div>
<p>The same lever runs backward. A 5% drop wipes out 25% of your equity, and the mortgage payment does not care. Leverage magnifies whatever is already happening.</p>`},

{h:'Your home is not the same thing as an investment', body:`
<p>Homeownership is worth doing for good reasons — a fixed housing payment while rents rise, forced savings through amortization, control over where you live, and a substantial capital gains exclusion when you sell (currently $250,000 single / $500,000 married on a primary residence you lived in 2 of the last 5 years).</p>
<p>But it is not a pure investment, because you cannot rent it out and you have to live somewhere regardless. The costs people underestimate:</p>
<ul>
<li><strong>Closing costs:</strong> roughly 2–5% buying, and 6–9% selling once you count agent commissions. You need meaningful appreciation just to break even on a sale.</li>
<li><strong>Maintenance:</strong> budget about 1–2% of the home's value annually. On a $350,000 house that is $3,500–$7,000 a year, averaged. Some years it is zero and then the HVAC and the roof arrive together.</li>
<li><strong>Property tax and insurance</strong> keep rising even with a fixed mortgage. Insurance in particular has moved sharply in a number of states.</li>
<li><strong>Illiquidity.</strong> Selling takes months and costs a lot. That matters if a job moves you.</li>
</ul>
<div class="box"><b>The honest rule of thumb</b><p>If you will be there fewer than about five years, renting and investing the difference frequently wins. Transaction costs need time to amortize. Run a rent-vs-buy calculator with real numbers for your market before assuming buying is automatically smarter.</p></div>`},

{h:'Rental property math — the parts people skip', body:`
<p>The mistake that ruins new landlords is treating rent minus mortgage as profit. Here is the real expense stack:</p>
<table>
<tr><th>Line item</th><th>Typical figure</th></tr>
<tr><td>Mortgage principal + interest</td><td>Fixed, known</td></tr>
<tr><td>Property tax</td><td>0.5%–2.5% of value annually, varies enormously by state</td></tr>
<tr><td>Insurance</td><td>Higher than owner-occupied; add liability or an umbrella policy</td></tr>
<tr><td>Vacancy</td><td>Budget 5%–8% of gross rent</td></tr>
<tr><td>Repairs &amp; maintenance</td><td>5%–10% of gross rent</td></tr>
<tr><td>Capital expenditures (roof, HVAC, water heater)</td><td>5%–10% of gross rent, set aside monthly</td></tr>
<tr><td>Property management</td><td>8%–12% of rent if you are not self-managing</td></tr>
<tr><td>HOA, utilities, landscaping, snow</td><td>Whatever the property actually requires</td></tr>
</table>
<div class="box warn"><b>The 50% rule</b><p>A fast screen used by experienced investors: over the long run, operating expenses excluding the mortgage tend to run about <strong>50% of gross rent</strong>. So $2,000 rent leaves roughly $1,000 to cover the mortgage payment and produce profit. If the mortgage is $1,100, the deal loses money — no matter what the listing agent's spreadsheet says.</p></div>`},

{h:'How to actually buy', body:`
<ol class="steps">
<li><b>Get pre-approved, not pre-qualified</b> Pre-approval means the lender verified income, assets, and credit. It tells you your real budget and makes your offer credible. Shop 3+ lenders — all mortgage credit pulls within a 45-day window count as one inquiry.</li>
<li><b>Understand your loan options</b> Conventional (3–20% down, PMI below 20%), FHA (3.5% down, easier credit, but mortgage insurance that often cannot be removed), VA (0% down if you qualify — the best loan in America), USDA (rural, 0% down). Investment properties generally require 20–25% down and carry a higher rate.</li>
<li><b>Make an offer with real contingencies</b> Inspection, financing, and appraisal contingencies are your exits. Waiving them to win a bidding war is a genuine risk, not a formality.</li>
<li><b>Inspect properly</b> A general inspection, plus specialists for roof, sewer scope, foundation, or pests where warranted. This is where you renegotiate or walk. It is the cheapest few hundred dollars you will spend.</li>
<li><b>Appraisal and underwriting</b> The lender confirms the value supports the loan. A low appraisal means renegotiating, bringing cash, or walking.</li>
<li><b>Close</b> Review the Closing Disclosure against your Loan Estimate line by line — you receive it 3 days before closing for exactly this reason. Question anything new.</li>
</ol>`},

{h:'Real estate without becoming a landlord', body:`
<p>Not everyone wants tenant calls at 11pm. There are legitimate ways in.</p>
<ul>
<li><strong>REITs.</strong> Companies that own income-producing property, traded like stocks. They are legally required to distribute at least 90% of taxable income, so yields are high. Fully liquid, no toilets. Downside: no leverage benefit of your own, prices are correlated with the stock market, and distributions are mostly ordinary income — which is why REITs belong in an IRA.</li>
<li><strong>REIT index funds.</strong> Broad exposure to the whole sector for a few basis points.</li>
<li><strong>House hacking.</strong> Buy a duplex or fourplex, live in one unit, rent the others. You get owner-occupied financing — as little as 3.5% down on a property that generates income — which is arguably the single best entry point into rental real estate for someone starting out.</li>
<li><strong>Crowdfunding platforms.</strong> Fractional stakes in specific deals. Higher stated returns, but often illiquid for years, with fee layers and sponsor risk that are hard to evaluate from outside. Treat with real skepticism.</li>
</ul>`}
],

{t:'Down payment', d:'Cash you put in up front. 20% avoids PMI on a conventional loan.'},
{t:'PMI', d:'Private mortgage insurance. Protects the lender, not you. Removable on conventional loans once you reach ~20% equity.'},
{t:'Escrow', d:'An account the lender uses to collect and pay your property tax and insurance with your monthly payment.'},
{t:'Amortization', d:'The schedule splitting each payment between interest and principal. Early payments are almost all interest.'},
{t:'Equity', d:'Property value minus what you owe.'},
{t:'Cap rate', d:'Net operating income divided by purchase price. A quick comparison of unleveraged yield across properties.'},
{t:'Cash-on-cash return', d:'Annual pre-tax cash flow divided by cash actually invested. The number that reflects your leveraged reality.'},
{t:'NOI', d:'Net operating income — all income minus all operating expenses, before the mortgage payment.'},
{t:'Gross rent multiplier', d:'Price divided by annual gross rent. A crude first screen.'},

{t:'HELOC', d:'Home equity line of credit. A revolving loan against your equity, usually at a variable rate.'},
{t:'DSCR', d:'Debt service coverage ratio — NOI divided by debt payments. Investor loans often require 1.2 or better.'},

deep:[
{h:'Underwriting a deal: the actual numbers', body:`
<p>Work top down. Every experienced investor runs this same stack.</p>
<table>
<tr><th>Step</th><th>Calculation</th><th>Example</th></tr>
<tr><td>Gross scheduled rent</td><td>Market rent × 12</td><td>$2,200 × 12 = $26,400</td></tr>
<tr><td>Less vacancy</td><td>× 7%</td><td>−$1,848 → $24,552</td></tr>
<tr><td>Less operating expenses</td><td>Tax, insurance, maintenance, capex reserve, management, HOA</td><td>−$10,500 → <strong>NOI $14,052</strong></td></tr>
<tr><td>Cap rate</td><td>NOI ÷ price</td><td>$14,052 ÷ $285,000 = <strong>4.9%</strong></td></tr>
<tr><td>Less debt service</td><td>P&amp;I on the loan</td><td>−$12,900 → <strong>cash flow $1,152/yr</strong></td></tr>
<tr><td>Cash-on-cash</td><td>Cash flow ÷ cash invested</td><td>$1,152 ÷ $68,000 = <strong>1.7%</strong></td></tr>
</table>
<p>That deal produces about $96 a month before anything breaks. One water heater erases the year. This is what a marginal deal looks like on paper before an agent describes it as "great cash flow."</p>
<ul>
<li><strong>Cap rate</strong> ignores financing, which makes it the right tool for comparing properties to each other and to the market. Lower cap rate generally means a more desirable, lower-risk market — you are paying up for quality and appreciation potential.</li>
<li><strong>Cash-on-cash</strong> includes financing, so it tells you what your actual dollars earn.</li>
<li><strong>Total return</strong> adds loan paydown, appreciation, and tax benefits on top — which is how a 1.7% cash-on-cash deal can still be a 12% total return. Just be honest about which components are guaranteed and which are hoped for.</li>
</ul>
<div class="box"><b>Screening rules of thumb</b><p><strong>The 1% rule:</strong> monthly rent should be at least 1% of purchase price ($2,000 rent on a $200,000 property). Nearly impossible in expensive coastal markets, still achievable in parts of the Midwest and South. <strong>The 50% rule</strong> for operating expenses. <strong>DSCR above 1.25</strong> for a real margin of safety. These are filters for deciding what to analyze — not substitutes for the analysis.</p></div>`},

{h:'Financing: the piece that determines your returns', body:`
<table>
<tr><th>Loan type</th><th>Down</th><th>Notes</th></tr>
<tr><td>Conventional owner-occupied</td><td>3–20%</td><td>Best rates. PMI below 20% down, removable later</td></tr>
<tr><td>FHA</td><td>3.5%</td><td>Lenient credit. MIP usually lasts the life of the loan unless you refinance out</td></tr>
<tr><td>VA</td><td>0%</td><td>No PMI, excellent rates. Reusable. The strongest loan available if you qualify</td></tr>
<tr><td>Conventional investment</td><td>20–25%</td><td>Rate typically 0.5–0.875% above owner-occupied</td></tr>
<tr><td>DSCR / investor loan</td><td>20–25%</td><td>Qualifies on the property's income, not your W-2. Higher rate, no income docs</td></tr>
<tr><td>Portfolio / local bank</td><td>15–25%</td><td>Held on the bank's books, flexible terms, often shorter amortization</td></tr>
<tr><td>Hard money</td><td>10–30%</td><td>Fast, expensive (10–15% plus points), short term. For flips and BRRRR, not holds</td></tr>
</table>
<p><strong>Rate vs. points.</strong> Paying discount points buys a lower rate. Divide the point cost by the monthly savings to get the break-even in months; if you will hold longer than that, points win. If there is any chance you refinance or sell sooner, they do not.</p>
<p><strong>House hacking is the cheat code.</strong> Owner-occupied financing on a 2–4 unit property means 3.5–5% down on an income-producing asset, and lenders will often count a portion of projected rent toward qualifying. Live there the required year, then move out and repeat. Several serious portfolios started exactly this way.</p>
<p><strong>BRRRR</strong> — buy, rehab, rent, refinance, repeat. Buy a distressed property below market, renovate to raise the appraised value, place a tenant, then cash-out refinance to pull your original capital back out and roll it into the next deal. It works when you buy well and control the rehab. It fails when the after-repair value comes in low, the rehab overruns, or rates rise between purchase and refinance — and all three happen more often than the podcasts suggest.</p>`},

{h:'The tax machinery', body:`
<p>Real estate's tax treatment is genuinely favorable, and it is a big part of why wealth concentrates here.</p>
<ul>
<li><strong>Depreciation.</strong> The IRS lets you deduct the building's value (not the land) over 27.5 years for residential. On a $275,000 building that is $10,000 a year of deduction against rental income — while the property may actually be appreciating. This is how a cash-flow-positive rental can show a paper loss.</li>
<li><strong>Cost segregation.</strong> An engineering study reclassifies components — appliances, flooring, landscaping, certain fixtures — into 5, 7, and 15-year schedules, front-loading deductions dramatically. Worth the study cost on larger properties.</li>
<li><strong>Depreciation recapture.</strong> The catch. When you sell, depreciation you claimed is recaptured at up to 25%. It is a deferral, not a gift — unless you never sell.</li>
<li><strong>1031 exchange.</strong> Roll proceeds into another investment property and defer the gain entirely. Strict timing: identify replacement property within 45 days, close within 180, and use a qualified intermediary — you cannot touch the money. Chain these indefinitely, and under current law the basis steps up at death, so heirs can inherit without the deferred gain. "Swap till you drop" is a real strategy.</li>
<li><strong>Passive activity loss rules.</strong> Rental losses are generally passive and can only offset passive income. There is a $25,000 special allowance for active participants that phases out between $100k and $150k of income. <strong>Real estate professional status</strong> — 750+ hours and more than half your working time in real property trades — unlocks unlimited offset against ordinary income. It is heavily audited and requires contemporaneous time logs.</li>
<li><strong>QBI deduction.</strong> Rental income may qualify for the 20% qualified business income deduction if the activity rises to a trade or business under the safe harbor.</li>
</ul>
<div class="box warn"><b>Get a CPA who does real estate</b><p>This is the one area where a generalist tax preparer routinely costs people more than the CPA fee. Cost segregation, REP status, 1031 timing, and entity structure are all easy to get wrong in expensive ways.</p></div>`},

{h:'Operations: where returns are actually won or lost', body:`
<p>The spreadsheet assumes competent operation. Most underperformance traces to operations, not to the purchase price.</p>
<ul>
<li><strong>Tenant screening is the highest-leverage thing you do.</strong> Income at 3x rent, credit check, criminal and eviction history, and — the step people skip — call the <em>previous</em> landlord, not the current one. The current landlord may want them gone. Apply written criteria identically to every applicant; Fair Housing violations are expensive and easy to trip into.</li>
<li><strong>Know your state's landlord-tenant law before you have a tenant.</strong> Security deposit limits and return deadlines, notice requirements, and eviction timelines vary enormously. Some jurisdictions take many months to evict. That timeline is a real risk input.</li>
<li><strong>Reserves.</strong> Six months of full expenses per property, liquid. This is what converts a bad year into an inconvenience.</li>
<li><strong>Property management</strong> costs 8–12% plus a leasing fee, and often pays for itself through better screening, faster turns, and vendor pricing — plus it makes the asset genuinely passive and lets you own outside your own market. Self-managing is a job; price your own time honestly.</li>
<li><strong>Liability structure.</strong> An LLC per property or per small group, plus an umbrella policy. Note that transferring a mortgaged property into an LLC can technically trigger a due-on-sale clause; lenders rarely enforce it, but talk to an attorney rather than assuming.</li>
<li><strong>Insurance.</strong> Landlord policy (DP-3), loss of rents coverage, and a hard look at flood — a large share of flood damage occurs outside designated high-risk zones, where standard policies exclude it.</li>
</ul>`},

{h:'Cycles, and what breaks', body:`
<p>Real estate is local, cyclical, and slow-moving, which makes it feel safer than it is.</p>
<ul>
<li><strong>Interest rates drive affordability, which drives prices.</strong> A move from 4% to 7% on a 30-year mortgage cuts the price a given monthly payment can support by roughly 25%. That is the mechanism behind most large price adjustments.</li>
<li><strong>Supply is slow.</strong> Construction takes years, so the market chronically over- and under-shoots demand. Watch permits, months of inventory, and days on market for your specific submarket — national numbers tell you almost nothing about your street.</li>
<li><strong>Employment concentration is the risk that hurts.</strong> A market dependent on one employer or one industry can lose rent demand and property value simultaneously.</li>
<li><strong>Insurance and tax escalation</strong> have become a primary margin killer in several states — an existential change for thin-margin deals bought years earlier.</li>
<li><strong>Regulatory shifts:</strong> rent control, short-term rental bans, and eviction moratoria have each rewritten deal economics overnight in specific cities.</li>
</ul>
<div class="box"><b>What actually protects you</b><p>Fixed-rate long-term debt (so a rate spike cannot reprice your payment), positive cash flow at purchase (so you are never a forced seller), real reserves, and a property that pencils in a market with diversified employment. Investors who lost properties in 2008 mostly did not lose them because prices fell — they lost them because they had adjustable debt, no cash flow, and no reserves when prices fell.</p></div>`}
]
});

id:'trusts', icon:'📜', c:'#c77dff', lvl:'Advanced', name:'Trusts',
tag:'A legal container that owns your assets and hands them out on your terms — including after you are gone.',
blurb:'What a trust is, revocable vs. irrevocable, what it does that a will cannot, and whether you actually need one.',
deepTeaser:'Trust taxation, ILITs, SLATs, dynasty and asset-protection trusts, special needs planning, step-up basis, and the funding mistake that makes most trusts fail.',
basics:[
{h:'What a trust actually is', body:`
<p>A trust is a legal arrangement with three roles:</p>
<ul>
<li><strong>Grantor</strong> (also settlor or trustor) — you. The person who creates it and puts assets in.</li>
<li><strong>Trustee</strong> — whoever manages the assets according to the rules you wrote. Often you, while you are alive and well.</li>
<li><strong>Beneficiary</strong> — whoever benefits. Often you during life, then your family after.</li>
</ul>
<p>You transfer legal ownership of assets to the trust. The trust holds them and the trustee administers them under the document you wrote. Since the trust does not die, assets inside it do not need to pass through the court process that governs a dead person's property.</p>
<div class="box"><b>Simplest analogy</b><p>A will is a set of instructions read out after you die, supervised by a judge. A trust is a container that already holds your things, with instructions attached, that keeps working without a judge — before, during, and after your death.</p></div>`},

{h:'Will vs. trust', body:`
<table>
<tr><th></th><th>Will</th><th>Revocable living trust</th></tr>
<tr><td>Takes effect</td><td>Only at death</td><td>Immediately, and continues after death</td></tr>
<tr><td>Probate</td><td>Yes — public court process</td><td>No, for assets titled in the trust</td></tr>
<tr><td>Privacy</td><td>Public record; anyone can read it</td><td>Private</td></tr>
<tr><td>If you become incapacitated</td><td>Does nothing — you need a separate power of attorney</td><td>Successor trustee steps in seamlessly</td></tr>
<tr><td>Names guardians for minor kids</td><td>Yes — only a will can do this</td><td>No</td></tr>
<tr><td>Cost to set up</td><td>Low</td><td>Higher — typically $1,500–$4,000 with an attorney</td></tr>
<tr><td>Ongoing work</td><td>None</td><td>You must retitle assets into it, and keep doing so</td></tr>
</table>
<p><strong>Probate</strong> is the court process that validates a will, pays creditors, and distributes property. It can take months to years, costs a percentage of the estate in some states, and is entirely public — anyone can look up what you owned and who got it. Avoiding it is the most common reason people set up a trust.</p>
<p>Note the last row of the table. A trust that exists on paper but never had assets retitled into it does <strong>nothing</strong>. This is the single most common failure in estate planning.</p>`},

{h:'The two main flavors', body:`
<p><strong>Revocable living trust.</strong> You can change or cancel it anytime. You typically serve as your own trustee, and for tax purposes it is invisible — the assets are still yours, reported on your own return.</p>
<ul>
<li><strong>Does:</strong> avoid probate, keep things private, provide a clean handoff if you become incapacitated, and let you control timing ("distribute at 25, 30, and 35" rather than a lump sum at 18).</li>
<li><strong>Does not:</strong> protect from creditors or lawsuits, reduce income tax, or reduce estate tax. You still control the assets, so the law still treats them as yours.</li>
</ul>
<p><strong>Irrevocable trust.</strong> Once created and funded, you generally cannot take it back. You give up control — and that is exactly what buys the benefits.</p>
<ul>
<li><strong>Does:</strong> remove assets from your taxable estate, provide real creditor and lawsuit protection, enable Medicaid planning (subject to a 5-year lookback), and hold life insurance outside your estate.</li>
<li><strong>Does not:</strong> let you change your mind casually. Modification requires beneficiary consent, court approval, or specific provisions written in up front.</li>
</ul>
<div class="box warn"><b>The cheap version that covers most people</b><p>Most households do not need a trust at all. Retirement accounts, life insurance, and payable-on-death bank accounts pass by <strong>beneficiary designation</strong> and skip probate automatically. Many states allow transfer-on-death deeds for real estate and TOD registration for vehicles and brokerage accounts. Getting every beneficiary designation correct is free, takes an afternoon, and handles the majority of what most people want a trust for.</p></div>`},

{h:'When a trust is genuinely worth it', body:`
<ul>
<li><strong>You own real estate in more than one state.</strong> Otherwise your heirs face a separate probate in each state. This alone often justifies the cost.</li>
<li><strong>You have minor children.</strong> Without a trust, an inheritance goes into court-supervised guardianship and is handed over as a lump sum at 18. A trust lets you stage it and name who manages it.</li>
<li><strong>A beneficiary has special needs.</strong> A direct inheritance can disqualify someone from Medicaid and SSI. A properly drafted special needs trust preserves benefits while supplementing quality of life. This is not optional — it is the standard of care.</li>
<li><strong>Blended family.</strong> You want to provide for a current spouse while guaranteeing that children from a prior marriage ultimately inherit. A will alone cannot reliably do this.</li>
<li><strong>Privacy matters to you.</strong> Business ownership, a public profile, or family circumstances you would rather not have in a public court file.</li>
<li><strong>You have a beneficiary who is not good with money</strong>, or is in a shaky marriage, or has creditor exposure. A trust with a spendthrift provision protects the inheritance from their creditors and from a divorce.</li>
<li><strong>Estate tax exposure.</strong> The federal exemption is high, but roughly a dozen states impose their own estate or inheritance tax at far lower thresholds. Check your state.</li>
<li><strong>You own a business or rental portfolio</strong> and want continuity rather than a fire sale.</li>
</ul>`},

{h:'How to set one up', body:`
<ol class="steps">
<li><b>Inventory everything</b> Accounts, real estate, business interests, vehicles, insurance policies, retirement accounts, and digital assets. You cannot plan around what you have not listed.</li>
<li><b>Decide what you actually want</b> Who gets what, when, and under what conditions. Who raises your children. Who makes medical and financial decisions if you cannot. This is the hard part, and it is the part only you can do.</li>
<li><b>Hire an estate attorney licensed in your state</b> Typical cost for a full package — trust, pour-over will, financial power of attorney, healthcare directive — runs $1,500–$4,000. Estate law is highly state-specific; online templates routinely miss state requirements and are a poor value on something this consequential.</li>
<li><b>FUND THE TRUST</b> Retitle the deed on your house. Change the ownership on your brokerage account. Reassign LLC membership interests. An unfunded trust is an expensive stack of paper — and this is where most people stop.</li>
<li><b>Coordinate beneficiary designations</b> Retirement accounts and life insurance pass by designation, not by the trust. Make sure they point where you intend. Naming a trust as an IRA beneficiary has real tax consequences under the SECURE Act — do it only with advice.</li>
<li><b>Review every few years</b> And immediately after any marriage, divorce, birth, death, move to another state, or major change in assets.</li>
</ol>`}
],

deep:[
{h:'Funding: why most trusts fail', body:`
<p>Worth its own section because it is where the money actually gets lost. A trust only controls what it owns.</p>
<table>
<tr><th>Asset</th><th>How to fund it</th></tr>
<tr><td>Real estate</td><td>New deed transferring title to the trust, recorded with the county. Notify your insurer and check the mortgage</td></tr>
<tr><td>Bank accounts</td><td>Retitle in the trust name, or use payable-on-death designations</td></tr>
<tr><td>Taxable brokerage</td><td>Retitle to the trust — most brokers have a standard form</td></tr>
<tr><td>Business interests</td><td>Assign LLC membership or stock; check the operating agreement for transfer restrictions</td></tr>
<tr><td>Vehicles</td><td>Often left out deliberately; many states offer TOD title or small-estate procedures</td></tr>
<tr><td>Retirement accounts</td><td><strong>Do not retitle.</strong> Transferring an IRA to a trust is a full taxable distribution. Use beneficiary designations</td></tr>
<tr><td>Life insurance</td><td>Name the trust as beneficiary, or have an ILIT own the policy outright</td></tr>
<tr><td>Personal property</td><td>A general assignment of tangible personal property, plus a memorandum for specific items</td></tr>
</table>
<div class="box warn"><b>Retirement accounts and the SECURE Act</b><p>Most non-spouse beneficiaries must now empty an inherited IRA within 10 years, which can force large distributions into their peak earning years. Naming a trust as beneficiary compounds this: a <em>conduit</em> trust passes distributions straight through to the beneficiary, while an <em>accumulation</em> trust can retain them — but trust tax brackets compress brutally, hitting the top rate at just a few thousand dollars of retained income. If you want a trust to receive retirement assets, it must be drafted for that purpose specifically.</p></div>
<p>Funding is not one-time. Every new account, property, or business interest you acquire needs to be titled correctly. Put a recurring calendar reminder on it.</p>`},

{h:'How trusts are taxed', body:`
<p>Three regimes, and confusing them is expensive.</p>
<ul>
<li><strong>Grantor trust (most revocable trusts).</strong> Tax-invisible. Income flows onto your personal return under your SSN. No separate filing. Some irrevocable trusts are deliberately drafted as grantor trusts — an "intentionally defective grantor trust" — so the grantor pays the income tax, which is itself a tax-free gift that lets the trust assets compound untouched.</li>
<li><strong>Simple trust.</strong> Required to distribute all income annually. Beneficiaries pay tax on what they receive.</li>
<li><strong>Complex trust.</strong> May accumulate income. Files its own Form 1041 and pays at trust rates on anything retained.</li>
</ul>
<div class="box warn"><b>Compressed trust brackets</b><p>An individual reaches the top federal bracket somewhere around $600k+ of income. A trust reaches it at roughly $15,000 — and the 3.8% net investment income tax kicks in at that same low threshold. Retained trust income is taxed brutally. This is why well-run complex trusts usually distribute income to beneficiaries in lower brackets, using the distribution deduction.</p></div>
<p><strong>Step-up in basis</strong> is the other lever, and it is often worth more than estate tax savings. Assets included in your estate at death get their cost basis reset to date-of-death value, erasing all built-in capital gain. Stock bought at $20, worth $200 at death, passes to heirs with a $200 basis. Assets given away during life or moved into a completed-gift irrevocable trust generally carry your original basis instead.</p>
<p>That trade-off is the central question in modern estate planning for most families: with a high federal exemption, <strong>keeping appreciated assets in your estate for the step-up frequently beats removing them to avoid an estate tax you would never have owed.</strong> Run the numbers before removing anything.</p>`},

{h:'The specialized trusts, and what each solves', body:`
<table>
<tr><th>Trust</th><th>Problem it solves</th></tr>
<tr><td><strong>ILIT</strong></td><td>Life insurance death benefit is income-tax-free but counts in your taxable estate if you own the policy. An ILIT owns it instead, keeping proceeds out of the estate and providing liquidity to pay estate taxes without forcing a sale of the business or farm</td></tr>
<tr><td><strong>QTIP</strong></td><td>Blended families. Income to your surviving spouse for life, principal to your chosen remainder beneficiaries — typically children from a prior marriage. Qualifies for the marital deduction while you keep control of ultimate disposition</td></tr>
<tr><td><strong>Special needs trust</strong></td><td>Supplements a disabled beneficiary's life without counting as their resource for SSI and Medicaid. Third-party SNTs (funded by parents) have no Medicaid payback; first-party SNTs (funded with the beneficiary's own money) do</td></tr>
<tr><td><strong>Charitable remainder trust (CRT)</strong></td><td>Donate an appreciated asset, avoid immediate capital gains, take a partial deduction, receive an income stream for life, remainder to charity. Powerful for concentrated low-basis stock</td></tr>
<tr><td><strong>Charitable lead trust (CLT)</strong></td><td>The inverse — charity receives income for a term, then the remainder passes to heirs at a discounted transfer-tax value</td></tr>
<tr><td><strong>GRAT</strong></td><td>Grantor retained annuity trust. Transfers future appreciation above an IRS-assumed rate to heirs at little or no gift tax cost. Highly effective with volatile, fast-appreciating assets</td></tr>
<tr><td><strong>SLAT</strong></td><td>Spousal lifetime access trust. Use your gift exemption now while your spouse retains indirect access. Common when people expect the exemption to fall. Dangerous on divorce or the death of the beneficiary spouse</td></tr>
<tr><td><strong>Dynasty trust</strong></td><td>Holds wealth across generations while minimizing the generation-skipping transfer tax. Some states allow perpetual duration</td></tr>
<tr><td><strong>Asset protection trust (DAPT)</strong></td><td>Self-settled irrevocable trust in states like Nevada, South Dakota, Delaware, or Alaska, offering creditor protection while retaining some benefit. Cross-state enforceability is genuinely unsettled</td></tr>
<tr><td><strong>Medicaid asset protection trust</strong></td><td>Shelters assets from long-term-care spend-down, subject to a 5-year lookback. Must be done well before you need care</td></tr>
</table>`},

{h:'Choosing a trustee', body:`
<p>The document is only as good as the person administering it, and this decision gets made emotionally far too often.</p>
<p>A trustee has a legal fiduciary duty: loyalty to beneficiaries, prudent investment management, impartiality between income and remainder beneficiaries, detailed record-keeping, tax filings, and distribution decisions that may require saying no to a family member. It is a real job with real liability.</p>
<table>
<tr><th>Option</th><th>Upside</th><th>Downside</th></tr>
<tr><td>Family member</td><td>Free, knows the family, personally invested</td><td>Conflicts of interest, no expertise, and it can destroy relationships</td></tr>
<tr><td>Professional (attorney, CPA)</td><td>Competent, neutral</td><td>Fees, may lack investment infrastructure, and is mortal</td></tr>
<tr><td>Corporate trustee (bank or trust company)</td><td>Perpetual, regulated, experienced, fully impartial</td><td>Typically 0.5–1.5% of assets annually, often with minimums; can be impersonal and rigid</td></tr>
<tr><td>Co-trustees</td><td>Balances family knowledge with professional competence</td><td>Deadlock risk; define tie-breaking in the document</td></tr>
<tr><td>Directed trust</td><td>Splits roles — investment advisor, distribution committee, administrative trustee</td><td>More complex, but increasingly the standard for larger trusts</td></tr>
</table>
<div class="box"><b>Name a trust protector</b><p>A <strong>trust protector</strong> is a third party with limited powers to remove and replace trustees, amend administrative provisions, or change trust situs. It builds flexibility into an irrevocable document — which matters, because tax law and family circumstances will both change over the decades a trust may run.</p></div>`},

{h:'The full package, and what it costs', body:`
<p>A trust is one document in a set. The others do work the trust cannot.</p>
<ul>
<li><strong>Revocable living trust</strong> — probate avoidance, privacy, incapacity management.</li>
<li><strong>Pour-over will</strong> — catches unfunded assets and, critically, <strong>names guardians for minor children</strong>. Only a will can do that.</li>
<li><strong>Durable financial power of attorney</strong> — lets someone handle assets outside the trust if you are incapacitated. Without it, your family may need a court conservatorship.</li>
<li><strong>Healthcare power of attorney and advance directive</strong> — medical decision-maker and your stated wishes.</li>
<li><strong>HIPAA authorization</strong> — lets named people access your medical information at all. Frequently forgotten, and blocks families at the worst moment.</li>
<li><strong>Beneficiary designation review</strong> — the free step that controls the largest share of most people's assets.</li>
<li><strong>A letter of instruction</strong> — not legally binding, but it tells your family where accounts are, who the advisors are, how to reach the digital accounts, and what you want. Do this even if you do nothing else.</li>
</ul>
<p>Typical attorney cost for the full package runs roughly $1,500–$4,000 for a straightforward estate, more for business interests, multi-state property, or specialized trusts. Compare that to probate, which in some states consumes 3–7% of the gross estate and takes a year or more.</p>
<div class="box"><b>Review triggers</b><p>Marriage, divorce, birth or adoption, a death among your named parties, moving to another state (estate law is state law — a move is a real trigger, not a formality), a significant change in assets, starting or selling a business, and any major change in federal or state estate tax law. Absent any of those, a review every 3–5 years is reasonable.</p></div>`}
]
});

TOPICS_ES.push({"id":"stocks","icon":"📈","c":"#4c8dff","lvl":"Empieza aquí","name":"Acciones","tag":"Cuando compras una acción, estás comprando un pedazo de un negocio real. Todo lo demás es detalle.","blurb":"Ser dueño de una rebanada de una empresa. Cómo funcionan las acciones, por qué se mueven los precios y exactamente cómo hacer tu primera compra y tu primera venta.","deepTeaser":"Tipos de orden, cómo se ejecuta de verdad una operación, cómo leer una valoración, el tamaño de las posiciones y las reglas fiscales que se comen tus rendimientos en silencio.","basics":[{"h":"Qué es realmente una acción","body":"\n<p>Una empresa que quiere dinero — para construir una fábrica, contratar gente, pagarles a los fundadores — puede cortar su propiedad en millones de rebanadas iguales y venderlas. Cada rebanada es una <strong>acción</strong>. Compra una y legalmente eres dueño de esa fracción del negocio: sus edificios, su marca, sus ganancias, sus deudas.</p>\n<p>Si una empresa está cortada en 1,000,000 de acciones y tú tienes 1,000, eres dueño de una décima parte del uno por ciento de todo lo que tiene y de todo lo que gana. Esa es toda la idea. El símbolo bursátil, el verde y el rojo parpadeando, el tipo que grita en la tele — todo eso es decoración encima de ese único hecho.</p>\n<div class=\"box\"><b>El modelo mental</b><p>Piensa en una empresa como una propiedad en renta que copropietan miles de personas. Parte de la renta se les reparte a los dueños, parte se reinvierte en el edificio, y las participaciones mismas cambian de manos a precios que se mueven según qué tan bien se vea el edificio ese año.</p></div>\n<p>Vas a ver dos sabores: <em>acciones comunes</em> (lo que compra casi todo el mundo — te dan derecho a voto y potencial de subida ilimitado) y <em>acciones preferentes</em> (dividendo fijo, primeras en la fila si las cosas salen mal, pero potencial de subida limitado — se comportan más como un bono).</p>"},{"h":"Cómo ganas dinero de verdad","body":"\n<p>Hay exactamente dos formas. Todo lo demás es una variación.</p>\n<ol>\n<li><strong>El precio sube.</strong> Compras a 50, se cotiza a 80, vendes. Esos 30 son una <em>ganancia de capital</em> (capital gain). Hasta que vendes, es una ganancia \"no realizada\" — real en papel, no en tu bolsillo, y todavía sin impuestos.</li>\n<li><strong>La empresa te paga.</strong> Muchas empresas maduras les mandan a sus dueños una rebanada de las ganancias cada trimestre — un <em>dividendo</em>. Ten 200 acciones de una empresa que paga $0.75 por acción cada trimestre y $150 caen en tu cuenta cuatro veces al año, haya subido o bajado la acción.</li>\n</ol>\n<p>Las empresas de crecimiento normalmente no pagan dividendo — meten cada dólar de vuelta en crecer. Las empresas más viejas y estables (servicios públicos, bancos grandes, marcas de consumo) suelen pagar. Ninguna es mejor; hacen trabajos distintos.</p>\n<p>Y sí, también funciona al revés. El precio puede llegar a cero. Una acción de una empresa en quiebra vale exactamente nada, y los accionistas son los últimos de la fila, detrás de los prestamistas, los tenedores de bonos y el IRS. Ese es el trato: subida ilimitada, caída total.</p>"},{"h":"Por qué se mueven los precios","body":"\n<p>El precio de una acción no es una medición de la empresa. Es el precio en el que se pusieron de acuerdo el último comprador y el último vendedor. Se mueve porque ese punto de acuerdo se mueve.</p>\n<ul>\n<li><strong>Ganancias vs. expectativas.</strong> Esta es la grande. Una empresa puede reportar ganancias récord y caer 12% porque los analistas esperaban más. El mercado ya trae el futuro puesto en el precio; las noticias solo mueven el precio en la medida en que fueron una <em>sorpresa</em>.</li>\n<li><strong>Las tasas de interés.</strong> Cuando los bonos seguros del gobierno pagan 5%, una acción riesgosa tiene que prometer mucho más para que valga la pena tenerla — así que los precios de las acciones caen. Cuando las tasas bajan, pasa lo contrario. Las tasas son la gravedad de todos los activos sobre los que vas a leer en este sitio.</li>\n<li><strong>La historia.</strong> Las proyecciones de la empresa (guidance), un producto nuevo, un CEO que se va, una demanda, un sector que cae en desgracia. El miedo y la codicia son insumos reales, y en el corto plazo son los dominantes.</li>\n</ul>\n<div class=\"box\"><b>La frase que vale la pena recordar</b><p>En el corto plazo el mercado es una máquina de votar; en el largo plazo es una máquina de pesar. Del día a día, el precio refleja el ánimo. A lo largo de una década, refleja si el negocio de verdad ganó dinero.</p></div>"},{"h":"Cómo comprar y vender — paso a paso","body":"\n<ol class=\"steps\">\n<li><b>Abre una cuenta de corretaje</b> Fidelity, Schwab, Vanguard, E*TRADE, Robinhood — todas sirven, todas con $0 de comisión en acciones de EE. UU. Vas a necesitar tu SSN, tu dirección y los datos de tu empleador. Toma unos 10 minutos. Elige una <em>cuenta de corretaje gravable</em> (taxable brokerage account) para dinero flexible, o una IRA si esto es dinero de jubilación (mira el tema de Cuentas de Jubilación — la diferencia fiscal es enorme).</li>\n<li><b>Métele dinero</b> Conecta tu banco y transfiere. Las transferencias ACH normalmente se liquidan en 1–3 días hábiles. Algunos brókers te dan poder de compra instantáneo hasta cierto límite.</li>\n<li><b>Encuentra el ticker</b> Cada acción tiene un símbolo corto — AAPL para Apple, NSC para Norfolk Southern, VTI para el ETF de mercado total de Vanguard. Escríbelo en la caja de búsqueda.</li>\n<li><b>Elige tu tipo de orden</b> Una <em>orden de mercado</em> (market order) dice \"compra ya, al precio que sea\" — siempre se ejecuta, pero no controlas el precio. Una <em>orden límite</em> (limit order) dice \"compra solo a $47.50 o mejor\" — controlas el precio, pero puede que nunca se ejecute. Para cualquier cosa líquida, una orden de mercado en horario regular está bien. Para nombres poco negociados o volátiles, usa una límite.</li>\n<li><b>Ingresa el número de acciones o el monto en dólares</b> La mayoría de los brókers ya permiten <em>acciones fraccionarias</em>, así que puedes meter $100 en una acción de $600. Revisa el total estimado y envía la orden.</li>\n<li><b>Vender es la misma pantalla al revés</b> Ingresa una orden de venta, de mercado o límite. El efectivo de la venta se liquida en un día hábil (T+1) y después puedes retirarlo.</li>\n</ol>\n<div class=\"box warn\"><b>Antes de darle a comprar</b><p>Ten claro por qué eres dueño de eso y qué te haría vender. \"Bajó\" no es razón para vender y \"subió\" no es razón para comprar. Escribe tu razón en algún lado — es el control de riesgo más barato que existe.</p></div>"},{"h":"Qué debería comprar en realidad la mayoría de la gente","body":"\n<p>Escoger ganadores individuales es difícil. No imposible — difícil. La mayoría de los gestores de fondos profesionales, con equipos y presupuestos de datos, no logra superar el simple promedio del mercado a diez años.</p>\n<p>Por eso la respuesta aburrida es la respuesta correcta para empezar: un <strong>fondo indexado</strong> (index fund) o un <strong>ETF</strong> que sea dueño de todo el mercado de una sola vez. Una sola compra de algo como un fondo de mercado total o de S&amp;P 500 te vuelve copropietario de cientos o miles de empresas. Si una explota, apenas te raspa. La comisión suele ser de 0.03%–0.10% al año — de tres a diez dólares por cada diez mil.</p>\n<div class=\"box\"><b>Una estructura razonable</b><p>El núcleo de la cartera en fondos indexados amplios. Después, si disfrutas investigar, una porción más chica — digamos 5–15% — para empresas individuales que de verdad entiendes. Te llevas el rendimiento del mercado en el grueso de tu dinero y tienes una salida real para tus convicciones, sin que una mala decisión te reescriba la jubilación.</p></div>\n<p>Dos mecánicas más que conviene conocer temprano: el <strong>promedio de costo en dólares</strong> (dollar-cost averaging: comprar un monto fijo con un calendario, de modo que compras más acciones cuando los precios están bajos y menos cuando están altos, y dejas de intentar cronometrar tus entradas) y el <strong>DRIP</strong> (reinvertir automáticamente los dividendos en más acciones — interés compuesto gratis, una casilla en la configuración de tu cuenta).</p>"}],"pitfalls":["Meter en acciones dinero que vas a necesitar dentro de 5 años. El mercado puede estar 30% abajo justo cuando se te cae el techo.","Comprar porque una acción está \"barata\" a $4. El precio por acción no te dice nada — una acción de $4 puede estar salvajemente sobrevalorada y una de $900 puede ser una ganga. Lo que importa es el precio en relación con las ganancias y los activos.","Vender por pánico en un desplome. Toda caída histórica se ve obvia en retrospectiva y aterradora mientras la estás viviendo. Vender en el fondo es la forma en que las pérdidas de papel se vuelven reales.","Tener 15 acciones tecnológicas y llamarlo diversificado. Si todas caen por la misma razón, tienes una sola apuesta con quince disfraces.","Perseguir lo que más subió el año pasado. Los rendimientos de ayer son el peor predictor que existe de los rendimientos de mañana.","Ignorar las comisiones. Un fondo que cobra 1.2% en vez de 0.05% te cuesta más o menos una cuarta parte de tu saldo final a lo largo de 30 años."],"terms":[{"t":"Acción / Participación (Share / Equity)","d":"Una unidad de propiedad en una empresa. \"Equity\" es la palabra general para las participaciones de propiedad."},{"t":"Ticker (símbolo bursátil)","d":"El símbolo corto de negociación de una acción, como NSC o MSFT."},{"t":"Capitalización de mercado (market cap)","d":"El precio de la acción multiplicado por el total de acciones en circulación — lo que el mercado dice que vale la empresa completa. Large cap es más o menos $10B+, small cap por debajo de $2B."},{"t":"Dividendo","d":"Efectivo que se les paga a los accionistas, normalmente cada trimestre. El rendimiento por dividendo es el dividendo anual dividido entre el precio de la acción."},{"t":"Bid / Ask / Spread (compra / venta / diferencial)","d":"El precio más alto que un comprador está dispuesto a pagar, el más bajo que un vendedor acepta, y la brecha entre ambos. Esa brecha es un costo real de operar."},{"t":"Volumen","d":"Acciones negociadas en un periodo. Volumen alto significa que es fácil entrar y salir a un precio justo."},{"t":"Ratio P/E","d":"El precio dividido entre las ganancias por acción. A grandes rasgos, cuántos dólares pagas por un dólar de ganancia anual."},{"t":"Volatilidad","d":"Qué tan violentamente oscila un precio. Volatilidad alta no es lo mismo que riesgo alto, pero se siente igual."},{"t":"Mercado alcista / bajista (bull / bear)","d":"Una subida sostenida frente a una caída de 20% o más desde el máximo reciente."},{"t":"Índice","d":"Una canasta que sigue una rebanada del mercado — el S&P 500 son las 500 empresas más grandes de EE. UU."},{"t":"ETF","d":"Fondo cotizado en bolsa (exchange-traded fund). Una canasta de posiciones que compras y vendes como si fuera una sola acción, durante todo el día."},{"t":"Cuenta de corretaje","d":"La cuenta que guarda tus inversiones. Gravable por defecto, salvo que sea una IRA o un 401(k)."},{"t":"Ganancia de capital","d":"La utilidad de vender por más de lo que pagaste. No realizada hasta que efectivamente vendes."},{"t":"Split de acciones","d":"La empresa divide las acciones existentes en más acciones a un precio proporcionalmente menor. Tienes más pedazos del mismo pastel. Económicamente neutro."},{"t":"Venta en corto (short selling)","d":"Pedir acciones prestadas, venderlas y esperar recomprarlas más baratas. Las pérdidas son teóricamente ilimitadas."},{"t":"Blue chip","d":"Término informal para una empresa grande, establecida y financieramente sólida."}],"deep":[{"h":"Qué pasa realmente cuando le das a \"comprar\"","body":"\n<p>Tu orden no va a \"la bolsa\" como si fuera un solo lugar. Tu bróker la enruta — a una bolsa (NYSE, Nasdaq), a un dark pool o, lo más común para órdenes minoristas, a un <strong>creador de mercado mayorista</strong> como Citadel Securities o Virtu, que le paga a tu bróker por el derecho a ejecutarla. Ese pago es el <em>pago por flujo de órdenes</em> (payment for order flow), y es la razón por la que las comisiones son de $0.</p>\n<p>El creador de mercado te ejecuta al mejor precio nacional de compra/venta o un poco mejor, y se queda con una rebanadita del spread. En una acción líquida esa rebanadita es de un centavo o menos — genuinamente barato. En una acción poco negociada o en una opción con spread amplio, no lo es.</p>\n<table>\n<tr><th>Tipo de orden</th><th>Qué hace</th><th>Úsala cuando</th></tr>\n<tr><td>Mercado</td><td>Se ejecuta de inmediato al precio vigente</td><td>Nombres líquidos, horario regular, un tamaño que no vaya a mover el precio</td></tr>\n<tr><td>Límite</td><td>Se ejecuta solo a tu precio o mejor; puede no ejecutarse</td><td>Acciones poco negociadas, aperturas volátiles, opciones, cada vez que el precio importa más que la certeza</td></tr>\n<tr><td>Stop (stop-loss)</td><td>Se convierte en orden de mercado en cuanto el precio toca tu disparador</td><td>Ponerle tope a la caída — pero puede ejecutarse muy por debajo de tu disparador en un hueco a la baja</td></tr>\n<tr><td>Stop-límite</td><td>Se convierte en orden límite en tu disparador</td><td>La misma idea, con el precio protegido — pero puede no ejecutarse en absoluto en una caída rápida</td></tr>\n<tr><td>Stop dinámico (trailing stop)</td><td>El disparador sigue al precio hacia arriba por un monto o porcentaje fijo</td><td>Asegurar ganancias en un ganador sin elegir una salida fija</td></tr>\n</table>\n<div class=\"box warn\"><b>Dos trampas estructurales</b><p><strong>La apertura y el cierre.</strong> Los spreads son más amplios en los primeros y los últimos 10 minutos. Las órdenes de mercado a las 9:30:01 consiguen peores precios que la misma orden a las 10:15.</p><p><str
