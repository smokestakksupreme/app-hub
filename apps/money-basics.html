go de varios años promedia tu entrada entre distintos entornos de tasas, la misma lógica que una escalera de bonos. Los pagos dependen muchísimo de las tasas.</li>\n<li><b>Lee el calendario de rescate y el periodo de libre revisión</b> La mayoría de los estados te da 10–30 días para cancelar con reembolso completo después de firmar. Úsalo. Llévate el contrato a casa y léelo antes de que se cierre esa ventana.</li>\n</ol>\n<div class=\"box\"><b>Las dos preguntas para hacerle a cualquier vendedor</b><p><strong>\"¿Cuál es tu comisión total por esto, en dólares?\"</strong> y <strong>\"¿Eres fiduciario, por escrito?\"</strong> Los agentes de seguros por lo general operan bajo un estándar de idoneidad (suitability), no uno fiduciario — o sea que el producto tiene que ser apropiado, no óptimo para ti. Los asesores de solo honorarios (fee-only) venden anualidades sin comisión y vale la pena buscarlos para cualquier cosa más compleja que un SPIA.</p></div>"}],"pitfalls":["Comprar una anualidad dentro de una IRA o un 401(k) por el \"diferimiento fiscal\". La cuenta ya tiene impuestos diferidos. Estás pagando por un beneficio que ya tienes — la señal de alerta clásica de que la venta se trataba de la comisión.","Meter la mayor parte de tu patrimonio en un solo contrato. La liquidez desaparece, y una sola aseguradora se convierte en un único punto de falla.","Confundir la \"base de ingreso\" o \"base del beneficio\" con dinero real. En muchos contratos indexados y variables ese número es un fantasma que solo sirve para calcular los pagos del rider — no lo puedes retirar ni dejárselo a tus herederos.","Comprar una anualidad indexada creyendo que obtienes rendimientos de mercado sin riesgo a la baja. Los créditos del índice excluyen dividendos, la aseguradora puede ajustar los topes después de que firmas, y los rendimientos de largo plazo suelen quedar más cerca del territorio de los bonos.","Ignorar el calendario de rescate. Necesitar tu dinero en el año 3 de un calendario de 10 años puede costarte 6–8% del saldo.","Saltarte la opción conjunta y de sobreviviente para tener un cheque más grande. El cónyuge que sobrevive es la persona con más probabilidad de necesitar ese ingreso, y normalmente por más tiempo.","Comprar un pago fijo nominal a los 62 y olvidarte de la inflación. Con 3% de inflación, un cheque fijo de $2,000 compra alrededor de $1,100 de bienes después de 20 años.","Dejar que te vendan un intercambio 1035 como algo \"gratis\". Cambiarte a un contrato nuevo casi siempre reinicia un calendario de rescate desde cero y paga una comisión nueva."],"terms":[{"t":"Prima","d":"El dinero que pagas — una sola suma global o una serie de pagos."},{"t":"Anualizar","d":"Convertir el saldo de la cuenta en un flujo de pagos de ingreso. Normalmente irreversible."},{"t":"Fase de acumulación","d":"El periodo antes de que empiece el ingreso, cuando el valor del contrato está creciendo."},{"t":"Fase de pago / distribución","d":"Cuando los cheques ya te están llegando."},{"t":"SPIA","d":"Anualidad inmediata de prima única (single premium immediate annuity). Entra la suma global, el ingreso empieza de inmediato. La versión más simple y más limpia."},{"t":"DIA","d":"Anualidad de ingreso diferido (deferred income annuity). Pagas ahora, el ingreso empieza en una fecha futura que tú eliges. A veces se le llama seguro de longevidad."},{"t":"MYGA","d":"Anualidad garantizada de varios años (multi-year guaranteed annuity). Una tasa fija por un plazo determinado — en la práctica, un CD de una aseguradora."},{"t":"FIA","d":"Anualidad indexada fija (fixed indexed annuity). Créditos ligados a un índice, con piso de 0% y alza con tope."},{"t":"Anualidad variable","d":"Valor en efectivo invertido en subcuentas de mercado. Riesgo de mercado real, más los cargos del seguro."},{"t":"Tasa de pago","d":"Ingreso anual dividido entre la prima pagada. No es un rendimiento — incluye la devolución de tu propio capital."},{"t":"Crédito de mortalidad","d":"La parte de tu pago que financian los participantes del fondo común que murieron antes del promedio. Exclusivo de las anualidades, y crece con la edad."},{"t":"Cargo por rescate","d":"Una penalización por retirar antes de tiempo, que suele empezar en 7–10% e ir bajando a lo largo de 5–10 años."},{"t":"Retiro libre","d":"Un monto, normalmente 10% al año, que puedes sacar sin cargo por rescate."},{"t":"Rider","d":"Un complemento opcional con una comisión anual — retiro vitalicio garantizado, beneficio por fallecimiento, cuidados de largo plazo."},{"t":"GLWB / GMWB","d":"Beneficio de retiro vitalicio garantizado (guaranteed lifetime withdrawal benefit). Te deja sacar un porcentaje fijo de por vida sin perder el acceso al saldo restante."},{"t":"Base de ingreso","d":"Una cifra contable que se usa para calcular el ingreso del rider. Se confunde muy seguido con el valor de la cuenta. No es efectivo."},{"t":"Razón de exclusión","d":"La parte de cada pago que se trata como devolución de capital libre de impuestos en una anualidad no calificada."},{"t":"Plazo cierto","d":"Un número mínimo garantizado de pagos, aunque mueras antes."},{"t":"Periodo de libre revisión (free-look)","d":"10–30 días después de firmar para cancelar con reembolso completo. Depende del estado."},{"t":"Calificada vs. no calificada","d":"Si la anualidad está dentro de una cuenta de retiro (calificada) o se compró con dinero después de impuestos (no calificada). Define por completo el tratamiento fiscal."}],"deep":[{"h":"Créditos de mortalidad: lo único que hacen las anualidades que ninguna otra cosa puede hacer","body":"\n<p>Este es el núcleo matemático, y casi nadie lo explica. Entiende esto y cualquier discurso de venta de anualidades se vuelve fácil de evaluar.</p>\n<p>Imagina 1,000 personas de 65 años que ponen $100,000 cada una. La aseguradora lo invierte de forma conservadora y le paga un ingreso a todas. Cada año algunos participantes mueren y dejan de cobrar — y sus saldos restantes se quedan en el fondo común, financiando pagos más altos para los que siguen vivos. Esa transferencia es el <strong>crédito de mortalidad</strong>.</p>\n<p>El efecto se acumula con la edad, porque la probabilidad anual de morir sube con fuerza. A los 65 el crédito de mortalidad es una parte pequeña de tu pago. A los 85 puede ser el componente dominante — un rendimiento implícito que ninguna cartera de bonos puede igualar, porque los bonos no tienen ningún mecanismo para capturar el dinero de los que murieron.</p>\n<div class=\"box\"><b>La consecuencia práctica</b><p>Las anualidades tienen su mejor precio para la gente <strong>mayor</strong> y que <strong>espera vivir más que el promedio</strong>. Por eso una anualidad de ingreso diferido comprada a los 65 con pagos que empiezan a los 80 suele ser la forma más eficiente en capital de asegurar la longevidad: comprometes poco dinero hoy, y los créditos de mortalidad durante el periodo de diferimiento hacen un trabajo enorme. Más o menos 10–15% de una cartera en un DIA puede cubrir el riesgo de cola que, si no, tiene que financiar el otro 85%.</p></div>\n<p>De aquí salen dos consecuencias. Primera, <strong>comprar una anualidad a los 50 y tantos suele ser ineficiente</strong> — recibes poco crédito de mortalidad y amarras capital durante décadas. Segunda, <strong>la selección adversa es real</strong>: la gente sana es la que compra anualidades, las aseguradoras lo saben, y el precio ya asume un grupo de compradores más longevo. Si tienes una condición de salud que acorta tu esperanza de vida, pregunta por las anualidades <strong>con suscripción médica</strong> o de \"riesgo agravado\" (impaired risk), que pagan bastante más. Muy pocos compradores saben que existen.</p>"},{"h":"Anualidades indexadas fijas: a dónde va el dinero de verdad","body":"\n<p>Una FIA se vende como el alza del mercado sin la caída. Mecánicamente, esto es lo que la aseguradora hace con tu prima: compra una cartera de bonos que rinde, digamos, 5%, y usa una rebanada de ese rendimiento para comprar opciones call sobre un índice. Los bonos garantizan tu capital; las opciones financian el crédito del índice que te toque. Tu rendimiento realista de largo plazo está acotado por ese rendimiento de los bonos menos la ganancia de la aseguradora y los costos de distribución.</p>\n<p>Lo cual significa que <strong>una FIA es un producto tipo bono con un patrón de pago con forma de acción</strong>, no un producto de acciones con red de seguridad. Una vez que lo ves así, las palancas tienen sentido — y la aseguradora puede ajustar todas y cada una de ellas después de que firmas:</p>\n<table>\n<tr><th>Palanca</th><th>Cómo te limita</th></tr>\n<tr><td><strong>Tasa tope (cap)</strong></td><td>El índice sube 18%, el tope es 8%, te dan 8%. Los topes se bajan cuando caen los rendimientos de los bonos</td></tr>\n<tr><td><strong>Tasa de participación</strong></td><td>Te dan 60% del movimiento del índice. El índice sube 10%, tú recibes 6%</td></tr>\n<tr><td><strong>Spread / margen</strong></td><td>La aseguradora resta primero un monto fijo. El índice sube 6% con un spread de 2%, te dan 4%</td></tr>\n<tr><td><strong>Sin dividendos</strong></td><td>Los créditos del índice siguen solo el rendimiento de precio. Históricamente eso es más o menos 2% al año de rendimiento total que nunca ves</td></tr>\n<tr><td><strong>Reinicio anual / punto a punto</strong></td><td>Un pico a mitad de año que se revierte para el aniversario no te gana nada</td></tr>\n<tr><td><strong>Índices de volatilidad controlada</strong></td><td>Índices a la medida creados para estos productos, con baja volatilidad por diseño — lo que significa bajos rendimientos por diseño. Sus historiales de backtest son mercadotecnia, no evidencia</td></tr>\n</table>\n<div class=\"box warn\"><b>Las tres preguntas que atraviesan cualquier ilustración de una FIA</b><p><strong>1.</strong> ¿Cuál es el tope o la tasa de participación <em>mínima garantizada</em> — lo peor a lo que legalmente te pueden mover? <strong>2.</strong> ¿Cuáles son las tasas actuales y las mínimas de cada opción de índice del contrato? <strong>3.</strong> ¿Esta aseguradora ya ha bajado topes en contratos vigentes antes? Pueden hacerlo y lo hacen. La ilustración no es una promesa; solo la columna garantizada lo es.</p></div>\n<p>El piso de 0% es real y vale algo — pero entiende con precisión qué es lo que protege. Protege que el crédito del índice no sea negativo. No protege el valor de tu cuenta de las comisiones de los riders, que se descuentan pase lo que pase. Un contrato con una comisión GLWB de 1.05% en un mercado plano pierde valor cada año.</p>"},{"h":"Los riders de ingreso y la ilusión de la \"base de ingreso\"","body":"\n<p>La característica más vendida y menos entendida. Un rider <strong>GLWB</strong> (beneficio de retiro vitalicio garantizado) promete que puedes retirar un porcentaje fijo de por vida aunque el valor de la cuenta caiga a cero — y a diferencia de anualizar, conservas el acceso al saldo que quede.</p>\n<p>El discurso normalmente suena así: \"Tu base de ingreso crece a un 7% garantizado cada año\". Ahí es donde la gente se confunde, y vale la pena ser directo al respecto.</p>\n<div class=\"box warn\"><b>La base de ingreso no es tu dinero</b><p>Hay dos libros de contabilidad en el contrato. El <strong>valor de la cuenta</strong> es real — lo puedes retirar, rescatar o dejarle a tus herederos. La <strong>base de ingreso</strong> (o base del beneficio, o valor de roll-up) es un número contable cuyo único propósito es multiplicarse por un porcentaje de retiro. No lo puedes convertir en efectivo. No lo puedes heredar. Un contrato puede mostrar al mismo tiempo una base de ingreso de $300,000 y un valor de cuenta de $190,000, y solo uno de esos números es tuyo.</p></div>\n<p>Para evaluar un rider, ignora por completo la tasa de roll-up y calcula los dólares reales:</p>\n<ul>\n<li><strong>Base de ingreso × porcentaje de retiro = ingreso anual.</strong> Un roll-up de 7% suena enorme, pero si el porcentaje de retiro a la edad en que empiezas es 4.5%, una base de $300,000 da $13,500 al año. Compara <em>ese número</em> contra lo que paga hoy un SPIA simple con la misma prima. Muy seguido el SPIA gana de calle, con una fracción de la complejidad.</li>\n<li><strong>Cuenta todas las comisiones:</strong> la comisión del rider (0.95–1.50%), el cargo de mortalidad y gastos (mortality &amp; expense) en una VA (1.00–1.40%), la comisión administrativa, y los gastos de las subcuentas (0.50–1.00%+). Todo incluido en una anualidad variable cargada de comisiones, 2.5–3.5% al año es común. Ese es el rendimiento real de largo plazo completo de una cartera de bonos, esfumado.</li>\n<li><strong>Fíjate sobre qué base cobran la comisión.</strong> Algunos contratos cobran la comisión del rider contra la <em>base de ingreso</em>, no contra el valor de la cuenta — así que la comisión sube conforme crece el número fantasma, drenando el dinero real más rápido.</li>\n<li><strong>Los retiros en exceso reinician todo.</strong> Saca un dólar más de lo permitido en un año y muchos contratos recalculan la garantía a la baja, de forma permanente.</li>\n</ul>"},{"h":"Impuestos: calificada, no calificada, y la trampa LIFO","body":"\n<p>La tributación de las anualidades se parte en dos según el origen del dinero.</p>\n<p><strong>Calificada</strong> (comprada dentro de una IRA o un 401(k)): todo se rige por las reglas de las cuentas de retiro. Cada distribución es ingreso ordinario y aplican los RMD. Nada de la anualidad cambia eso.</p>\n<p><strong>No calificada</strong> (comprada con dinero después de impuestos): el crecimiento tiene impuestos diferidos y no hay límite de aportación — que es el único argumento fiscal legítimo a favor de una anualidad diferida, aplicable a alguien que ya llenó al máximo todas las demás cuentas con ventajas fiscales.</p>\n<div class=\"box warn\"><b>Último en entrar, primero en salir</b><p>Retira de una anualidad diferida no calificada y el IRS considera que <strong>las ganancias salen primero</strong>, gravadas como ingreso ordinario, más una penalización de 10% antes de los 59½. Solo llegas a tu capital libre de impuestos cuando ya se agotó toda la ganancia. Es exactamente lo contrario de una cuenta de corretaje, donde pagarías tasas de ganancias de capital de largo plazo. Todo el crecimiento de una anualidad se convierte en ingreso ordinario — o sea que cambiaste una tasa fiscal preferencial por diferimiento.</p></div>\n<p>Dos más que importan:</p>\n<ul>\n<li><strong>Razón de exclusión.</strong> Si <em>anualizas</em> un contrato no calificado en lugar de hacer retiros, cada pago se divide en una parte libre de impuestos que es devolución de capital y una parte de intereses que sí es gravable, con base en tu esperanza de vida al inicio. Mucho más amable que los retiros bajo LIFO — anualizar y retirar se gravan de manera muy distinta, y la gente casi nunca se da cuenta de que está eligiendo.</li>\n<li><strong>No hay step-up en la base.</strong> Los herederos que reciben una anualidad no calificada deben impuesto de ingreso ordinario sobre toda la ganancia. Una cuenta de corretaje heredada recibe un step-up completo y la ganancia desaparece. Si dejarles activos a tus herederos es una prioridad, las anualidades están entre los peores activos para heredar y entre los mejores para gastar.</li>\n</ul>\n<p>El <strong>intercambio 1035</strong> te deja pasar de una anualidad a otra sin generar impuestos — útil para escapar de un mal contrato. Pero normalmente reinicia un calendario de rescate y genera una comisión nueva, que es exactamente por lo que algunos agentes lo recomiendan. Pregunta qué mejora en concreto, en dólares.</p>\n<p><strong>QLAC:</strong> un qualified longevity annuity contract te permite mover una cantidad limitada de dinero de la IRA a una anualidad de ingreso diferido que queda excluida del cálculo de los RMD hasta que empiecen los pagos (hasta los 85 como máximo). Reduce tus RMD y cubre la longevidad al mismo tiempo. Los límites se ajustan cada año — revisa la cifra vigente.</p>"},{"h":"Calendarios de rescate, liquidez, y qué pasa si la aseguradora quiebra","body":"\n<p>Dos riesgos que se pasan por alto en el momento de la venta.</p>\n<p><strong>Liquidez.</strong> Un calendario de rescate típico empieza en 7–10% el primer año y va bajando como un punto por año. Algunos contratos duran 10 años; unos cuantos duran más. La mayoría permite un retiro libre de 10% al año después del primer año. Algunos incluyen un <strong>ajuste a valor de mercado</strong> que reduce todavía más tu valor de rescate si las tasas subieron desde la compra — una segunda penalización encima de la primera. Cualquier compra de anualidad debería asumir que el dinero de verdad no está disponible durante todo el calendario.</p>\n<p><strong>Riesgo de crédito.</strong> Una anualidad es una promesa sin garantía de una sola compañía de seguros. No hay FDIC ni SIPC. Lo que sí existe es el sistema de <strong>asociaciones estatales de garantía</strong>: si una aseguradora cae en insolvencia, la asociación de tu estado cubre los contratos hasta un límite — comúnmente $250,000 de valor presente para anualidades, aunque varía por estado y la cobertura generalmente se basa en tu estado de residencia.</p>\n<div class=\"box\"><b>Protección práctica</b><p>Compra solo a aseguradoras calificadas A o mejor por AM Best, y si vas a colocar más que el límite de garantía de tu estado, <strong>repártelo entre dos o tres compañías</strong>. Dos contratos de $200,000 en aseguradoras distintas son bastante más seguros que un solo contrato de $400,000, y la diferencia en el pago suele ser mínima. Las insolvencias de aseguradoras son raras pero no hipotéticas — Executive Life en 1991 y Penn Treaty en 2017 dejaron a sus asegurados en procesos de liquidación que duraron años.</p></div>\n<p>También vale la pena saberlo: las firmas de private equity que han comprado a varias emisoras de anualidades en los últimos años suelen mantener en el balance activos más complejos y menos líquidos que las aseguradoras mutualistas tradicionales. Eso no las hace endebles, pero sí es motivo para mirar la calificación y quién es el dueño en vez del nombre de la marca en el folleto.</p>"},{"h":"Anualidad vs. escalera de bonos vs. simplemente seguir invertido","body":"\n<p>La decisión real casi nunca es \"anualidad o nada\". Es qué herramienta cubre el gasto garantizado.</p>\n<table>\n<tr><th></th><th>SPIA</th><th>Escalera de TIPS / Treasuries</th><th>Cartera diversificada, retiro de 4%</th></tr>\n<tr><td>Protección contra longevidad</td><td>Completa — no la puedes sobrevivir</td><td>Se acaba cuando se acaba la escalera</td><td>Ninguna garantizada; depende de los rendimientos</td></tr>\n<tr><td>Protección contra inflación</td><td>Solo si compras un rider COLA, y cuesta de verdad</td><td>Excelente con TIPS</td><td>Buena en periodos largos, vía acciones</td></tr>\n<tr><td>Liquidez</td><td>Nula una vez anualizada</td><td>Total</td><td>Total</td></tr>\n<tr><td>Deja herencia</td><td>Por lo general no</td><td>Sí</td><td>Sí</td></tr>\n<tr><td>Riesgo de secuencia de rendimientos</td><td>Eliminado</td><td>Eliminado en los años escalonados</td><td>El riesgo central del retiro temprano</td></tr>\n<tr><td>Costo / complejidad</td><td>Bajo si compras un SPIA simple</td><td>Bajo</td><td>Muy bajo</td></tr>\n</table>\n<div class=\"box\"><b>La estructura a la que en realidad converge la mayoría de los planificadores</b><p>Cubre tus gastos <strong>esenciales</strong> con ingreso garantizado — primero el Seguro Social, retrasado hasta los 70 si puedes, y luego un SPIA o DIA simple, dimensionado solo para tapar el hueco que quede. Financia el gasto <strong>discrecional</strong> con una cartera diversificada que se queda invertida buscando crecimiento y protección contra la inflación. A esto a veces se le llama flooring, poner un piso, y es la versión del argumento a favor de las anualidades que sobrevive al escrutinio: compra la garantía para el piso, no para toda la casa.</p></div>\n<p>Prueba de sensatez para dimensionarlo: las fuentes de ingreso garantizado — Seguro Social, pensión, anualidad — cubriendo alrededor del 100% de los gastos esenciales, con la prima de la anualidad limitada a 25–40% de los activos invertibles. Más allá de eso estás pagando margen de aseguradora sobre dinero que estaría mejor invertido, y renunciando a la liquidez que vas a querer cuando pase algo inesperado.</p>\n<p>Un último encuadre que conviene llevar a cualquier reunión de ventas: <strong>las matemáticas del crédito de mortalidad funcionan de verdad, y el producto construido alrededor de ellas muy seguido no.</strong> Una anualidad inmediata sin adornos, de una aseguradora bien calificada, es un instrumento limpio, útil y aburrido. Mientras más se aleja un producto de eso — riders, índices, roll-ups, bonos de bienvenida — más valor se está convirtiendo en cargos y comisiones. Aquí la simplicidad no es un sacrificio; es de hecho la mejor versión.</p>"}]});
TOPICS_ES.push({"id":"insurance","icon":"🛡️","c":"#ff7a8a","lvl":"Protección","name":"Seguro de vida","tag":"No estás comprando una inversión. Estás comprando un sueldo para las personas que dependen del tuyo, por si deja de llegar.","blurb":"Seguro temporal (term) vs. vida entera (whole life), cuánto necesitas de verdad, y por qué el caro se vende con tanta insistencia.","deepTeaser":"Cómo funciona de verdad el valor en efectivo (cash value), la mecánica del IUL y el VUL, la regla de las 7 primas/MEC, las cláusulas adicionales (riders) que vale la pena tener, la suscripción de riesgo (underwriting), y dónde el seguro permanente sí tiene sentido.","basics":[{"h":"Qué es y quién lo necesita","body":"\n<p>Pagas una <strong>prima</strong>. Si mueres mientras la póliza está vigente, la aseguradora paga un <strong>beneficio por fallecimiento</strong> (death benefit) — una suma global, libre de impuesto sobre la renta — a quien hayas nombrado como beneficiario. Ese es todo el producto.</p>\n<p>La verdadera pregunta no es \"¿debería tener un seguro de vida?\" sino \"¿alguien pierde dinero si yo muero?\"</p>\n<ul>\n<li><strong>Sí:</strong> una pareja que depende de tus ingresos, hijos, un padre o una madre a quien mantienes, una hipoteca que quien quede no podría cargar solo, un socio de negocios, o una deuda que firmaste junto con alguien más.</li>\n<li><strong>Probablemente no:</strong> soltero, sin dependientes y sin obligaciones firmadas en conjunto, o ya con suficiente patrimonio para que tus activos lo cubran todo.</li>\n</ul>\n<div class=\"box\"><b>Seguro de vida para niños</b><p>Los agentes lo venden como \"asegurar la asegurabilidad\" y como vehículo de ahorro. Pero los niños no tienen ingresos que reemplazar, y el componente de ahorro es flojo. Un plan 529 o una cuenta de corretaje custodial hace el trabajo de ahorro muchísimo mejor. La excepción es de verdad limitada: un historial familiar documentado que haría difícil conseguir cobertura en el futuro.</p></div>"},{"h":"Temporal vs. permanente — todo el debate en una tabla","body":"\n<table>\n<tr><th></th><th>Seguro temporal (term)</th><th>Vida entera / permanente (whole life)</th></tr>\n<tr><td>Cuánto dura</td><td>Un plazo fijo: 10, 20, 30 años</td><td>Toda tu vida, si pagas las primas</td></tr>\n<tr><td>Costo</td><td>Barato. Muchas veces 5–15x más barato por el mismo beneficio por fallecimiento</td><td>Caro</td></tr>\n<tr><td>Valor en efectivo</td><td>Ninguno</td><td>Sí — un componente de ahorro que crece lento</td></tr>\n<tr><td>Ideal para</td><td>Los 20–30 años en que una familia depende de tus ingresos</td><td>Planificación del impuesto sucesorio, dependientes de por vida, sucesión de un negocio, personas de altos ingresos que ya llenaron al máximo todo lo demás</td></tr>\n<tr><td>Resultado típico</td><td>Le sobrevives, habiendo pagado una cantidad modesta por protección real</td><td>Cerca de un tercio de las pólizas caducan antes de pagar nada — muchas veces tras años de primas altas</td></tr>\n</table>\n<p>El consejo estándar — \"compra temporal e invierte la diferencia\" — es estándar porque las matemáticas casi siempre lo respaldan. Una persona sana de 35 años podría pagar unos cientos de dólares al año por $1,000,000 de cobertura temporal a 20 años. La póliza de vida entera equivalente podría costar varios miles al año. Invierte esa diferencia en un fondo indexado (index fund) durante 20 años y normalmente le va a ganar por mucho al valor en efectivo de la póliza.</p>\n<div class=\"box warn\"><b>Por qué te insisten tanto con el permanente</b><p>Comisiones. La comisión del primer año en una póliza de vida entera suele ser del 50–110% de la prima del primer año; en un temporal es una fracción pequeña de eso. Eso no convierte al seguro permanente en una estafa — tiene usos legítimos — pero sí significa que quien te lo recomienda puede no ser neutral. Pregunta directamente cómo le pagan, y pregunta si es fiduciario.</p></div>"},{"h":"Cuánta cobertura","body":"\n<p>La regla floja es 10–12x tus ingresos. Es un número inicial decente. El método mejor es sumar lo que de verdad hay que financiar:</p>\n<ol class=\"steps\">\n<li><b>Reemplazo de ingresos</b> Los ingresos anuales que perdería tu hogar, multiplicados por la cantidad de años que los sobrevivientes los van a necesitar. Hasta que el hijo menor termine la universidad es una marca común.</li>\n<li><b>Pago de deudas</b> Saldo de la hipoteca, préstamos de auto, préstamos estudiantiles privados (los federales por lo general se cancelan al morir; los privados muchas veces no), y cualquier deuda firmada en conjunto.</li>\n<li><b>Obligaciones futuras</b> Costos universitarios, cuidados para un dependiente con necesidades especiales, un plan para mantener un negocio funcionando.</li>\n<li><b>Gastos finales</b> Funeral, facturas médicas, liquidación de la sucesión — típicamente $10,000–$25,000.</li>\n<li><b>Resta lo que ya existe</b> Ahorros actuales, inversiones, la cobertura grupal que ya tengas, y los beneficios para sobrevivientes del Seguro Social.</li>\n</ol>\n<p>No dejes sin cobertura a una pareja que no genera ingresos. Reemplazar el cuidado infantil de tiempo completo, la administración de la casa y toda la logística cuesta dinero de verdad — a menudo $40,000–$60,000 al año. Una póliza más pequeña ahí es totalmente legítima.</p>"},{"h":"Cómo comprarlo","body":"\n<ol class=\"steps\">\n<li><b>Revisa lo que ya tienes</b> El seguro de vida grupal del empleador suele ser de 1–2x tu salario. Es casi gratis y vale la pena tenerlo — pero se acaba cuando se acaba el trabajo, así que no construyas tu plan sobre eso.</li>\n<li><b>Decide la duración del plazo</b> Ajústala a la obligación. ¿Tu hijo menor tiene 3 años? Un plazo de 20 años te lleva hasta sus años de universidad. ¿A la hipoteca le quedan 25 años? Considera un plazo de 30 años. Algunas personas arman una <em>escalera</em> — una póliza a 30 años y otra a 20 apiladas, para que la cobertura baje por escalones a medida que las obligaciones se encogen.</li>\n<li><b>Compara entre aseguradoras</b> Las tarifas por una cobertura idéntica varían muchísimo porque cada aseguradora evalúa las condiciones de salud de forma distinta. Usa un corredor independiente que cotice con muchas aseguradoras, o un comparador en línea. La póliza es un producto genérico; el precio no.</li>\n<li><b>Revisa la solidez financiera de la aseguradora</b> Calificación AM Best de A o mejor. Estás comprando una promesa que quizá haya que cumplir dentro de 30 años.</li>\n<li><b>Pasa la suscripción de riesgo (underwriting)</b> Solicitud, cuestionario de salud y normalmente un examen paramédico — sangre, orina, estatura/peso, presión arterial, en tu casa. Van a revisar tu historial de recetas médicas, tu registro de manejo (MVR) y tu archivo MIB. Responde con honestidad; una declaración falsa les permite negar el reclamo después, que es el peor momento posible para enterarse.</li>\n<li><b>Nombra beneficiarios, y nombra contingentes</b> Después revísalo tras cada matrimonio, divorcio, nacimiento o fallecimiento. Esta designación manda por encima de tu testamento.</li>\n</ol>\n<div class=\"box\"><b>Consíguelo temprano</b><p>Las primas quedan fijas al momento de emitir la póliza y se calculan según tu edad y tu salud de ese día. Una póliza comprada a los 32 con buena salud cuesta una fracción de la misma póliza a los 48 después de un diagnóstico. Si sabes que vas a necesitar cobertura, esperar sale caro — y una condición nueva puede dejarte directamente sin posibilidad de asegurarte.</p></div>"}],"pitfalls":["Comprar vida entera como \"inversión\" antes de llenar al máximo un 401(k), una IRA y una HSA. Las cuentas con ventajas fiscales ganan en casi cualquier medida y cuestan una fracción.","Depender solo de la cobertura del empleador. Normalmente termina el día que te vas, y las opciones de conversión son caras y limitadas.","Asegurarte de menos para ahorrarte $20 al mes. La diferencia entre $500k y $1M de cobertura temporal suele ser menor que una factura de teléfono.","Mentir u omitir cosas en la solicitud. Una declaración falsa material dentro del periodo de impugnabilidad (normalmente dos años) le permite a la aseguradora negar el reclamo.","Nombrar directamente como beneficiario a un hijo menor de edad. El pago termina en una tutela supervisada por un tribunal. Mejor nombra un fideicomiso.","Dejar caducar una póliza permanente después de años de primas. Pierdes la cobertura y puedes desatar una factura fiscal sorpresa por los préstamos pendientes.","Comprarle al prestamista un seguro de protección hipotecaria o un seguro de vida de crédito. Normalmente es cobertura temporal sobreprecio con un beneficio decreciente, y el banco es el beneficiario."],"terms":[{"t":"Prima","d":"Lo que pagas, mensual o anualmente, para mantener la póliza vigente."},{"t":"Beneficio por fallecimiento","d":"El monto que se paga a tus beneficiarios. Por lo general libre de impuesto sobre la renta para ellos."},{"t":"Beneficiario","d":"Quien recibe el pago. Nombra siempre también un beneficiario contingente."},{"t":"Temporal (term)","d":"Cobertura por un número fijo de años, sin valor en efectivo."},{"t":"Temporal nivelado (level term)","d":"La prima y el beneficio por fallecimiento se mantienen planos todo el plazo. Es el estándar, y es lo que quieres."},{"t":"Vida entera (whole life)","d":"Cobertura permanente con valor en efectivo garantizado y prima fija."},{"t":"Vida universal (UL)","d":"Cobertura permanente con primas flexibles y un valor en efectivo atado a las tasas de interés. Puede caducar si se financia de menos."},{"t":"IUL / VUL","d":"Vida universal con el valor en efectivo ligado a un índice de mercado (IUL) o invertido en subcuentas (VUL)."},{"t":"Valor en efectivo (cash value)","d":"El componente de ahorro dentro de una póliza permanente. Crece con impuestos diferidos; se accede por préstamo o por retiro."},{"t":"Cláusula adicional (rider)","d":"Un agregado que modifica la póliza — exención de primas, beneficio por fallecimiento acelerado, cláusula para hijos, conversión."},{"t":"Suscripción de riesgo (underwriting)","d":"La aseguradora evaluando tu riesgo para fijar tu precio y decidir si te emite la póliza siquiera."},{"t":"Periodo de impugnabilidad","d":"Normalmente los dos primeros años, durante los cuales la aseguradora puede investigar y negar un reclamo por declaración falsa."},{"t":"Cargo por rescate","d":"Una penalización por cobrar antes de tiempo una póliza permanente. Puede durar más de 10 años y consumir casi todo el valor en efectivo."},{"t":"Temporal convertible","d":"Cobertura temporal que puedes convertir en permanente sin un nuevo examen médico. Una característica de verdad valiosa."},{"t":"MEC","d":"Modified endowment contract — una póliza sobrefinanciada más allá de los límites del IRS, que pierde el tratamiento fiscal favorable sobre los préstamos."}],"deep":[{"h":"Qué es realmente el valor en efectivo","body":"\n<p>El marketing describe el valor en efectivo (cash value) como ahorros dentro de tu póliza. Mecánicamente, es lo que sobra después de que la aseguradora se lleva su parte.</p>\n<p>Tu prima se parte en tres: el <strong>costo del seguro</strong> (el cargo real por mortalidad, que sube cada año a medida que envejeces), <strong>cargos y comisiones</strong> (fuertemente cargados al inicio — en el primer año, la mayor parte o toda tu prima se puede ir ahí), y lo que quede va al <strong>valor en efectivo</strong>, que entonces gana una tasa acreditada.</p>\n<p>Por eso el valor en efectivo suele estar cerca de cero los primeros dos o tres años, y por eso la tasa interna de retorno de una póliza de vida entera a 20 años muchas veces queda en un dígito bajo. Mejora mientras más tiempo la conservas, que es exactamente por qué la ilustración que te muestran enfatiza el año 30 y no el año 5.</p>\n<div class=\"box warn\"><b>Cómo leer una ilustración</b><p>Toda ilustración tiene una columna <strong>garantizada</strong> y una columna <strong>no garantizada</strong>. Solo la columna garantizada es una promesa. La columna proyectada asume escalas de dividendos o tasas de acreditación que la aseguradora puede cambiar, y cambia. Pide que corran la ilustración con las tasas garantizadas y con la tasa actual menos 1–2%, y decide con base en eso.</p></div>\n<p>Y el detalle que más sorprende a la gente: con una póliza tradicional de vida entera, <strong>cuando mueres, tus beneficiarios por lo general reciben el beneficio por fallecimiento — no el beneficio por fallecimiento más el valor en efectivo.</strong> El valor en efectivo en la práctica financia el beneficio por fallecimiento. Algunas pólizas ofrecen una opción de \"devolución de primas\" o de beneficio por fallecimiento creciente, con un costo adicional.</p>"},{"h":"Cómo sacar el valor en efectivo sin arruinar la póliza","body":"\n<p>Tres salidas, con consecuencias muy distintas.</p>\n<ul>\n<li><strong>Retiro.</strong> Sacas dinero hasta tu base (el total de primas pagadas) libre de impuestos; por encima de eso es gravable. Reduce permanentemente el beneficio por fallecimiento.</li>\n<li><strong>Préstamo sobre la póliza.</strong> Pides prestado contra el valor en efectivo. No es un evento gravable, no hay revisión de crédito, no hay calendario de pagos. Pero los intereses se acumulan, y los préstamos impagos más sus intereses reducen el beneficio por fallecimiento. Si el saldo del préstamo llega a superar el valor en efectivo, la póliza <strong>caduca — y toda la ganancia se vuelve ingreso gravable en ese año</strong>, sin que entre nada de efectivo para pagar la cuenta. Este es el modo de falla más feo de todo el seguro permanente, y normalmente le pega a la gente cuando anda por los 70 años.</li>\n<li><strong>Rescate.</strong> Cancelas y te llevas el valor en efectivo menos los cargos por rescate. Las ganancias por encima de la base tributan como ingreso ordinario.</li>\n</ul>\n<div class=\"box\"><b>Intercambio 1035</b><p>Si estás atrapado en una mala póliza permanente, un <strong>intercambio 1035</strong> te deja mover el valor en efectivo a otra póliza o a una anualidad sin generar impuestos. Mejor que rescatarla y tragarte la factura fiscal. Ojo: rescatar con pérdida por lo general no te da una pérdida deducible.</p></div>\n<p><strong>El discurso de \"sé tu propio banco\" / infinite banking</strong> está construido sobre los préstamos de póliza. La mecánica es real — puedes pedir prestado contra el valor en efectivo y dejar corriendo la tasa acreditada por debajo. Lo que el discurso omite: años de costos cargados al inicio antes de que el valor en efectivo signifique algo, intereses del préstamo que suelen andar cerca o por encima de la tasa de acreditación, y el riesgo de caducidad de arriba. Puede funcionar para alguien que ya está llenando al máximo cada cuenta con ventajas fiscales y quiere un activo de verdad poco volátil. No es un sustituto de un 401(k), y se lo venden a gente para quien termina siendo exactamente eso.</p>"},{"h":"IUL y VUL: lee la letra chica","body":"\n<p>La <strong>vida universal indexada (IUL)</strong> acredita intereses con base en un índice como el S&amp;P 500, con un piso (normalmente 0%, así que no pierdes por las caídas del mercado) y un tope o una tasa de participación que limita la ganancia. Se vende como \"lo bueno del mercado sin lo malo\".</p>\n<p>Las restricciones de las que se habla menos:</p>\n<ul>\n<li><strong>Los créditos del índice normalmente excluyen los dividendos</strong> — históricamente cerca del 2% al año del retorno total, desaparecido.</li>\n<li><strong>Los topes no están garantizados.</strong> La aseguradora puede bajar el tope después de que compras. Una ilustración corrida con un tope del 10% puede volverse realidad con un 6%.</li>\n<li><strong>El costo del seguro sube con la edad</strong> y se descuenta del valor en efectivo. En años planos o de bajo rendimiento, ese lastre puede encoger el valor en efectivo incluso con un piso del 0% — el piso aplica al crédito del índice, no al saldo de tu cuenta después de los cargos.</li>\n<li><strong>Riesgo de financiarla de menos.</strong> La prima flexible suena a ventaja; lo que significa es que una póliza mal financiada puede consumir su propio valor en efectivo y caducar décadas después, justo a la edad en que reemplazarla es impagable.</li>\n</ul>\n<p>La <strong>vida universal variable (VUL)</strong> invierte el valor en efectivo en subcuentas de mercado. Exposición real al mercado, pérdidas reales de mercado, más los cargos del seguro y las comisiones de las subcuentas encima. Se necesita licencia de valores para venderla, lo cual te dice algo sobre su complejidad.</p>\n<div class=\"box warn\"><b>Los usos honestos del seguro permanente</b><p>Existen, y son más estrechos que el discurso de venta: <strong>liquidez sucesoria</strong> cuando una herencia es lo bastante grande para enfrentar impuesto sucesorio y es ilíquida (un negocio familiar, una granja o una cartera de bienes raíces que de otro modo los herederos tendrían que vender); <strong>un dependiente de por vida</strong>, como un hijo con necesidades especiales, financiado a través de un fideicomiso de necesidades especiales; <strong>continuidad del negocio</strong> — cobertura de persona clave y financiamiento de un acuerdo de compraventa; <strong>alguien de altos ingresos que ya llenó al máximo su 401(k), IRA y HSA</strong> y quiere más espacio con impuestos diferidos; y <strong>metas caritativas o de legado</strong> donde el punto es un pago garantizado. Si nada de eso te describe, el temporal es casi seguro la respuesta.</p></div>"},{"h":"Cláusulas adicionales que sí valen la pena","body":"\n<table>\n<tr><th>Cláusula (rider)</th><th>Qué hace</th><th>Veredicto</th></tr>\n<tr><td>Convertibilidad</td><td>Convertir el temporal en permanente sin nuevo examen médico, hasta una edad determinada</td><td>Muchas veces gratis o casi gratis. Tómala — es opcionalidad real si tu salud cambia</td></tr>\n<tr><td>Exención de primas</td><td>La aseguradora paga tus primas si quedas discapacitado</td><td>Normalmente vale la pena, sobre todo si no tienes buena cobertura por discapacidad</td></tr>\n<tr><td>Beneficio por fallecimiento acelerado</td><td>Acceder a parte del beneficio de forma anticipada ante un diagnóstico de enfermedad terminal o crónica</td><td>Con frecuencia viene incluida sin costo. Confirma que la tienes</td></tr>\n<tr><td>Asegurabilidad garantizada</td><td>Comprar más cobertura después sin pasar por suscripción de riesgo</td><td>Útil si esperas que crezcan tus ingresos o tu familia</td></tr>\n<tr><td>Devolución de primas</td><td>Te reembolsa las primas si sobrevives al plazo</td><td>Normalmente mal negocio — ese costo extra invertido en otra parte suele rendir más</td></tr>\n<tr><td>Cláusula para hijos</td><td>Cobertura pequeña sobre los hijos</td><td>Barata, valor sobre todo emocional. Poco en juego de cualquier forma</td></tr>\n</table>\n<div class=\"box\"><b>La cobertura que la gente se salta y no debería</b><p><strong>El seguro de discapacidad a largo plazo.</strong> Durante tus años de trabajo es mucho más probable que quedes discapacitado a que mueras. El LTD grupal del empleador normalmente reemplaza solo el 60% del salario base, es gravable si el empleador pagó la prima, y se acaba con el trabajo. Una póliza individual de ocupación propia (own-occupation) cuesta dinero de verdad y es, para mucha gente que trabaja, más urgente que la póliza de vida que ya compraron.</p></div>"},{"h":"Suscripción de riesgo, precios e impuestos","body":"\n<p>Las <strong>clases de salud</strong> — Preferred Plus, Preferred, Standard Plus, Standard, y luego las clasificaciones con recargo (rated o table-rated) — pueden mover tu prima 2–3x por la misma cobertura. La complexión física, la presión arterial, la relación de colesterol, la A1c, el consumo de nicotina (incluyendo puros y vapeo, y en general la marihuana), el historial familiar de eventos cardiacos tempranos o cáncer, el historial de manejo y los pasatiempos riesgosos entran todos en la cuenta.</p>\n<ul>\n<li>Cada aseguradora los pondera distinto. Una puede clasificar como Standard una condición controlada mientras otra emite Preferred. Precisamente por eso importa más un corredor independiente que cotice con muchas aseguradoras que el nombre de la marca.</li>\n<li>La <strong>suscripción acelerada o sin examen</strong> usa datos en lugar de un examen paramédico. Más rápida, a veces competitiva si eres joven y sano; normalmente más cara si con un examen completo habrías conseguido una clase de salud de las mejores.</li>\n<li>Si estás en el límite en alguna medida, es totalmente válido posponer el examen unos meses y trabajarlo. Ayunar, hidratarte y no hacer ejercicio la mañana del examen son consejos estándar por algo.</li>\n</ul>\n<p><strong>Tratamiento fiscal.</strong> El beneficio por fallecimiento por lo general está libre de impuesto sobre la renta para los beneficiarios — pero <em>sí</em> se incluye en tu patrimonio sujeto a impuesto sucesorio si tú eres el dueño de la póliza. Para patrimonios cercanos a la exención federal, un <strong>fideicomiso irrevocable de seguro de vida (ILIT)</strong> es el dueño de la póliza para que el dinero quede fuera del patrimonio (mira el tema de Fideicomisos). El valor en efectivo crece con impuestos diferidos. Y si sobrefinancias una póliza más allá de la <strong>prueba de las 7 primas (7-pay test)</strong>, se convierte en un <em>modified endowment contract</em> — los préstamos y retiros pasan a tributar bajo el criterio de último en entrar, primero en salir, con una penalización del 10% antes de los 59½, lo cual destruye calladamente la razón principal por la que alguien sobrefinancia en primer lugar.</p>"}]});
TOPICS_ES.push({"id":"realestate","icon":"🏘️","c":"#5fd0e8","lvl":"Manos a la obra","name":"Bienes raíces","tag":"La única clase de activo importante donde un banco te presta el 80% del precio de compra y te deja quedarte con el 100% de la revalorización.","blurb":"Comprar casa, las cuentas de una propiedad de alquiler, los REITs y cómo funciona de verdad el apalancamiento hipotecario — en ambas direcciones.","deepTeaser":"Cuentas de cap rate y cash-on-cash, las reglas del 1% y del 50%, depreciación e intercambios 1031, estructuras de financiamiento y cómo analizar un negocio antes de hacer una oferta.","basics":[{"h":"Las cuatro formas en que los bienes raíces generan dinero","body":"\n<p>Las acciones te pagan de una o dos formas. Los bienes raíces tienen cuatro funcionando al mismo tiempo, y por eso construyen patrimonio en silencio incluso cuando el precio que sale en los titulares no se mueve.</p>\n<ol>\n<li><strong>Flujo de caja.</strong> La renta menos la hipoteca, los impuestos, el seguro, el mantenimiento, la desocupación y la administración. Lo que sobra es ingreso mensual.</li>\n<li><strong>Revalorización.</strong> La propiedad gana valor con el tiempo. Históricamente los precios de la vivienda en EE. UU. han corrido un poco por encima de la inflación en periodos largos — menos que las acciones, pero eso ignora el punto siguiente.</li>\n<li><strong>Amortización del préstamo.</strong> La renta de tu inquilino paga tu hipoteca. Cada mes una porción del dinero de otra persona se convierte en tu capital (equity). Este es el más subestimado de los cuatro.</li>\n<li><strong>Beneficios fiscales.</strong> Las deducciones por depreciación pueden proteger en papel el ingreso del alquiler mientras tú cobras efectivo real; los intereses hipotecarios y los gastos operativos son deducibles; y los intercambios 1031 te permiten diferir indefinidamente el impuesto sobre ganancias de capital cuando cambias a algo mayor.</li>\n</ol>\n<div class=\"box\"><b>Y luego está el apalancamiento</b><p>Pon 20% de enganche en una propiedad de $300,000 — $60,000 de tu dinero. Si se revaloriza 5% hasta $315,000, ganaste $15,000 sobre $60,000 invertidos. Eso es un <strong>25% de retorno</strong> sobre tu efectivo, a partir de un movimiento del 5%. Ninguna otra clase de activo minorista ofrece apalancamiento 5:1 a tasa fija a 30 años.</p></div>\n<p>La misma palanca funciona al revés. Una caída del 5% borra el 25% de tu capital, y al pago de la hipoteca le da igual. El apalancamiento magnifica lo que ya está pasando.</p>"},{"h":"Tu casa no es lo mismo que una inversión","body":"\n<p>Ser dueño de tu vivienda vale la pena por buenas razones — un pago de vivienda fijo mientras las rentas suben, ahorro forzado a través de la amortización, control sobre dónde vives, y una exclusión considerable de ganancias de capital cuando vendes (actualmente $250,000 soltero / $500,000 casado sobre una residencia principal en la que viviste 2 de los últimos 5 años).</p>\n<p>Pero no es una inversión pura, porque no la puedes alquilar y de todos modos tienes que vivir en algún lado. Los costos que la gente subestima:</p>\n<ul>\n<li><strong>Costos de cierre:</strong> aproximadamente 2–5% al comprar, y 6–9% al vender una vez que cuentas las comisiones del agente. Necesitas una revalorización significativa solo para salir a mano en una venta.</li>\n<li><strong>Mantenimiento:</strong> presupuesta alrededor de 1–2% del valor de la casa al año. En una casa de $350,000 eso son $3,500–$7,000 al año, promediado. Algunos años es cero y luego la climatización (HVAC) y el techo llegan juntos.</li>\n<li><strong>El impuesto predial y el seguro</strong> siguen subiendo aunque la hipoteca sea fija. El seguro en particular se ha movido con fuerza en varios estados.</li>\n<li><strong>Iliquidez.</strong> Vender toma meses y cuesta mucho. Eso importa si un trabajo te obliga a mudarte.</li>\n</ul>\n<div class=\"box\"><b>La regla honesta</b><p>Si vas a estar ahí menos de unos cinco años, alquilar e invertir la diferencia gana con frecuencia. Los costos de transacción necesitan tiempo para amortizarse. Usa una calculadora de alquilar-vs-comprar con números reales de tu mercado antes de asumir que comprar es automáticamente más inteligente.</p></div>"},{"h":"Las cuentas de una propiedad de alquiler — las partes que la gente se salta","body":"\n<p>El error que arruina a los caseros nuevos es tratar la renta menos la hipoteca como ganancia. Esta es la verdadera pila de gastos:</p>\n<table>\n<tr><th>Concepto</th><th>Cifra típica</th></tr>\n<tr><td>Capital + intereses de la hipoteca</td><td>Fijo, conocido</td></tr>\n<tr><td>Impuesto predial</td><td>0.5%–2.5% del valor al año, varía enormemente según el estado</td></tr>\n<tr><td>Seguro</td><td>Más alto que en vivienda ocupada por el dueño; agrega responsabilidad civil o una póliza paraguas</td></tr>\n<tr><td>Desocupación</td><td>Presupuesta 5%–8% de la renta bruta</td></tr>\n<tr><td>Reparaciones &amp; mantenimiento</td><td>5%–10% de la renta bruta</td></tr>\n<tr><td>Gastos de capital (techo, HVAC, calentador de agua)</td><td>5%–10% de la renta bruta, apartado cada mes</td></tr>\n<tr><td>Administración de la propiedad</td><td>8%–12% de la renta si no la administras tú mismo</td></tr>\n<tr><td>HOA, servicios, jardinería, nieve</td><td>Lo que la propiedad realmente requiera</td></tr>\n</table>\n<div class=\"box warn\"><b>La regla del 50%</b><p>Un filtro rápido que usan los inversionistas con experiencia: a largo plazo, los gastos operativos sin contar la hipoteca tienden a rondar el <strong>50% de la renta bruta</strong>. Así que $2,000 de renta dejan aproximadamente $1,000 para cubrir el pago de la hipoteca y producir ganancia. Si la hipoteca es de $1,100, el negocio pierde dinero — sin importar lo que diga la hoja de cálculo del agente que lo lista.</p></div>"},{"h":"Cómo comprar de verdad","body":"\n<ol class=\"steps\">\n<li><b>Consigue una preaprobación, no una precalificación</b> La preaprobación significa que el prestamista verificó ingresos, activos y crédito. Te dice tu presupuesto real y hace creíble tu oferta. Cotiza con 3 o más prestamistas — todas las consultas de crédito hipotecario dentro de una ventana de 45 días cuentan como una sola.</li>\n<li><b>Entiende tus opciones de préstamo</b> Convencional (3–20% de enganche, PMI por debajo del 20%), FHA (3.5% de enganche, crédito más fácil, pero con un seguro hipotecario que muchas veces no se puede quitar), VA (0% de enganche si calificas — el mejor préstamo de Estados Unidos), USDA (rural, 0% de enganche). Las propiedades de inversión generalmente requieren 20–25% de enganche y traen una tasa más alta.</li>\n<li><b>Haz una oferta con contingencias reales</b> Las contingencias de inspección, financiamiento y avalúo son tus salidas. Renunciar a ellas para ganar una guerra de ofertas es un riesgo genuino, no un formalismo.</li>\n<li><b>Inspecciona bien</b> Una inspección general, más especialistas para techo, cámara de drenaje, cimientos o plagas cuando haga falta. Aquí es donde renegocias o te retiras. Son los pocos cientos de dólares más baratos que vas a gastar.</li>\n<li><b>Avalúo y análisis del prestamista</b> El prestamista confirma que el valor respalda el préstamo. Un avalúo bajo significa renegociar, poner efectivo o retirarte.</li>\n<li><b>Cierra</b> Revisa el Closing Disclosure contra tu Loan Estimate línea por línea — lo recibes 3 días antes del cierre exactamente por esta razón. Cuestiona todo lo que sea nuevo.</li>\n</ol>"},{"h":"Bienes raíces sin volverte casero","body":"\n<p>No todo el mundo quiere llamadas de inquilinos a las 11 de la noche. Hay formas legítimas de entrar.</p>\n<ul>\n<li><strong>REITs.</strong> Empresas dueñas de propiedades que generan ingresos, que se negocian como acciones. Están legalmente obligadas a distribuir al menos el 90% del ingreso gravable, así que los rendimientos son altos. Totalmente líquidos, sin inodoros. La contra: no obtienes el beneficio de tu propio apalancamiento, los precios están correlacionados con la bolsa, y las distribuciones son en su mayoría ingreso ordinario — por eso los REITs pertenecen a una IRA.</li>\n<li><strong>Fondos indexados de REITs.</strong> Exposición amplia a todo el sector por unos pocos puntos base.</li>\n<li><strong>House hacking.</strong> Compra un dúplex o un cuádruplex, vive en una unidad y alquila las demás. Obtienes financiamiento de vivienda ocupada por el dueño — tan poco como 3.5% de enganche sobre una propiedad que genera ingresos — que posiblemente sea el mejor punto de entrada a los bienes raíces de alquiler para alguien que apenas empieza.</li>\n<li><strong>Plataformas de crowdfunding.</strong> Participaciones fraccionadas en negocios específicos. Retornos declarados más altos, pero muchas veces ilíquidos por años, con capas de comisiones y riesgo del patrocinador difíciles de evaluar desde afuera. Trátalas con escepticismo real.</li>\n</ul>"}],"pitfalls":["Subestimar los gastos de capital. Los techos, los sistemas de climatización (HVAC) y los calentadores de agua tienen vidas útiles conocidas y costos enormes. Si no estás apartando dinero cada mes para ellos, en realidad no tienes flujo de caja positivo.","Comprar por la revalorización proyectada en vez del flujo de caja actual. Un negocio que solo funciona si los precios suben es una especulación, no una inversión.","Saltarte la inspección para ganar una guerra de ofertas. Los problemas de cimientos y drenaje cuestan cinco cifras.","Ser un mal casero por accidente. La selección de inquilinos, la ley de arrendamiento de tu estado y el proceso de desalojo son cosas que se aprenden antes de tener un inquilino, no durante.","Sobreapalancarte. Varias propiedades con márgenes delgados convierten una desocupación o una pérdida de empleo en una cascada.","Ignorar la trayectoria del seguro y del impuesto predial. Ambos han subido con fuerza en muchos mercados y pueden borrar un margen delgado.","Tratar el capital de tu casa como riqueza gastable. Refinanciar sacando efectivo para financiar tu estilo de vida es como la gente terminó debiendo más que el valor de su casa en 2008."],"terms":[{"t":"Enganche","d":"Efectivo que pones por adelantado. Un 20% evita el PMI en un préstamo convencional."},{"t":"PMI","d":"Seguro hipotecario privado. Protege al prestamista, no a ti. Se puede quitar en préstamos convencionales una vez que llegas a ~20% de capital."},{"t":"Escrow","d":"Una cuenta que el prestamista usa para cobrar y pagar tu impuesto predial y tu seguro junto con tu pago mensual."},{"t":"Amortización","d":"El calendario que divide cada pago entre intereses y capital. Los primeros pagos son casi todo intereses."},{"t":"Capital (equity)","d":"El valor de la propiedad menos lo que debes."},{"t":"Cap rate","d":"El ingreso operativo neto dividido entre el precio de compra. Una comparación rápida del rendimiento sin apalancamiento entre propiedades."},{"t":"Retorno cash-on-cash","d":"El flujo de caja anual antes de impuestos dividido entre el efectivo realmente invertido. El número que refleja tu realidad apalancada."},{"t":"NOI","d":"Ingreso operativo neto — todos los ingresos menos todos los gastos operativos, antes del pago de la hipoteca."},{"t":"Multiplicador de renta bruta","d":"El precio dividido entre la renta bruta anual. Un primer filtro tosco."},{"t":"Depreciación","d":"Una deducción anual en papel sobre la construcción (no el terreno) que protege el ingreso del alquiler. 27.5 años en residencial."},{"t":"Intercambio 1031","d":"Pasar lo obtenido por la venta de una propiedad de inversión a otra para diferir el impuesto sobre ganancias de capital."},{"t":"HELOC","d":"Línea de crédito sobre el capital de tu casa. Un préstamo revolvente contra tu capital, normalmente a tasa variable."},{"t":"DSCR","d":"Ratio de cobertura del servicio de la deuda — el NOI dividido entre los pagos de la deuda. Los préstamos para inversionistas suelen exigir 1.2 o mejor."},{"t":"ARM","d":"Hipoteca de tasa ajustable. Tasa inicial más baja, y luego se reajusta según un calendario."},{"t":"Seguro de título","d":"Protege contra defectos en el historial de propiedad. Los prestamistas lo exigen; la póliza del dueño normalmente vale la pena."},{"t":"Póliza paraguas","d":"Cobertura extra de responsabilidad civil por encima de tus pólizas de propiedad. Barata, e importante en cuanto tienes alquileres."}],"deep":[{"h":"Analizar un negocio: los números de verdad","body":"\n<p>Trabaja de arriba hacia abajo. Todo inversionista con experiencia sigue esta misma secuencia.</p>\n<table>\n<tr><th>Paso</th><th>Cálculo</th><th>Ejemplo</th></tr>\n<tr><td>Renta bruta programada</td><td>Renta de mercado × 12</td><td>$2,200 × 12 = $26,400</td></tr>\n<tr><td>Menos desocupación</td><td>× 7%</td><td>−$1,848 → $24,552</td></tr>\n<tr><td>Menos gastos operativos</td><td>Impuestos, seguro, mantenimiento, reserva de capex, administración, HOA</td><td>−$10,500 → <strong>NOI $14,052</strong></td></tr>\n<tr><td>Cap rate</td><td>NOI ÷ precio</td><td>$14,052 ÷ $285,000 = <strong>4.9%</strong></td></tr>\n<tr><td>Menos servicio de la deuda</td><td>P&amp;I (capital + intereses) del préstamo</td><td>−$12,900 → <strong>flujo de caja $1,152/año</strong></td></tr>\n<tr><td>Cash-on-cash</td><td>Flujo de caja ÷ efectivo invertido</td><td>$1,152 ÷ $68,000 = <strong>1.7%</strong></td></tr>\n</table>\n<p>Ese negocio produce unos $96 al mes antes de que algo se rompa. Un calentador de agua borra el año. Así se ve en papel un negocio marginal antes de que un agente lo describa como \"excelente flujo de caja\".</p>\n<ul>\n<li>El <strong>cap rate</strong> ignora el financiamiento, lo que lo convierte en la herramienta correcta para comparar propiedades entre sí y contra el mercado. Un cap rate más bajo generalmente significa un mercado más deseable y de menor riesgo — estás pagando más por calidad y potencial de revalorización.</li>\n<li>El <strong>cash-on-cash</strong> sí incluye el financiamiento, así que te dice cuánto ganan tus dólares reales.</li>\n<li>El <strong>retorno total</strong> suma encima la amortización del préstamo, la revalorización y los beneficios fiscales — que es como un negocio con 1.7% de cash-on-cash puede ser aun así un 12% de retorno total. Solo sé honesto sobre qué componentes están garantizados y cuáles son una esperanza.</li>\n</ul>\n<div class=\"box\"><b>Reglas rápidas para filtrar</b><p><strong>La regla del 1%:</strong> la renta mensual debería ser al menos el 1% del precio de compra ($2,000 de renta en una propiedad de $200,000). Casi imposible en los mercados costeros caros, todavía alcanzable en partes del Medio Oeste y el Sur. <strong>La regla del 50%</strong> para los gastos operativos. <strong>DSCR por encima de 1.25</strong> para un margen de seguridad real. Estos son filtros para decidir qué analizar — no sustitutos del análisis.</p></div>"},{"h":"Financiamiento: la pieza que determina tus retornos","body":"\n<table>\n<tr><th>Tipo de préstamo</th><th>Enganche</th><th>Notas</th></tr>\n<tr><td>Convencional ocupado por el dueño</td><td>3–20%</td><td>Las mejores tasas. PMI si el enganche es menor al 20%, se puede quitar después</td></tr>\n<tr><td>FHA</td><td>3.5%</td><td>Crédito indulgente. El MIP normalmente dura toda la vida del préstamo salvo que refinancies para salir</td></tr>\n<tr><td>VA</td><td>0%</td><td>Sin PMI, tasas excelentes. Reutilizable. El préstamo más fuerte disponible si calificas</td></tr>\n<tr><td>Convencional de inversión</td><td>20–25%</td><td>Tasa típicamente 0.5–0.875% por encima del ocupado por el dueño</td></tr>\n<tr><td>DSCR / préstamo para inversionistas</td><td>20–25%</td><td>Califica por el ingreso de la propiedad, no por tu W-2. Tasa más alta, sin comprobantes de ingreso</td></tr>\n<tr><td>Portafolio / banco local</td><td>15–25%</td><td>Se queda en los libros del banco, términos flexibles, amortización a menudo más corta</td></tr>\n<tr><td>Hard money</td><td>10–30%</td><td>Rápido, caro (10–15% más puntos), a corto plazo. Para flips y BRRRR, no para conservar</td></tr>\n</table>\n<p><strong>Tasa vs. puntos.</strong> Pagar puntos de descuento te compra una tasa más baja. Divide el costo de los puntos entre el ahorro mensual para obtener el punto de equilibrio en meses; si vas a conservar la propiedad más tiempo que eso, los puntos ganan. Si hay cualquier posibilidad de que refinancies o vendas antes, no.</p>\n<p><strong>El house hacking es el código de trucos.</strong> Financiamiento de vivienda ocupada por el dueño en una propiedad de 2–4 unidades significa 3.5–5% de enganche sobre un activo que genera ingresos, y los prestamistas muchas veces cuentan una parte de la renta proyectada para calificarte. Vive ahí el año requerido, luego múdate y repite. Varios portafolios serios empezaron exactamente así.</p>\n<p><strong>BRRRR</strong> — comprar, remodelar, alquilar, refinanciar, repetir. Compra una propiedad deteriorada por debajo del mercado, renuévala para subir el valor del avalúo, coloca un inquilino, y luego refinancia sacando efectivo para recuperar tu capital original y meterlo en el siguiente negocio. Funciona cuando compras bien y controlas la remodelación. Falla cuando el valor después de la reparación sale bajo, la remodelación se pasa de presupuesto, o las tasas suben entre la compra y el refinanciamiento — y las tres cosas pasan más seguido de lo que sugieren los pódcast.</p>"},{"h":"La maquinaria fiscal","body":"\n<p>El tratamiento fiscal de los bienes raíces es genuinamente favorable, y es una gran parte de por qué la riqueza se concentra aquí.</p>\n<ul>\n<li><strong>Depreciación.</strong> El IRS te deja deducir el valor de la construcción (no el terreno) a lo largo de 27.5 años en residencial. Sobre una construcción de $275,000 eso son $10,000 al año de deducción contra el ingreso del alquiler — mientras la propiedad puede estar revalorizándose de verdad. Así es como un alquiler con flujo de caja positivo puede mostrar una pérdida en papel.</li>\n<li><strong>Segregación de costos.</strong> Un estudio de ingeniería reclasifica componentes — electrodomésticos, pisos, jardinería, ciertos accesorios — en calendarios de 5, 7 y 15 años, adelantando las deducciones de forma dramática. Vale lo que cuesta el estudio en propiedades grandes.</li>\n<li><strong>Recaptura de depreciación.</strong> La trampa. Cuando vendes, la depreciación que reclamaste se recaptura a hasta un 25%. Es un diferimiento, no un regalo — salvo que nunca vendas.</li>\n<li><strong>Intercambio 1031.</strong> Pasa lo obtenido a otra propiedad de inversión y difiere la ganancia por completo. Tiempos estrictos: identifica la propiedad de reemplazo en 45 días, cierra en 180, y usa un intermediario calificado — no puedes tocar el dinero. Encadena esto indefinidamente, y bajo la ley actual la base se ajusta al alza al fallecer, así que los herederos pueden heredar sin la ganancia diferida. \"Intercambiar hasta morir\" es una estrategia real.</li>\n<li><strong>Reglas de pérdidas por actividad pasiva.</strong> Las pérdidas de alquiler son generalmente pasivas y solo pueden compensar ingreso pasivo. Hay una asignación especial de $25,000 para participantes activos que se elimina gradualmente entre $100k y $150k de ingreso. El <strong>estatus de profesional inmobiliario</strong> — 750+ horas y más de la mitad de tu tiempo laboral en negocios de bienes raíces — desbloquea la compensación ilimitada contra el ingreso ordinario. Se audita mucho y exige registros de tiempo llevados al momento.</li>\n<li><strong>Deducción QBI.</strong> El ingreso del alquiler puede calificar para la deducción del 20% por ingreso calificado de negocio si la actividad llega a ser un oficio o negocio bajo el puerto seguro.</li>\n</ul>\n<div class=\"box warn\"><b>Consigue un contador que haga bienes raíces</b><p>Esta es la única área donde un preparador de impuestos generalista rutinariamente le cuesta a la gente más que el honorario del contador. La segregación de costos, el estatus de profesional inmobiliario, los tiempos del 1031 y la estructura de entidades son todos fáciles de equivocar de formas caras.</p></div>"},{"h":"Operación: donde realmente se ganan o se pierden los retornos","body":"\n<p>La hoja de cálculo asume una operación competente. La mayor parte del bajo desempeño se rastrea hasta la operación, no hasta el precio de compra.</p>\n<ul>\n<li><strong>Seleccionar bien al inquilino es lo de mayor apalancamiento que haces.</strong> Ingresos de 3x la renta, revisión de crédito, historial criminal y de desalojos, y — el paso que la gente se salta — llama al casero <em>anterior</em>, no al actual. El casero actual puede querer que se vayan. Aplica criterios escritos de forma idéntica a cada solicitante; las violaciones a las leyes de vivienda justa (Fair Housing) son caras y fáciles de cometer sin querer.</li>\n<li><strong>Conoce la ley de arrendamiento de tu estado antes de tener un inquilino.</strong> Los límites de depósito de garantía y los plazos para devolverlo, los requisitos de aviso y los tiempos de desalojo varían enormemente. Algunas jurisdicciones tardan muchos meses en desalojar. Ese plazo es un insumo de riesgo real.</li>\n<li><strong>Reservas.</strong> Seis meses de gastos completos por propiedad, líquidos. Esto es lo que convierte un mal año en un inconveniente.</li>\n<li><strong>La administración de la propiedad</strong> cuesta 8–12% más una comisión de arrendamiento, y a menudo se paga sola gracias a una mejor selección de inquilinos, cambios de inquilino más rápidos y mejores precios con proveedores — además hace que el activo sea genuinamente pasivo y te permite ser dueño fuera de tu propio mercado. Autoadministrar es un trabajo; ponle un precio honesto a tu tiempo.</li>\n<li><strong>Estructura de responsabilidad.</strong> Una LLC por propiedad o por grupo pequeño, más una póliza paraguas. Ten en cuenta que transferir una propiedad hipotecada a una LLC puede técnicamente activar una cláusula de vencimiento anticipado por venta; los prestamistas rara vez la hacen valer, pero habla con un abogado en vez de asumirlo.</li>\n<li><strong>Seguro.</strong> Póliza de casero (DP-3), cobertura por pérdida de rentas, y una mirada seria a las inundaciones — una gran parte del daño por inundación ocurre fuera de las zonas designadas de alto riesgo, donde las pólizas estándar lo excluyen.</li>\n</ul>"},{"h":"Los ciclos, y lo que se rompe","body":"\n<p>Los bienes raíces son locales, cíclicos y lentos, lo que hace que se sientan más seguros de lo que son.</p>\n<ul>\n<li><strong>Las tasas de interés mandan sobre la accesibilidad, y la accesibilidad manda sobre los precios.</strong> Pasar del 4% al 7% en una hipoteca a 30 años recorta en aproximadamente 25% el precio que puede sostener un pago mensual dado. Ese es el mecanismo detrás de la mayoría de los grandes ajustes de precio.</li>\n<li><strong>La oferta es lenta.</strong> La construcción toma años, así que el mercado crónicamente se pasa y se queda corto frente a la demanda. Vigila los permisos, los meses de inventario y los días en el mercado de tu submercado específico — los números nacionales no te dicen casi nada sobre tu calle.</li>\n<li><strong>La concentración de empleo es el riesgo que sí duele.</strong> Un mercado que depende de un solo empleador o una sola industria puede perder demanda de renta y valor de la propiedad al mismo tiempo.</li>\n<li><strong>El aumento del seguro y de los impuestos</strong> se ha vuelto el principal asesino de márgenes en varios estados — un cambio existencial para negocios de margen delgado comprados años antes.</li>\n<li><strong>Cambios regulatorios:</strong> el control de rentas, las prohibiciones de alquileres de corto plazo y las moratorias de desalojo han reescrito de la noche a la mañana la economía de los negocios en ciudades específicas.</li>\n</ul>\n<div class=\"box\"><b>Lo que de verdad te protege</b><p>Deuda de tasa fija a largo plazo (para que un salto de tasas no pueda cambiar tu pago), flujo de caja positivo desde la compra (para que nunca seas un vendedor forzado), reservas reales, y una propiedad que cuadre en un mercado con empleo diversificado. Los inversionistas que perdieron propiedades en 2008 en su mayoría no las perdieron porque los precios cayeran — las perdieron porque tenían deuda ajustable, nada de flujo de caja y ninguna reserva cuando los precios cayeron.</p></div>"}]});
TOPICS_ES.push({"id":"trusts","icon":"📜","c":"#c77dff","lvl":"Avanzado","name":"Fideicomisos","tag":"Un contenedor legal que es dueño de tus bienes y los reparte según tus condiciones — incluso después de que ya no estés.","blurb":"Qué es un fideicomiso (trust), revocable vs. irrevocable, qué hace que un testamento no puede hacer, y si de verdad necesitas uno.","deepTeaser":"Tributación de fideicomisos, ILIT, SLAT, fideicomisos dinásticos y de protección de activos, planificación para personas con discapacidad, revalorización de la base (step-up basis), y el error de financiamiento que hace fracasar a la mayoría de los fideicomisos.","basics":[{"h":"Qué es realmente un fideicomiso","body":"\n<p>Un fideicomiso es un acuerdo legal con tres roles:</p>\n<ul>\n<li><strong>Fideicomitente</strong> (grantor, también settlor o trustor) — tú. La persona que lo crea y mete los bienes adentro.</li>\n<li><strong>Fiduciario</strong> (trustee) — quien administra los bienes según las reglas que tú escribiste. Muchas veces eres tú, mientras estás vivo y en buenas condiciones.</li>\n<li><strong>Beneficiario</strong> — quien se beneficia. Normalmente tú en vida, y después tu familia.</li>\n</ul>\n<p>Transfieres la propiedad legal de los bienes al fideicomiso. El fideicomiso los guarda y el fiduciario los administra bajo el documento que escribiste. Como el fideicomiso no se muere, los bienes que están adentro no tienen que pasar por el proceso judicial que rige los bienes de una persona fallecida.</p>\n<div class=\"box\"><b>La analogía más simple</b><p>Un testamento es un conjunto de instrucciones que se leen después de tu muerte, supervisadas por un juez. Un fideicomiso es un contenedor que ya tiene tus cosas adentro, con instrucciones adjuntas, y que sigue funcionando sin un juez — antes, durante y después de tu muerte.</p></div>"},{"h":"Testamento vs. fideicomiso","body":"\n<table>\n<tr><th></th><th>Testamento</th><th>Fideicomiso revocable en vida</th></tr>\n<tr><td>Cuándo entra en vigor</td><td>Solo al morir</td><td>De inmediato, y continúa después de la muerte</td></tr>\n<tr><td>Sucesión judicial (probate)</td><td>Sí — proceso judicial público</td><td>No, para los bienes titulados a nombre del fideicomiso</td></tr>\n<tr><td>Privacidad</td><td>Registro público; cualquiera puede leerlo</td><td>Privado</td></tr>\n<tr><td>Si quedas incapacitado</td><td>No hace nada — necesitas un poder legal aparte</td><td>El fiduciario sucesor entra sin fricción</td></tr>\n<tr><td>Nombra tutores para hijos menores</td><td>Sí — solo un testamento puede hacer esto</td><td>No</td></tr>\n<tr><td>Costo de armarlo</td><td>Bajo</td><td>Más alto — normalmente $1,500–$4,000 con un abogado</td></tr>\n<tr><td>Trabajo continuo</td><td>Ninguno</td><td>Tienes que retitular los bienes a su nombre, y seguir haciéndolo</td></tr>\n</table>\n<p>La <strong>sucesión judicial</strong> (probate) es el proceso en tribunales que valida un testamento, paga a los acreedores y reparte los bienes. Puede tardar meses o años, cuesta un porcentaje del patrimonio en algunos estados, y es completamente público — cualquiera puede averiguar qué tenías y quién lo recibió. Evitarlo es la razón más común por la que la gente arma un fideicomiso.</p>\n<p>Fíjate en la última fila de la tabla. Un fideicomiso que existe en papel pero al que nunca le retitularon bienes no hace <strong>nada</strong>. Esta es la falla más común en la planificación patrimonial.</p>"},{"h":"Los dos sabores principales","body":"\n<p><strong>Fideicomiso revocable en vida.</strong> Lo puedes cambiar o cancelar cuando quieras. Normalmente actúas como tu propio fiduciario, y para efectos fiscales es invisible — los bienes siguen siendo tuyos y se declaran en tu propia declaración de impuestos.</p>\n<ul>\n<li><strong>Sí hace:</strong> evitar la sucesión judicial, mantener todo privado, dar un traspaso limpio si quedas incapacitado, y dejarte controlar los tiempos (\"repartir a los 25, 30 y 35\" en vez de una suma única a los 18).</li>\n<li><strong>No hace:</strong> protegerte de acreedores o demandas, reducir el impuesto sobre la renta, ni reducir el impuesto al patrimonio. Sigues controlando los bienes, así que la ley los sigue tratando como tuyos.</li>\n</ul>\n<p><strong>Fideicomiso irrevocable.</strong> Una vez creado y financiado, en general no lo puedes deshacer. Cedes el control — y eso es exactamente lo que compra los beneficios.</p>\n<ul>\n<li><strong>Sí hace:</strong> sacar bienes de tu patrimonio gravable, dar protección real frente a acreedores y demandas, permitir planificación para Medicaid (sujeta a un período de revisión de 5 años), y mantener un seguro de vida fuera de tu patrimonio.</li>\n<li><strong>No hace:</strong> dejarte cambiar de opinión a la ligera. Modificarlo requiere el consentimiento de los beneficiarios, aprobación judicial, o cláusulas específicas escritas desde el inicio.</li>\n</ul>\n<div class=\"box warn\"><b>La versión barata que le sirve a la mayoría</b><p>La mayoría de los hogares no necesita ningún fideicomiso. Las cuentas de retiro, los seguros de vida y las cuentas bancarias pagaderas al fallecer se transmiten por <strong>designación de beneficiario</strong> y se saltan la sucesión judicial automáticamente. Muchos estados permiten escrituras con transferencia al fallecer para bienes raíces, y registro TOD para vehículos y cuentas de corretaje. Dejar bien puesta cada designación de beneficiario es gratis, toma una tarde, y resuelve la mayor parte de lo que la gente quiere de un fideicomiso.</p></div>"},{"h":"Cuándo un fideicomiso realmente vale la pena","body":"\n<ul>\n<li><strong>Tienes bienes raíces en más de un estado.</strong> Si no, tus herederos enfrentan una sucesión judicial separada en cada estado. Esto solo ya suele justificar el costo.</li>\n<li><strong>Tienes hijos menores de edad.</strong> Sin un fideicomiso, la herencia va a una tutela supervisada por el tribunal y se entrega como suma única a los 18. Un fideicomiso te deja escalonarla y nombrar a quien la administre.</li>\n<li><strong>Un beneficiario tiene una discapacidad.</strong> Una herencia directa puede descalificar a alguien de Medicaid y del SSI. Un fideicomiso para personas con necesidades especiales bien redactado preserva los beneficios mientras complementa su calidad de vida. Esto no es opcional — es el estándar de cuidado.</li>\n<li><strong>Familia ensamblada.</strong> Quieres proveer para tu cónyuge actual y a la vez garantizar que los hijos de un matrimonio anterior hereden al final. Un testamento por sí solo no puede lograr esto de forma confiable.</li>\n<li><strong>La privacidad te importa.</strong> Ser dueño de un negocio, tener perfil público, o circunstancias familiares que prefieres no dejar en un expediente judicial abierto.</li>\n<li><strong>Tienes un beneficiario que no es bueno con el dinero</strong>, o está en un matrimonio inestable, o tiene exposición a acreedores. Un fideicomiso con cláusula de protección contra dilapidación (spendthrift) protege la herencia de sus acreedores y de un divorcio.</li>\n<li><strong>Exposición al impuesto al patrimonio.</strong> La exención federal es alta, pero alrededor de una docena de estados cobran su propio impuesto al patrimonio o a las herencias con umbrales mucho más bajos. Revisa tu estado.</li>\n<li><strong>Tienes un negocio o una cartera de propiedades en renta</strong> y quieres continuidad en vez de una venta de remate.</li>\n</ul>"},{"h":"Cómo armar uno","body":"\n<ol class=\"steps\">\n<li><b>Inventaría todo</b> Cuentas, bienes raíces, participaciones en negocios, vehículos, pólizas de seguro, cuentas de retiro y activos digitales. No puedes planear alrededor de lo que no has listado.</li>\n<li><b>Decide qué quieres realmente</b> Quién recibe qué, cuándo y bajo qué condiciones. Quién cría a tus hijos. Quién toma decisiones médicas y financieras si tú no puedes. Esta es la parte difícil, y es la parte que solo tú puedes hacer.</li>\n<li><b>Contrata a un abogado patrimonial con licencia en tu estado</b> El costo típico de un paquete completo — fideicomiso, testamento complementario (pour-over will), poder financiero y directiva médica — va de $1,500 a $4,000. El derecho sucesorio es muy específico de cada estado; las plantillas en línea suelen pasar por alto requisitos estatales y son una mala inversión en algo con estas consecuencias.</li>\n<li><b>FINANCIA EL FIDEICOMISO</b> Retitula la escritura de tu casa. Cambia la titularidad de tu cuenta de corretaje. Reasigna las participaciones de tu LLC. Un fideicomiso sin financiar es una pila cara de papel — y aquí es donde la mayoría de la gente se detiene.</li>\n<li><b>Coordina las designaciones de beneficiario</b> Las cuentas de retiro y los seguros de vida se transmiten por designación, no por el fideicomiso. Asegúrate de que apunten a donde tú quieres. Nombrar un fideicomiso como beneficiario de una IRA tiene consecuencias fiscales reales bajo la SECURE Act — hazlo solo con asesoría.</li>\n<li><b>Revísalo cada pocos años</b> Y de inmediato después de cualquier matrimonio, divorcio, nacimiento, muerte, mudanza a otro estado, o cambio grande en tus bienes.</li>\n</ol>"}],"pitfalls":["Crear un fideicomiso y nunca financiarlo. El error más común y más caro de la planificación patrimonial.","Suponer que un fideicomiso reemplaza al testamento. Igual quieres un testamento complementario (pour-over will) que recoja todo lo que se te olvidó retitular, y es el único documento que puede nombrar tutores para hijos menores.","Nombrar directamente como beneficiario de una cuenta a un menor o a una persona con discapacidad. Dispara procesos de tutela o destruye beneficios sujetos a comprobación de recursos.","Elegir al fiduciario por sentimiento en vez de por competencia. Administrar un fideicomiso es un trabajo administrativo, financiero y muchas veces ingrato. Un fiduciario profesional o corporativo a veces es la opción más amable.","Olvidar que las designaciones de beneficiario le ganan a todo. Tu fideicomiso y tu testamento no anulan el formulario que está archivado con el proveedor de tu 401(k).","Usar una plantilla en línea para un patrimonio complicado. Segundos matrimonios, participaciones en negocios, propiedades fuera del estado y necesidades especiales requieren redacción de verdad.","No volver a revisarlo nunca. Un fideicomiso escrito antes de un divorcio y de una mudanza a otro estado es un pasivo.","Meter bienes revalorizados en un fideicomiso irrevocable sin revisar las consecuencias sobre la base fiscal. Puedes dejarles a tus herederos una factura enorme de ganancias de capital para ahorrar un impuesto al patrimonio que nunca ibas a deber."],"terms":[{"t":"Fideicomitente (grantor / settlor)","d":"La persona que crea el fideicomiso y transfiere bienes a él."},{"t":"Fiduciario (trustee)","d":"Quien administra los bienes del fideicomiso según los términos del documento. Tiene un deber fiduciario hacia los beneficiarios."},{"t":"Fiduciario sucesor","d":"Quien toma el mando cuando mueres o quedas incapacitado. Nombrar a alguien capaz es crítico."},{"t":"Beneficiario","d":"Quien se beneficia del fideicomiso. Los beneficiarios de ingresos y los beneficiarios del remanente pueden ser personas distintas."},{"t":"Financiamiento (funding)","d":"Retitular de verdad los bienes a nombre del fideicomiso. Sin eso, el fideicomiso no hace nada."},{"t":"Sucesión judicial (probate)","d":"El proceso judicial público que liquida el patrimonio de una persona fallecida. Lento, caro, y aquello que la mayoría de los fideicomisos existe para evitar."},{"t":"Testamento complementario (pour-over will)","d":"Un testamento de respaldo que barre hacia el fideicomiso todo lo que olvidaste retitular al momento de morir."},{"t":"Poder legal (power of attorney)","d":"Autoriza a alguien a actuar financieramente en tu nombre si tú no puedes. Documento aparte, esencial."},{"t":"Directiva médica anticipada","d":"Nombra a quien toma decisiones médicas y deja por escrito tus deseos. También s
