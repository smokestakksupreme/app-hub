e le llama testamento vital o representante de salud."},{"t":"Cláusula de protección contra dilapidación (spendthrift)","d":"Impide que los acreedores de un beneficiario alcancen los bienes del fideicomiso antes de que se repartan."},{"t":"Revalorización de la base (step-up in basis)","d":"Los bienes heredados reinician su base de costo al valor a la fecha de la muerte, borrando las ganancias de capital acumuladas."},{"t":"ILIT","d":"Fideicomiso irrevocable de seguro de vida. Es dueño de la póliza para que el beneficio por fallecimiento quede fuera de tu patrimonio gravable."},{"t":"Poder Crummey","d":"Una ventana corta para que los beneficiarios retiren un regalo, lo cual lo hace calificar para la exclusión anual del impuesto a las donaciones."},{"t":"Fideicomiso QTIP","d":"Le da ingresos al cónyuge sobreviviente mientras tú controlas quién hereda al final. Hecho para familias ensambladas."},{"t":"Fideicomiso para necesidades especiales","d":"Complementa la calidad de vida de un beneficiario con discapacidad sin descalificarlo de los beneficios sujetos a comprobación de recursos."},{"t":"Fideicomiso dinástico","d":"Un fideicomiso de larga duración diseñado para pasar riqueza entre generaciones minimizando los impuestos de transferencia."},{"t":"Decantación (decanting)","d":"Verter los bienes de un fideicomiso irrevocable viejo a uno nuevo con mejores términos. Permitido en muchos estados."}],"deep":[{"h":"Financiamiento: por qué fracasan la mayoría de los fideicomisos","body":"\n<p>Merece su propia sección porque es donde de verdad se pierde el dinero. Un fideicomiso solo controla lo que posee.</p>\n<table>\n<tr><th>Bien</th><th>Cómo financiarlo</th></tr>\n<tr><td>Bienes raíces</td><td>Nueva escritura que transfiere el título al fideicomiso, registrada en el condado. Avisa a tu aseguradora y revisa la hipoteca</td></tr>\n<tr><td>Cuentas bancarias</td><td>Retitularlas a nombre del fideicomiso, o usar designaciones pagaderas al fallecer</td></tr>\n<tr><td>Cuenta de corretaje gravable</td><td>Retitularla al fideicomiso — casi todos los brókers tienen un formulario estándar</td></tr>\n<tr><td>Participaciones en negocios</td><td>Cede las participaciones de la LLC o las acciones; revisa el contrato operativo por restricciones de transferencia</td></tr>\n<tr><td>Vehículos</td><td>Muchas veces se dejan fuera a propósito; muchos estados ofrecen título TOD o procedimientos para patrimonios pequeños</td></tr>\n<tr><td>Cuentas de retiro</td><td><strong>No las retitules.</strong> Transferir una IRA a un fideicomiso es una distribución gravable completa. Usa designaciones de beneficiario</td></tr>\n<tr><td>Seguro de vida</td><td>Nombra al fideicomiso como beneficiario, o deja que un ILIT sea dueño directo de la póliza</td></tr>\n<tr><td>Bienes personales</td><td>Una cesión general de bienes muebles tangibles, más un memorándum para artículos específicos</td></tr>\n</table>\n<div class=\"box warn\"><b>Cuentas de retiro y la SECURE Act</b><p>La mayoría de los beneficiarios que no son cónyuges ahora tienen que vaciar una IRA heredada dentro de 10 años, lo que puede forzar distribuciones grandes justo en sus años de mayores ingresos. Nombrar a un fideicomiso como beneficiario complica esto: un fideicomiso <em>conducto</em> pasa las distribuciones directo al beneficiario, mientras que un fideicomiso de <em>acumulación</em> puede retenerlas — pero los tramos fiscales de los fideicomisos se comprimen de forma brutal, llegando a la tasa máxima con apenas unos pocos miles de dólares de ingreso retenido. Si quieres que un fideicomiso reciba bienes de retiro, tiene que estar redactado específicamente para eso.</p></div>\n<p>Financiar no es cosa de una sola vez. Cada cuenta, propiedad o participación de negocio nueva que adquieras necesita quedar titulada correctamente. Ponle un recordatorio recurrente en el calendario.</p>"},{"h":"Cómo se gravan los fideicomisos","body":"\n<p>Tres regímenes, y confundirlos sale caro.</p>\n<ul>\n<li><strong>Fideicomiso de fideicomitente (grantor trust; la mayoría de los revocables).</strong> Invisible ante el fisco. Los ingresos caen en tu declaración personal bajo tu SSN. No hay declaración separada. Algunos fideicomisos irrevocables se redactan a propósito como fideicomisos de fideicomitente (grantor trusts) — un \"intentionally defective grantor trust\" — para que el fideicomitente pague el impuesto sobre la renta, lo cual es en sí mismo un regalo libre de impuestos que deja crecer intactos los bienes del fideicomiso.</li>\n<li><strong>Fideicomiso simple.</strong> Está obligado a repartir todos los ingresos cada año. Los beneficiarios pagan impuestos sobre lo que reciben.</li>\n<li><strong>Fideicomiso complejo.</strong> Puede acumular ingresos. Presenta su propio Form 1041 y paga a tasas de fideicomiso sobre todo lo que retenga.</li>\n</ul>\n<div class=\"box warn\"><b>Tramos comprimidos de los fideicomisos</b><p>Una persona física llega al tramo federal más alto alrededor de los $600k+ de ingreso. Un fideicomiso llega ahí con más o menos $15,000 — y el impuesto de 3.8% sobre ingresos netos de inversión entra en ese mismo umbral bajito. El ingreso retenido en un fideicomiso se grava brutalmente. Por eso los fideicomisos complejos bien manejados normalmente reparten los ingresos a beneficiarios en tramos más bajos, usando la deducción por distribución.</p></div>\n<p>La <strong>revalorización de la base</strong> (step-up in basis) es la otra palanca, y muchas veces vale más que el ahorro en impuesto al patrimonio. Los bienes incluidos en tu patrimonio al morir reinician su base de costo al valor de la fecha de la muerte, borrando toda la ganancia de capital acumulada. Una acción comprada a $20, que vale $200 al morir, pasa a los herederos con una base de $200. Los bienes regalados en vida o pasados a un fideicomiso irrevocable como donación completa por lo general cargan con tu base original.</p>\n<p>Ese dilema es la pregunta central de la planificación patrimonial moderna para la mayoría de las familias: con una exención federal alta, <strong>dejar los bienes revalorizados dentro de tu patrimonio para conseguir el step-up muchas veces le gana a sacarlos para evitar un impuesto al patrimonio que nunca ibas a deber.</strong> Haz los números antes de sacar nada.</p>"},{"h":"Los fideicomisos especializados, y qué resuelve cada uno","body":"\n<table>\n<tr><th>Fideicomiso</th><th>Problema que resuelve</th></tr>\n<tr><td><strong>ILIT</strong></td><td>El beneficio por fallecimiento de un seguro de vida está libre de impuesto sobre la renta, pero cuenta dentro de tu patrimonio gravable si tú eres dueño de la póliza. En su lugar, un ILIT es el dueño, con lo que el dinero queda fuera del patrimonio y aporta liquidez para pagar impuestos sucesorios sin tener que vender el negocio o la finca</td></tr>\n<tr><td><strong>QTIP</strong></td><td>Familias ensambladas. Ingresos para tu cónyuge sobreviviente de por vida, y el capital para los beneficiarios del remanente que tú elijas — normalmente hijos de un matrimonio anterior. Califica para la deducción marital mientras tú mantienes el control de a dónde va todo al final</td></tr>\n<tr><td><strong>Fideicomiso para necesidades especiales</strong></td><td>Complementa la vida de un beneficiario con discapacidad sin contar como recurso suyo para SSI y Medicaid. Los SNT de terceros (financiados por los padres) no tienen reembolso a Medicaid; los SNT de primera parte (financiados con dinero propio del beneficiario) sí</td></tr>\n<tr><td><strong>Fideicomiso caritativo de remanente (CRT)</strong></td><td>Donas un bien revalorizado, evitas las ganancias de capital inmediatas, tomas una deducción parcial, recibes un flujo de ingresos de por vida, y el remanente va a la caridad. Poderoso para acciones concentradas con base baja</td></tr>\n<tr><td><strong>Fideicomiso caritativo de interés inicial (CLT)</strong></td><td>Lo inverso — la caridad recibe ingresos durante un plazo, y luego el remanente pasa a los herederos a un valor descontado para efectos del impuesto de transferencia</td></tr>\n<tr><td><strong>GRAT</strong></td><td>Grantor retained annuity trust. Transfiere a los herederos la revalorización futura por encima de una tasa supuesta por el IRS, con poco o ningún costo de impuesto a las donaciones. Muy efectivo con bienes volátiles y de revalorización rápida</td></tr>\n<tr><td><strong>SLAT</strong></td><td>Spousal lifetime access trust. Usas tu exención de donaciones ahora mientras tu cónyuge conserva acceso indirecto. Común cuando la gente espera que la exención baje. Peligroso en caso de divorcio o de muerte del cónyuge beneficiario</td></tr>\n<tr><td><strong>Fideicomiso dinástico</strong></td><td>Guarda riqueza a lo largo de generaciones minimizando el impuesto de transferencia con salto generacional. Algunos estados permiten duración perpetua</td></tr>\n<tr><td><strong>Fideicomiso de protección de activos (DAPT)</strong></td><td>Fideicomiso irrevocable autoconstituido en estados como Nevada, Dakota del Sur, Delaware o Alaska, que ofrece protección frente a acreedores mientras conservas algún beneficio. Su exigibilidad entre estados está genuinamente sin resolver</td></tr>\n<tr><td><strong>Fideicomiso de protección de activos para Medicaid</strong></td><td>Resguarda bienes del gasto forzoso por cuidados de largo plazo, sujeto a un período de revisión de 5 años. Hay que hacerlo mucho antes de necesitar los cuidados</td></tr>\n</table>"},{"h":"Cómo elegir al fiduciario","body":"\n<p>El documento vale lo mismo que la persona que lo administra, y esta decisión se toma de forma emocional demasiado seguido.</p>\n<p>Un fiduciario tiene un deber fiduciario legal: lealtad a los beneficiarios, manejo prudente de las inversiones, imparcialidad entre los beneficiarios de ingresos y los del remanente, registros detallados, declaraciones de impuestos, y decisiones de reparto que a veces implican decirle que no a un familiar. Es un trabajo de verdad con responsabilidad legal de verdad.</p>\n<table>\n<tr><th>Opción</th><th>A favor</th><th>En contra</th></tr>\n<tr><td>Un familiar</td><td>Gratis, conoce a la familia, tiene interés personal</td><td>Conflictos de interés, sin experiencia técnica, y puede destruir relaciones</td></tr>\n<tr><td>Profesional (abogado, contador)</td><td>Competente, neutral</td><td>Cobra honorarios, puede no tener infraestructura de inversión, y es mortal</td></tr>\n<tr><td>Fiduciario corporativo (banco o compañía fiduciaria)</td><td>Perpetuo, regulado, con experiencia, totalmente imparcial</td><td>Normalmente 0.5–1.5% de los bienes al año, muchas veces con mínimos; puede ser impersonal y rígido</td></tr>\n<tr><td>Cofiduciarios</td><td>Equilibra el conocimiento familiar con la competencia profesional</td><td>Riesgo de empate; define en el documento cómo se desempata</td></tr>\n<tr><td>Fideicomiso dirigido</td><td>Separa los roles — asesor de inversiones, comité de distribución, fiduciario administrativo</td><td>Más complejo, pero cada vez más el estándar para fideicomisos grandes</td></tr>\n</table>\n<div class=\"box\"><b>Nombra a un protector del fideicomiso</b><p>Un <strong>protector del fideicomiso</strong> es un tercero con poderes limitados para remover y reemplazar fiduciarios, modificar cláusulas administrativas, o cambiar la sede legal del fideicomiso. Le construye flexibilidad a un documento irrevocable — lo cual importa, porque tanto la ley fiscal como las circunstancias familiares van a cambiar en las décadas que un fideicomiso puede durar.</p></div>"},{"h":"El paquete completo, y lo que cuesta","body":"\n<p>Un fideicomiso es un documento dentro de un conjunto. Los demás hacen lo que el fideicomiso no puede.</p>\n<ul>\n<li><strong>Fideicomiso revocable en vida</strong> — evitar la sucesión judicial, privacidad, manejo de la incapacidad.</li>\n<li><strong>Testamento complementario (pour-over will)</strong> — recoge los bienes sin financiar y, sobre todo, <strong>nombra tutores para los hijos menores</strong>. Solo un testamento puede hacer eso.</li>\n<li><strong>Poder financiero duradero</strong> — deja que alguien maneje los bienes que están fuera del fideicomiso si quedas incapacitado. Sin él, tu familia puede necesitar una curatela judicial.</li>\n<li><strong>Poder médico y directiva anticipada</strong> — quien toma las decisiones médicas y tus deseos por escrito.</li>\n<li><strong>Autorización HIPAA</strong> — permite que las personas que nombres puedan siquiera acceder a tu información médica. Se olvida con frecuencia, y bloquea a las familias en el peor momento.</li>\n<li><strong>Revisión de las designaciones de beneficiario</strong> — el paso gratis que controla la mayor parte de los bienes de casi todo el mundo.</li>\n<li><strong>Una carta de instrucciones</strong> — no es legalmente vinculante, pero le dice a tu familia dónde están las cuentas, quiénes son los asesores, cómo entrar a las cuentas digitales, y qué es lo que quieres. Haz esto aunque no hagas nada más.</li>\n</ul>\n<p>El costo típico de un abogado por el paquete completo va más o menos de $1,500 a $4,000 para un patrimonio sencillo, y más si hay participaciones en negocios, propiedades en varios estados, o fideicomisos especializados. Compáralo con la sucesión judicial, que en algunos estados se come del 3–7% del patrimonio bruto y tarda un año o más.</p>\n<div class=\"box\"><b>Detonantes de revisión</b><p>Matrimonio, divorcio, nacimiento o adopción, la muerte de alguien que nombraste, mudarte a otro estado (el derecho sucesorio es derecho estatal — una mudanza es un detonante real, no un trámite), un cambio significativo en tus bienes, empezar o vender un negocio, y cualquier cambio grande en la ley federal o estatal de impuestos al patrimonio. Si no pasa nada de eso, una revisión cada 3–5 años es razonable.</p></div>"}]});

    footHome: '<b style="color:var(--tx2)">Solo con fines educativos.</b> Nada de esto es asesoría financiera, fiscal ni legal personalizada — las reglas y las tasas cambian, y tu situación es particular. Úsalo para hacer mejores preguntas.',
    footDetail: 'Solo con fines educativos — no es asesoría financiera, fiscal ni legal personalizada.',
    noMatch: q => `Sin resultados para “${q}”. Prueba con <em style="color:var(--a1)">dividendo</em>, <em style="color:var(--a1)">401k</em>, <em style="color:var(--a1)">seguro temporal</em>, <em style="color:var(--a1)">tasa de capitalización</em>, <em style="color:var(--a1)">crédito de mortalidad</em>, <em style="color:var(--a1)">sucesión</em>…`
  }
};

/* ================= ENGINE ================= */
const $ = id => document.getElementById(id);
let cur = null, mode = 'basics', lang = 'en';

const DATA = () => (lang === 'es' && TOPICS_ES.length ? TOPICS_ES : TOPICS);
const t_ = () => UI[lang === 'es' && TOPICS_ES.length ? 'es' : 'en'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function hashOf(){
  const L = lang === 'es' ? 'es/' : '';
  if (!cur) return '#' + (lang === 'es' ? 'es' : '');
  return '#' + L + cur.id + (mode !== 'basics' ? '/' + mode : '');
}
const syncHash = () => history.replaceState(null, '', hashOf());

function chrome(){
  const u = t_();
  $('eyebrow').textContent = u.eyebrow;
  $('sub').textContent = u.sub;
  $('q').placeholder = u.ph;
  $('byLabel').textContent = u.by;
  $('allBtn').textContent = u.all;
  $('footHome').innerHTML = u.footHome;
  $('footDetail').textContent = u.footDetail;
  const D = DATA();
  let sec = 0, tm = 0;
  D.forEach(t => { sec += t.basics.length + t.deep.length; tm += t.terms.length; });
  $('stat').innerHTML = u.stat(D.length, sec, tm);
  $('langEn').classList.toggle('on', lang === 'en');
  $('langEs').classList.toggle('on', lang === 'es');
  document.documentElement.lang = lang;
}

function renderGrid(filter){
  const u = t_(), f = (filter || '').trim().toLowerCase();
  const list = !f ? DATA() : DATA().filter(t => {
    const hay = (t.name + ' ' + t.tag + ' ' + t.blurb + ' ' +
      t.terms.map(x => x.t + ' ' + x.d).join(' ') + ' ' +
      t.basics.map(s => s.h + ' ' + s.body).join(' ') + ' ' +
      t.deep.map(s => s.h + ' ' + s.body).join(' ')).toLowerCase();
    return hay.includes(f);
  });
  $('grid').innerHTML = list.length ? list.map(t => `
    <button class="tcard" style="--c:${t.c}" onclick="go('${t.id}')">
      <div class="chip">${t.icon}</div>
      <span class="lvl">${t.lvl}</span>
      <h3>${t.name}</h3>
      <p>${t.blurb}</p>
      <span class="go">${u.explore(t.name)} <span>→</span></span>
    </button>`).join('')
    : `<p style="color:var(--tx2);grid-column:1/-1;text-align:center;padding:40px 0">${u.noMatch(esc(f))}</p>`;
}

const block = s => `<div class="sec"><h3>${s.h}</h3>${s.body}</div>`;

function render(){
  const t = cur, u = t_();
  document.documentElement.style.setProperty('--c', t.c);

  $('detailHead').innerHTML = `
    <div class="hero">
      <div class="chip">${t.icon}</div>
      <h2>${t.name}</h2>
      <p class="tag">${t.tag}</p>
    </div>`;

  $('tabs').innerHTML = `
    <button class="${mode==='basics'?'on':''}" onclick="setMode('basics')">${u.tabs[0]}</button>
    <button class="${mode==='terms'?'on':''}" onclick="setMode('terms')">${u.tabs[1]}</button>
    <button class="${mode==='deep'?'on':''}" onclick="setMode('deep')">${u.tabs[2]}</button>`;

  let html = '';
  if (mode === 'basics') {
    html = t.basics.map(block).join('');
    if (t.pitfalls) {
      html += `<div class="sec"><h3>${u.mistakes}</h3><div class="pit">${
        t.pitfalls.map(p => `<div>${p}</div>`).join('')}</div></div>`;
    }
    html += `<div class="ddbanner">
        <div>
          <h4>${u.deeper(t.name)}</h4>
          <p>${t.deepTeaser}</p>
        </div>
        <button class="btn" onclick="setMode('deep')">${u.openDD}</button>
      </div>`;
  } else if (mode === 'terms') {
    html = `<div class="sec"><h3>${u.words}</h3><div class="terms">${
      t.terms.map(x => `<div class="term"><b>${x.t}</b><span>${x.d}</span></div>`).join('')}</div></div>`;
  } else {
    html = `<div style="margin-top:34px"><span class="dd-flag">${u.ddflag} · ${t.name}</span></div>`
      + t.deep.map(block).join('');
  }
  const b = $('body');
  b.className = ''; void b.offsetWidth; b.className = 'fade';
  b.innerHTML = html;

  const D = DATA(), i = D.indexOf(t), n = D[(i + 1) % D.length];
  $('nextBtn').textContent = u.next(n.name);
  $('nextBtn').onclick = () => go(n.id);

  const label = mode === 'terms' ? u.crumbTerms : mode === 'deep' ? u.crumbDeep : null;
  $('crumbs').innerHTML = `<button onclick="go(null)">${u.home}</button><span>/</span>`
    + (label ? `<button onclick="setMode('basics')">${t.name}</button><span>/</span><span class="now">${label}</span>`
             : `<span class="now">${t.name}</span>`);
}

function setMode(m){
  mode = m; render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  syncHash();
}

function setLang(l){
  if (l === lang) return;
  if (l === 'es' && !TOPICS_ES.length) return;
  lang = l;
  const id = cur ? cur.id : null;
  chrome();
  if (id) { cur = DATA().find(x => x.id === id) || null; }
  if (cur) render(); else renderGrid($('q').value = '');
  syncHash();
}

function go(id, keepMode){
  if (!id) {
    cur = null; mode = 'basics';
    $('home').classList.remove('hide'); $('detail').classList.add('hide');
    $('homeHead').classList.remove('hide'); $('detailHead').classList.add('hide');
    $('tabbar').classList.add('hide'); $('byline').classList.remove('hide');
    document.body.classList.remove('reading');
    document.documentElement.style.setProperty('--c', '#4c8dff');
    $('crumbs').innerHTML = ''; syncHash();
    window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  const nx = DATA().find(t => t.id === id); if (!nx) return go(null);
  if (nx !== cur) mode = keepMode ? mode : 'basics';
  cur = nx;
  $('home').classList.add('hide'); $('detail').classList.remove('hide');
  $('homeHead').classList.add('hide'); $('detailHead').classList.remove('hide');
  $('tabbar').classList.remove('hide'); $('byline').classList.add('hide');
  document.body.classList.add('reading');
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  syncHash();
}

$('q').addEventListener('input', e => renderGrid(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('q') && !cur) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape') { if (cur) go(null); else { $('q').value = ''; renderGrid(''); } }
});

(function init(){
  const parts = location.hash.replace('#', '').split('/').filter(Boolean);
  if (parts[0] === 'es' || parts[0] === 'en') { if (parts[0] === 'es' && TOPICS_ES.length) lang = 'es'; parts.shift(); }
  chrome();
  renderGrid('');
  if (parts[0] && DATA().some(t => t.id === parts[0])) { mode = parts[1] || 'basics'; go(parts[0], true); }
})();
</script>
</body>
</html>
