ong>Horario extendido.</strong> La negociación pre-mercado y after-hours tiene una fracción del volumen y spreads mucho más amplios. Solo órdenes límite, y entiende que un precio impreso after-hours es una señal débil de dónde va a abrir la acción.</p></div>"},{"h":"Leer una empresa: los cuatro números que importan","body":"\n<p>No necesitas un título en finanzas. Necesitas responder cuatro preguntas, y cada una tiene un número asociado que está en el reporte trimestral de la empresa (gratis en sec.gov, y resumido en el sitio de cualquier bróker).</p>\n<ul>\n<li><strong>¿Está creciendo?</strong> El crecimiento de ingresos año contra año. Mira tres a cinco años, no un trimestre — un trimestre es ruido.</li>\n<li><strong>¿El crecimiento se convierte en efectivo?</strong> <em>Flujo de caja libre</em> (free cash flow) — el efectivo de las operaciones menos el gasto de capital. Este es el número más difícil de maquillar. La utilidad neta es una opinión contable; el flujo de caja libre se parece más a un hecho. Una empresa con ingresos subiendo y flujo de caja libre bajando es una bandera amarilla.</li>\n<li><strong>¿Cuánto estoy pagando por ella?</strong> El P/E (precio ÷ ganancias por acción) es el rápido. Su debilidad: no significa nada para empresas sin utilidades y se distorsiona con cargos únicos. El <em>EV/EBITDA</em> maneja mejor la deuda; el <em>P/FCF</em> suele ser el más honesto. Compara una empresa con su propia historia y con sus competidores directos — nunca con el mercado entero.</li>\n<li><strong>¿Puede sobrevivir un mal año?</strong> La relación deuda/capital y el ratio de cobertura de intereses (utilidad operativa ÷ gasto por intereses). Una cobertura por debajo de unas 3x en un negocio cíclico significa que una desaceleración se pone peligrosa.</li>\n</ul>\n<p>Después viene la mitad cualitativa, que importa más que los ratios: <strong>¿qué impide que un competidor se quede con este negocio?</strong> Costos de cambio, efectos de red, una marca de verdad, patentes, una posición regulatoria o una red física que no se puede reconstruir. Esa ventaja duradera es lo que Buffett llamaba un foso (moat), y es la diferencia entre un buen negocio y un buen trimestre.</p>\n<div class=\"box\"><b>Prueba de sensatez sobre el P/E</b><p>Un P/E de 30 significa que pagas $30 por $1 de ganancia anual actual. Eso solo es racional si la ganancia crece mucho de aquí en adelante. Un P/E de 8 normalmente significa que el mercado espera que las ganancias caigan. Ningún número es bueno o malo por sí solo — es una afirmación sobre expectativas, y tu ventaja está en estar en desacuerdo con esas expectativas y tener razón.</p></div>"},{"h":"El tamaño de las posiciones y el riesgo — la parte que de verdad decide los resultados","body":"\n<p>La mayoría de la gente se obsesiona con qué comprar y casi no piensa en cuánto. El tamaño de las posiciones es donde las carteras realmente se hacen o se destruyen.</p>\n<p><strong>La asimetría que arruina cuentas:</strong> una pérdida de 50% requiere una ganancia de 100% para volver a quedar tablas. ¿Abajo 80%? Necesitas 400%. Por eso evitar pérdidas catastróficas en una sola posición importa más que atrapar ganadores.</p>\n<table>\n<tr><th>Regla práctica</th><th>Qué significa en la práctica</th></tr>\n<tr><td>Tope por nombre</td><td>Ninguna acción individual por encima de más o menos 5% de la cartera, salvo que tengas una razón fuerte. Al 5%, una pérdida total te cuesta 5%. Sobrevivible.</td></tr>\n<tr><td>Revisión de correlación</td><td>Cuenta exposiciones, no tickers. Cuatro ferrocarriles son una sola apuesta al volumen de carga. Las acciones de tu empleador más tu sueldo más tu pensión son triple exposición a una sola empresa — un problema real si trabajas en una sola industria.</td></tr>\n<tr><td>Rebalanceo</td><td>Una o dos veces al año, vende lo que creció por encima de su objetivo y compra lo que se quedó atrás. Mecánicamente te obliga a vender caro y comprar barato, y evita que el riesgo se vaya subiendo solo conforme los ganadores toman el control.</td></tr>\n<tr><td>El efectivo como posición</td><td>El efectivo no es peso muerto — es opcionalidad. Tener pólvora seca en un desplome vale más que el rendimiento al que renunciaste.</td></tr>\n</table>\n<p>Además, conoce la forma histórica de aquello a lo que te estás apuntando: el mercado de EE. UU. ha promediado más o menos 10% al año nominal en el largo plazo, pero ha entregado caídas de 50%+ varias veces, con recuperaciones que van de meses a más de una década. El promedio está hecho de extremos. Cualquier plan que no puedas aguantar durante una caída de 40% no es un plan.</p>"},{"h":"Impuestos — la comisión silenciosa","body":"\n<p>En una cuenta de corretaje gravable, el IRS es un socio silencioso. El periodo de tenencia es la palanca que tú controlas.</p>\n<table>\n<tr><th></th><th>Corto plazo</th><th>Largo plazo</th></tr>\n<tr><td>Periodo de tenencia</td><td>Un año o menos</td><td>Más de un año</td></tr>\n<tr><td>Se grava como</td><td>Ingreso ordinario — tu tramo normal</td><td>Tasas preferenciales de ganancias de capital (niveles de 0/15/20%, según el ingreso)</td></tr>\n</table>\n<p>Para mucha gente eso es una diferencia de 10 a 20 puntos porcentuales sobre la misma utilidad, puramente por el calendario. Vender un ganador a los 11 meses es una costumbre cara.</p>\n<ul>\n<li><strong>Cosecha de pérdidas fiscales (tax-loss harvesting).</strong> Las pérdidas realizadas compensan ganancias realizadas, y hasta $3,000 de ingreso ordinario al año, con el resto arrastrado hacia adelante indefinidamente. Vender un perdedor puede valer dinero de verdad.</li>\n<li><strong>La regla de wash sale.</strong> Si compras el mismo valor o uno \"sustancialmente idéntico\" dentro de los 30 días antes o después de vender con pérdida, la pérdida queda anulada por ahora y se suma a la nueva base de costo. La ventana de 30 días corre en las dos direcciones, y aplica entre todas tus cuentas — incluida una IRA, donde la pérdida se destruye para siempre.</li>\n<li><strong>Dividendos calificados vs. ordinarios.</strong> Los dividendos calificados reciben tasas de ganancias de capital si has tenido la acción el tiempo suficiente. Las distribuciones de REIT y de la mayoría de los fondos de bonos son ingreso ordinario — que es la razón por la que esas cosas suelen pertenecer a una cuenta con protección fiscal.</li>\n<li><strong>Método de base de costo.</strong> Configura tu bróker en \"identificación específica\" en vez de FIFO. Te deja elegir qué lotes fiscales vender, y eso es dinero gratis a la hora de declarar.</li>\n</ul>\n<div class=\"box\"><b>Ubicación de activos</b><p>Las mismas inversiones, en cuentas distintas, dan un resultado distinto. Lo fiscalmente ineficiente — REITs, bonos de alto rendimiento, posiciones que operas activamente — pertenece a una IRA o a un 401(k). Los fondos indexados amplios, que generan poco ingreso gravable, están bien en una cuenta gravable. Esta sola decisión estructural vale más a lo largo de 20 años que la mayoría de las selecciones de acciones.</p></div>"},{"h":"Cómo funcionan realmente los fondos indexados y los ETF","body":"\n<p>Un ETF tiene una canasta. El precio de su acción debería ser igual al valor de esa canasta por acción (el <em>NAV</em>), y se mantiene ahí gracias a un mecanismo que casi nadie ve nunca: los <strong>participantes autorizados</strong>. Son firmas grandes que pueden crear nuevas acciones del ETF entregando la canasta subyacente, o redimir acciones para recuperar la canasta. Si el ETF cotiza por encima del NAV, crean y venden; por debajo, compran y redimen. El arbitraje mantiene el precio pegado al valor — y, como efecto secundario, deja que los ETF se deshagan de posiciones apreciadas sin detonar ganancias de capital, que es por lo que los ETF suelen ser más eficientes fiscalmente que los fondos mutuos.</p>\n<table>\n<tr><th></th><th>ETF</th><th>Fondo mutuo indexado</th></tr>\n<tr><td>Negociación</td><td>Todo el día, como una acción</td><td>Una vez al día, en el cierre de las 4pm</td></tr>\n<tr><td>Eficiencia fiscal</td><td>Normalmente más alta (redenciones en especie)</td><td>Puede repartir ganancias de capital que tú no pediste</td></tr>\n<tr><td>Mínimos</td><td>Una acción, o una fracción</td><td>A veces $1,000–$3,000</td></tr>\n<tr><td>Automatización</td><td>Depende del bróker</td><td>Inversión recurrente automática, fácil</td></tr>\n</table>\n<p>Qué revisar de verdad antes de comprar un fondo: el <strong>ratio de gastos</strong> (por debajo de 0.20% para cualquier cosa de mercado amplio; no hay excusa por encima de eso), la <strong>diferencia de seguimiento</strong> (qué tanto se desvía de su índice), los <strong>activos bajo gestión</strong> (a los fondos chicos los cierran y los liquidan) y <strong>qué hay realmente adentro</strong>. Un montón de ETF temáticos tienen nombres emocionantes y adentro traen las mismas siete tecnológicas mega-cap que ya tienes de otras tres formas. Lee siempre las 10 posiciones principales.</p>\n<div class=\"box warn\"><b>Evítalos salvo que sepas exactamente lo que estás haciendo</b><p>Los <strong>ETF apalancados e inversos</strong> (2x, 3x, \"short S&P\") reinician su apalancamiento todos los días. En cualquier periodo más largo que un día, el desgaste por volatilidad hace que puedan perder dinero incluso si el índice subyacente termina donde empezó. Son instrumentos de trading, no inversiones.</p></div>"},{"h":"Opciones, en un párrafo honesto cada una","body":"\n<p>Una <strong>opción</strong> es un contrato que te da el derecho — no la obligación — de comprar (una <em>call</em>) o vender (una <em>put</em>) 100 acciones a un <em>precio de ejercicio</em> fijo antes de una <em>fecha de vencimiento</em> fija. Pagas una <em>prima</em> por ese derecho. Las opciones se usan para tres propósitos genuinamente distintos, y confundirlos es la forma en que la gente sale lastimada.</p>\n<ul>\n<li><strong>Cobertura.</strong> Comprar una put sobre algo que ya tienes es un seguro de cartera — le pones tope a tu caída y la prima es el costo de la póliza. Legítimo, conservador, y el propósito original del instrumento.</li>\n<li><strong>Ingreso.</strong> Vender una <em>call cubierta</em> (covered call) contra acciones que ya tienes cobra una prima a cambio de ponerle tope a tu ganancia por encima del strike. Una estrategia real con un intercambio real: te pagan ahora y renuncias al movimiento grande si llega.</li>\n<li><strong>Especulación.</strong> Comprar calls de corto plazo fuera del dinero porque crees que una acción va a saltar esta semana. Esto es apalancamiento más un reloj en cuenta regresiva. El desgaste por tiempo (<em>theta</em>) juega en tu contra todos y cada uno de los días, y la mayoría de estas expiran sin valor. Puede ser entretenido; no es invertir, y debería ser dinero que estás totalmente preparado para perder.</li>\n</ul>\n<p>Vender opciones <em>desnudas</em> — calls sin ser dueño de las acciones — conlleva una pérdida teóricamente ilimitada. Los brókers ponen esto detrás de niveles de aprobación por una buena razón. Si de plano vas a entrar aquí, pasa primero por calls cubiertas y puts respaldadas con efectivo, en tamaño pequeño, y entiende la volatilidad implícita antes de operar un solo contrato.</p>"},{"h":"La ventaja conductual","body":"\n<p>La brecha entre lo que rinden los fondos y lo que de verdad ganan los inversionistas que están en esos fondos ronda uno a dos puntos porcentuales al año, y es enteramente conductual — la gente compra después de las subidas y vende después de las caídas. Cada dólar de esa brecha es autoinfligido.</p>\n<ul>\n<li><strong>Aversión a la pérdida.</strong> Perder $1,000 duele como el doble de lo que se siente bien ganar $1,000. Por eso la gente se aferra a los perdedores esperando quedar tablas y vende temprano a los ganadores para asegurar una sensación.</li>\n<li><strong>Sesgo de lo reciente.</strong> Lo que acaba de pasar se siente como lo que va a pasar después. Por eso las entradas de dinero a los fondos llegan a su máximo cerca de los techos.</li>\n<li><strong>Sesgo de confirmación.</strong> Una vez que ya eres dueño, lees la tesis alcista y te saltas la bajista. El arreglo es mecánico: antes de comprar, escribe las tres cosas que probarían que estás equivocado, y revísalas con un calendario.</li>\n<li><strong>Sesgo de acción.</strong> No hacer nada se siente irresponsable. En la inversión, no hacer nada es con frecuencia la jugada de mayor valor esperado que tienes disponible.</li>\n</ul>\n<div class=\"box\"><b>Los sistemas le ganan a la fuerza de voluntad</b><p>Aportaciones automáticas, rebalanceo calendarizado, una tesis escrita por cada posición y una declaración de política de inversión que escribiste estando tranquilo. Eso saca la decisión del momento en que tu juicio está en su peor forma. Esa es la ventaja real disponible para un inversionista individual — no la información, no la velocidad. El temperamento, impuesto por la estructura.</p></div>"}]});
TOPICS_ES.push({"id":"bonds","icon":"🏦","c":"#2ec4a6","lvl":"Fundamentos","name":"Bonos","tag":"Un bono es un préstamo que haces, no uno que pides. Tú eres el banco, y quien pide prestado te paga intereses.","blurb":"Prestar dinero a cambio de intereses. Cómo funcionan los rendimientos, por qué los precios de los bonos caen cuando suben las tasas, y qué lugar les corresponde en una cartera.","deepTeaser":"Duración y riesgo de tasa de interés, la curva de rendimientos, la escalera crediticia, TIPS y bonos I, municipales y la cuenta del rendimiento equivalente a impuestos, y cómo armar una escalera.","basics":[{"h":"Qué es un bono","body":"\n<p>Dale la vuelta a la hipoteca de tu casa. Tú pides prestado, tú pagas intereses, el banco cobra. Un <strong>bono</strong> te pone del lado del banco en ese trato. Un gobierno o una empresa necesita dinero, así que se lo pide prestado a inversionistas y se compromete por escrito a pagar intereses según un calendario y a devolver el monto original en una fecha específica.</p>\n<p>Tres números definen a casi cualquier bono:</p>\n<ul>\n<li><strong>Valor nominal (par)</strong> — el monto que se devuelve al final, normalmente $1,000 por bono.</li>\n<li><strong>Cupón</strong> — la tasa de interés anual, casi siempre pagada en dos cuotas. Un cupón de 5% sobre un bono de $1,000 paga $50 al año, $25 dos veces al año.</li>\n<li><strong>Vencimiento</strong> — la fecha en que recuperas tus $1,000. Pueden ser 90 días o pueden ser 30 años.</li>\n</ul>\n<p>Si lo mantienes hasta el vencimiento y no hay impago, sabes tu resultado exacto desde el día que lo compras. Esa certeza es todo el producto. Las acciones no prometen nada parecido.</p>\n<div class=\"box\"><b>Por qué alguien los tiene</b><p>Las acciones sirven para hacer crecer el dinero. Los bonos sirven para conservarlo y generar ingresos predecibles. Una cartera que tiene ambos suele caer menos en los años malos, y eso no es solo consuelo emocional: significa que es menos probable que vendas tus acciones en el fondo.</p></div>"},{"h":"La única regla contraintuitiva","body":"\n<p><strong>Cuando las tasas de interés suben, los precios de los bonos existentes bajan.</strong> Todo el mundo tropieza con esto una vez. Aquí está por qué tiene que ser así.</p>\n<p>Compras un bono de $1,000 que paga 3%. Seis meses después, bonos nuevos de la misma calidad pagan 5%. Nadie te va a pagar el precio completo por un bono al 3% cuando puede conseguir 5% en otro lado, así que para vender el tuyo tienes que descontarlo hasta que el retorno efectivo del comprador iguale ese 5%. Tu bono ahora vale quizá $850.</p>\n<p>Nada salió mal. El emisor está bien, y si lo mantienes hasta el vencimiento igual recibes tus $1,000 y cada cupón. Pero el valor de mercado cayó, y si necesitas vender antes, esa pérdida es real.</p>\n<div class=\"box warn\"><b>Esto no es teórico</b><p>En 2022, mientras la Fed subía las tasas al ritmo más rápido en décadas, el mercado total de bonos de EE. UU. perdió cerca de 13%: su peor año registrado. \"Seguro\" significa que el emisor te va a pagar, no que el precio no pueda caer.</p></div>\n<p>Mientras más largo el vencimiento, mayor el vaivén. Un bono a 30 años puede moverse con violencia ante un cambio de tasas; una letra del Tesoro a 3 meses apenas se inmuta. Esa sensibilidad tiene nombre — <em>duración</em> — y es lo primero que verás en el análisis a fondo.</p>"},{"h":"Los tipos principales, del más seguro al más riesgoso","body":"\n<table>\n<tr><th>Tipo</th><th>Quién te debe</th><th>Característica clave</th></tr>\n<tr><td>Letras, notas y bonos del Tesoro</td><td>Gobierno federal de EE. UU.</td><td>El referente de lo \"libre de riesgo\". Los intereses están exentos de impuestos estatales y locales.</td></tr>\n<tr><td>TIPS</td><td>Gobierno de EE. UU.</td><td>El principal se ajusta con la inflación. Protege el poder adquisitivo, no solo los dólares.</td></tr>\n<tr><td>Bonos de ahorro Serie I</td><td>Gobierno de EE. UU.</td><td>Se compran directo en TreasuryDirect. La tasa sigue a la inflación. Tope de $10,000 por persona al año.</td></tr>\n<tr><td>Bonos municipales</td><td>Estados, ciudades, agencias</td><td>Los intereses suelen estar libres de impuesto federal, y de impuesto estatal en tu propio estado. Muy potentes si estás en un tramo impositivo alto.</td></tr>\n<tr><td>Corporativos de grado de inversión</td><td>Empresas sólidas</td><td>Más rendimiento que los del Tesoro a cambio de un riesgo de impago real, aunque modesto.</td></tr>\n<tr><td>Alto rendimiento (\"basura\")</td><td>Empresas más débiles</td><td>Rendimientos grandes, riesgo de impago significativo, y tienden a caer cuando caen las acciones: justo cuando necesitabas el lastre estabilizador.</td></tr>\n</table>\n<p>Las agencias calificadoras (Moody's, S&amp;P, Fitch) califican la calidad crediticia. De AAA hasta BBB− es grado de inversión; BB+ y por debajo es alto rendimiento. La calificación es un atajo útil y también imperfecto: las agencias se equivocaron de forma espectacular con los bonos hipotecarios en 2008.</p>"},{"h":"Cómo comprar y vender","body":"\n<ol class=\"steps\">\n<li><b>El camino más fácil: un fondo de bonos o un ETF</b> Una sola compra en tu cuenta de corretaje normal te da una canasta diversificada: cientos o miles de bonos. Existen fondos amplios de mercado total de bonos, fondos de Tesoro de corto plazo y fondos municipales con ratios de gastos cercanos a 0.05%. Diversificación instantánea, liquidez diaria y sin mínimo más allá de una acción.</li>\n<li><b>Bonos del Tesoro individuales, directo</b> TreasuryDirect.gov vende directamente del gobierno, sin comisión y sin intermediarios. También es el único lugar para comprar bonos Serie I. El sitio está anticuado, pero funciona.</li>\n<li><b>Bonos individuales a través de tu corredor</b> Fidelity, Schwab y Vanguard tienen mesas de bonos donde puedes comprar nuevas emisiones y bonos del mercado secundario. Los bonos del Tesoro de nueva emisión normalmente no cobran comisión; los corporativos y municipales llevan un margen incorporado en el precio.</li>\n<li><b>Vender antes del vencimiento</b> Los fondos de bonos se venden como cualquier ETF o fondo mutuo. Los bonos individuales se negocian fuera de bolsa, y el diferencial en un lote minorista pequeño puede ser amplio: un costo real. Si podrías necesitar el dinero antes, prefiere fondos o vencimientos cortos.</li>\n</ol>\n<div class=\"box\"><b>Fondo vs. bono individual: la diferencia de verdad</b><p>Un bono individual tiene fecha de vencimiento, así que puedes aguantar una caída de precio y recuperar tu valor nominal. Un fondo de bonos nunca vence: se renueva perpetuamente hacia bonos nuevos, así que su precio puede quedarse abajo. A cambio, el fondo te da diversificación y liquidez, y su rendimiento sube a medida que compra bonos nuevos con tasas más altas. Para la mayoría de la gente, ganan los fondos. Para un gasto específico y conocido en una fecha específica, un bono individual que venza ese año es más limpio.</p></div>"},{"h":"Cuánto deberías tener","body":"\n<p>La vieja regla general era \"tu edad en bonos\": 40 años, 40% en bonos. Hoy casi todos los planificadores la consideran demasiado conservadora, dado que vivimos más; algo como tu edad menos 20 es un punto de partida más común. Ninguna de las dos es ley.</p>\n<p>Lo que de verdad decide la respuesta es <strong>cuándo necesitas el dinero</strong> y <strong>qué puedes tolerar</strong>. El dinero que necesitas en dos años no va en acciones, punto. El dinero que no vas a tocar en 25 años puede estar mayormente en acciones. Y una cartera que de verdad vas a mantener en una caída le gana a una teóricamente óptima de la que te bajas.</p>\n<p>Un uso más que vale la pena nombrar: con los rendimientos del Tesoro de corto plazo en niveles significativos, las letras del Tesoro y los fondos de mercado monetario se han vuelto un lugar legítimo para estacionar un fondo de emergencia o el enganche de una casa: seguros, líquidos y pagando intereses reales en vez del casi cero que te ofrece tu cuenta corriente.</p>"}],"pitfalls":["Suponer que \"los bonos son seguros\" significa que el precio no puede caer. El riesgo de crédito y el riesgo de tasa de interés son dos riesgos distintos, y el de tasas es el que sorprendió a la gente en 2022.","Estirarte por rendimiento. Si un bono paga notablemente más que los del Tesoro de vencimiento similar, el mercado te está diciendo algo sobre quien pide prestado. Ese rendimiento extra es compensación por riesgo, no un almuerzo gratis.","Tener bonos municipales dentro de una IRA. Renuncias a la exención fiscal que pagaste en forma de un rendimiento más bajo.","Comprar bonos de larga duración con dinero de corto plazo. Un fondo de bonos a 20 años no es una cuenta de ahorros.","Ignorar la inflación. Un rendimiento de 3% con inflación de 4% es una pérdida garantizada de poder adquisitivo, disfrazada de ganancia.","Perseguir fondos de bonos de alto rendimiento por el ingreso. Se correlacionan con las acciones en una caída, así que fallan justo en el trabajo por el que compraste bonos."],"terms":[{"t":"Par / Valor nominal","d":"El monto que se devuelve al vencimiento, normalmente $1,000 por bono."},{"t":"Cupón","d":"La tasa de interés anual declarada, normalmente pagada de forma semestral."},{"t":"Rendimiento al vencimiento (YTM)","d":"Tu retorno anualizado real si compras al precio de hoy y mantienes hasta el final. El número que de verdad importa, no el cupón."},{"t":"Rendimiento corriente","d":"El cupón anual dividido entre el precio actual. Una foto rápida e incompleta."},{"t":"Duración","d":"Sensibilidad a los cambios de tasas. Una duración de 7 significa aproximadamente una caída de precio de 7% por cada alza de 1% en las tasas."},{"t":"Calificación crediticia","d":"La nota que una agencia le pone al riesgo de impago. De AAA a BBB− es grado de inversión; por debajo de eso es alto rendimiento."},{"t":"Diferencial (spread)","d":"Rendimiento extra sobre un bono del Tesoro comparable. Es el precio del riesgo de crédito, y se amplía cuando los mercados se asustan."},{"t":"Redimible (callable)","d":"El emisor puede pagar antes de tiempo, normalmente justo cuando las tasas bajan y tú preferirías quedarte con el bono. Te compensan con un cupón más alto."},{"t":"Curva de rendimientos","d":"Una gráfica del rendimiento contra el vencimiento. Normalmente tiene pendiente ascendente; una inversión de la curva históricamente ha precedido a las recesiones."},{"t":"TIPS","d":"Treasury Inflation-Protected Securities. El principal sube con el CPI."},{"t":"Escalonamiento (laddering)","d":"Comprar bonos que vencen en años escalonados para que el efectivo regrese con regularidad y no estés apostando a un solo entorno de tasas."},{"t":"Cupón vs. rendimiento","d":"El cupón queda fijo al momento de la emisión. El rendimiento se mueve con el precio que de verdad pagas."},{"t":"Intereses devengados","d":"Intereses ganados pero aún no pagados. Si compras a mitad del periodo, se los reembolsas al vendedor."},{"t":"Bono cupón cero","d":"No paga nada hasta el vencimiento; lo compras con un descuento profundo. Sensibilidad máxima a las tasas."}],"deep":[{"h":"Duración: el número que predice tu dolor","body":"\n<p>La duración se expresa en años, pero en realidad es una medida de sensibilidad. La <strong>duración modificada</strong> aproxima el cambio porcentual del precio ante un cambio de 1% en las tasas.</p>\n<table>\n<tr><th>Posición</th><th>Duración aprox.</th><th>Impacto en el precio si las tasas suben 1%</th></tr>\n<tr><td>Letra del Tesoro a 3 meses</td><td>0.25</td><td>−0.25%</td></tr>\n<tr><td>Bono del Tesoro a 2 años</td><td>~1.9</td><td>−1.9%</td></tr>\n<tr><td>Fondo de mercado total de bonos</td><td>~6</td><td>−6%</td></tr>\n<tr><td>Fondo de Tesoro a más de 20 años</td><td>~16</td><td>−16%</td></tr>\n<tr><td>Cupón cero a 30 años</td><td>30</td><td>−30%</td></tr>\n</table>\n<p>Este es el número más útil que puedes aprender sobre bonos, y casi nadie lo revisa antes de comprar un fondo de bonos. Está publicado en la página de cada fondo. Si conoces tu duración, conoces tu peor escenario ante un shock de tasas.</p>\n<p>Dos matices. La <strong>convexidad</strong> significa que la relación es curva, no lineal: los precios suben un poco más cuando las tasas bajan de lo que caen cuando las tasas suben lo mismo, y eso juega a tu favor. Y <strong>la duración también es tu horizonte de recuperación</strong>: en un entorno de tasas al alza, un fondo con duración 6 queda más o menos a mano después de unos seis años, porque los cupones reinvertidos ahora ganan la tasa más alta. Las pérdidas en un fondo de bonos son temporales si tu periodo de tenencia supera su duración.</p>\n<div class=\"box\"><b>La regla práctica</b><p>Empata la duración con tu horizonte de tiempo. ¿Necesitas el dinero en 3 años? Duración cerca de 3. ¿Te jubilas en 20? Puedes cargar más. El desajuste es lo que convierte un activo seguro en una mala experiencia.</p></div>"},{"h":"La curva de rendimientos y lo que te está diciendo","body":"\n<p>Grafica el rendimiento en el eje vertical y el vencimiento en el horizontal, y obtienes la <strong>curva de rendimientos</strong>. Su forma es una de las señales más observadas de las finanzas.</p>\n<ul>\n<li><strong>Normal (pendiente ascendente).</strong> El dinero prestado a más plazo paga más, compensándote por el tiempo y la incertidumbre. Este es el estado sano por defecto.</li>\n<li><strong>Plana.</strong> Los rendimientos cortos y largos convergen. El mercado no tiene claro el rumbo del crecimiento.</li>\n<li><strong>Invertida.</strong> Los rendimientos de corto plazo superan a los de largo plazo. Esto dice que el mercado espera que el banco central recorte tasas pronto, lo que normalmente significa que espera debilidad económica. Una curva invertida de 10 años/2 años ha precedido a todas las recesiones de EE. UU. del último medio siglo, aunque con anticipaciones que van de unos 6 a 24 meses y con al menos una señal falsa.</li>\n</ul>\n<p>Detrás de la forma hay tres fuerzas: las expectativas sobre las tasas cortas futuras, una <em>prima por plazo</em> que se paga por inmovilizar el dinero, y la oferta y demanda del Tesoro, la Fed, los bancos centrales extranjeros y los fondos de pensiones. La Fed controla directamente solo el tramo más corto; el tramo largo es el pronóstico colectivo del mercado.</p>\n<div class=\"box warn\"><b>No operes solo con eso</b><p>Una inversión de la curva es una señal sobre probabilidad, no sobre el momento exacto. Los mercados han seguido subiendo por un año o más después de una inversión. Sirve para calibrar expectativas y duración, no para anunciar un techo.</p></div>"},{"h":"El riesgo de crédito y el rendimiento que te pagan por él","body":"\n<p>El rendimiento de cualquier bono se puede descomponer: la tasa libre de riesgo del Tesoro al mismo vencimiento, más un <strong>diferencial de crédito</strong> que te compensa por la posibilidad de que no te paguen.</p>\n<p>Las tasas históricas de impago anual rondan una fracción de un punto porcentual para los emisores de grado de inversión y unos pocos puntos porcentuales para el alto rendimiento, pero esos promedios esconden el patrón que sí importa: los impagos se concentran en las recesiones, justo cuando tus acciones también están abajo. Esa concentración es la razón por la que los bonos de alto rendimiento fracasan como lastre estabilizador de una cartera. Se entienden mejor como riesgo de acciones con etiqueta de bono.</p>\n<p>Las <strong>tasas de recuperación</strong> también importan. La deuda senior garantizada históricamente ha recuperado una parte sustancial del valor nominal en una quiebra; la deuda subordinada, mucho menos. El lugar que ocupas en la estructura de capital —senior garantizada, senior no garantizada, subordinada, preferente, acciones comunes— determina quién cobra primero cuando no alcanza para todos. Los accionistas van al final, siempre.</p>\n<p>Observa los diferenciales como termómetro del miedo en todo el mercado. Cuando los diferenciales del alto rendimiento sobre los bonos del Tesoro se comprimen hacia mínimos históricos, a los inversionistas les están pagando muy poco por tomar un riesgo real: un momento razonable para ser cauteloso. Cuando se disparan a 8, 10 o 15 puntos, el pánico ya está en el precio, y ese ha sido históricamente el momento en que los retornos futuros del crédito han sido mejores. Incómodo, como siempre.</p>"},{"h":"Protección contra la inflación: TIPS y bonos I","body":"\n<p>Un bono normal promete dólares. No promete nada sobre lo que esos dólares podrán comprar. Dos instrumentos arreglan eso.</p>\n<p><strong>TIPS.</strong> El principal se ajusta con el CPI. La tasa del cupón es fija, pero se aplica al principal ajustado, así que tanto tu pago de intereses como tu devolución final suben con la inflación. El rendimiento cotizado de un TIPS es un rendimiento <em>real</em>: tu retorno por encima de la inflación. La brecha entre el rendimiento de un bono del Tesoro nominal y el de un TIPS del mismo vencimiento es la inflación que el mercado espera, llamada el <em>breakeven</em> o punto de equilibrio. Compra TIPS si crees que la inflación real va a superar ese breakeven.</p>\n<div class=\"box warn\"><b>La rareza fiscal de los TIPS</b><p>El ajuste anual del principal por inflación paga impuesto federal en el año en que ocurre, aunque no recibas ese efectivo hasta el vencimiento. Este \"ingreso fantasma\" es la razón por la que normalmente conviene tener los TIPS dentro de una IRA o un 401(k).</p></div>\n<p><strong>Bonos de ahorro Serie I.</strong> Se compran solo en TreasuryDirect. La tasa combina un componente fijo (bloqueado durante toda la vida del bono) con un componente de inflación que se reajusta cada seis meses. El límite es de $10,000 por persona por año calendario. No puedes redimirlos en los primeros 12 meses, y redimirlos antes de los 5 años te cuesta los últimos 3 meses de intereses. El impuesto es solo federal y se difiere hasta que sacas el dinero. Para una capa de fondo de emergencia más allá de tus primeros meses de efectivo, son difíciles de superar.</p>"},{"h":"Bonos municipales y la cuenta que lo decide","body":"\n<p>Los intereses de los bonos municipales generalmente están exentos del impuesto federal sobre la renta, y del impuesto estatal si compras bonos emitidos en tu propio estado. Así que un municipal al 3.5% puede ganarle a un corporativo al 4.5%: depende por completo de tu tramo impositivo.</p>\n<div class=\"box\"><b>Rendimiento equivalente a impuestos</b><p><strong>TEY = rendimiento del municipal ÷ (1 − tu tasa impositiva marginal)</strong></p><p>Un municipal al 3.5% en el tramo federal de 32%: 0.035 ÷ 0.68 = <strong>5.15%</strong> equivalente a impuestos. Eso le gana con holgura a un corporativo gravable al 4.5%. El mismo municipal en el tramo de 12%: 3.98%, y ahora gana el corporativo. Los municipales son un instrumento para tramos altos; haz esta cuenta en vez de suponer.</p></div>\n<p>Dos categorías: los bonos de <strong>obligación general</strong>, respaldados por la capacidad de cobrar impuestos del emisor, y los bonos de <strong>ingresos</strong>, respaldados solo por los ingresos de un proyecto específico: una autopista de peaje, un estadio, un hospital. Los bonos de ingresos cargan con el riesgo del proyecto, no con la plena fe del gobierno. Las tasas de impago de los municipales de grado de inversión históricamente han sido muy bajas, pero Detroit y Puerto Rico son recordatorios de que \"muy bajas\" no es \"cero\".</p>\n<p>Una trampa: los intereses municipales cuentan en el cálculo que determina qué parte de tu Seguro Social paga impuestos, y pueden afectar los recargos IRMAA de Medicare. \"Libre de impuestos\" no siempre es completamente libre.</p>"},{"h":"Cómo armar una escalera","body":"\n<p>Una <strong>escalera de bonos</strong> es un conjunto de bonos individuales que vencen en años consecutivos. Digamos $60,000 divididos en seis peldaños de $10,000 que vencen en cada uno de los próximos seis años. Cada año vence uno; o gastas ese efectivo o lo reinviertes en un nuevo peldaño a 6 años, a las tasas que haya en ese momento.</p>\n<p>Lo que te compra:</p>\n<ul>\n<li><strong>Ninguna apuesta al momento de las tasas.</strong> Vas promediando continuamente en el entorno de tasas que toque, la misma lógica del promedio de costo en dólares (dollar-cost averaging).</li>\n<li><strong>Liquidez predecible.</strong> El efectivo llega en un calendario conocido, así que nunca te ves obligado a vender en un mal mercado.</li>\n<li><strong>Resultados definidos.</strong> Cada peldaño tiene un valor de vencimiento conocido, algo que un fondo de bonos no te puede dar.</li>\n</ul>\n<p>Costos: da trabajo, necesita capital suficiente para diversificar el riesgo de crédito (hazla con bonos del Tesoro y esa preocupación desaparece), y los lotes minoristas pequeños de corporativos o municipales llevan diferenciales feos. Los <strong>ETF de vencimiento definido</strong> —fondos que tienen bonos que vencen todos en un mismo año objetivo y luego se liquidan— son un híbrido legítimo: te dan la mecánica de la escalera con diversificación a nivel de fondo.</p>\n<p>Uso común en el mundo real: un jubilado escalona en bonos del Tesoro los próximos 5–10 años de gasto, lo que le permite a la parte de acciones de la cartera aguantar un mal tramo sin ser vendida. Esa estructura, más que cualquier fórmula de asignación, es lo que hace sobrevivible una caída.</p>"}]});
TOPICS_ES.push({"id":"retirement","icon":"🎯","c":"#f2a33c","lvl":"Prioridad máxima","name":"Cuentas de jubilación","tag":"No son inversiones — son contenedores. Las mismas inversiones dentro de ellas valen muchísimo más, porque el tratamiento fiscal lo cambia todo.","blurb":"401(k), IRA, Roth vs. tradicional, aportaciones del empleador y el orden de operaciones que le saca el máximo a cada dólar.","deepTeaser":"El orden completo para llenar cada cuenta, las conversiones Roth y la puerta trasera, las RMD, la triple ventaja de la HSA, estrategias para acceder al dinero antes de tiempo y las reglas de traspaso que pueden costarte un 20% si las haces mal.","basics":[{"h":"La idea clave: contenedor, no inversión","body":"\n<p>La gente dice \"tengo mi dinero en un 401(k)\" igual que diría \"tengo mi dinero en acciones\". Categoría distinta. Un 401(k) o una IRA es una <strong>envoltura</strong> — un contenedor legal que guarda inversiones y cambia cómo se les cobran impuestos. Adentro sigues eligiendo acciones, bonos y fondos.</p>\n<p>La envoltura vale mucho. En una cuenta gravable normal pagas impuestos sobre los dividendos y sobre cada ganancia que realizas en el camino. Dentro de una cuenta de jubilación esa fricción desaparece — el crecimiento se capitaliza intacto durante décadas. Las mismas inversiones, un número final claramente distinto.</p>\n<div class=\"box\"><b>Dos tratos fiscales, elige tu veneno</b><p><strong>Tradicional:</strong> deduces la aportación ahora y pagas impuesto sobre la renta ordinaria por cada dólar que retires después. Beneficio fiscal hoy.</p><p><strong>Roth:</strong> aportas dinero que ya pagó impuestos, y cada dólar de crecimiento y de retiro sale completamente libre de impuestos en la jubilación. Beneficio fiscal después.</p></div>"},{"h":"Las cuentas principales","body":"\n<table>\n<tr><th>Cuenta</th><th>Para quién es</th><th>El punto</th></tr>\n<tr><td>401(k) / 403(b) / 457</td><td>Empleados (403b para organizaciones sin fines de lucro y escuelas, 457 para el gobierno)</td><td>Límites de aportación altos, automático vía nómina y muchas veces con aportación del empleador</td></tr>\n<tr><td>IRA tradicional</td><td>Cualquiera con ingresos del trabajo</td><td>Deducción ahora (sujeta a límites de ingreso si tienes un plan en el trabajo), impuestos al retirar</td></tr>\n<tr><td>Roth IRA</td><td>Cualquiera por debajo del límite de ingresos</td><td>Crecimiento libre de impuestos y retiros libres de impuestos. Las aportaciones pueden salir en cualquier momento, sin penalización</td></tr>\n<tr><td>SEP-IRA / Solo 401(k)</td><td>Trabajadores por cuenta propia, dueños de un negocio secundario</td><td>Límites altísimos para ingresos de freelance o por contrato</td></tr>\n<tr><td>HSA</td><td>Cualquiera con un plan de salud de deducible alto</td><td>Deducible al entrar, crecimiento libre de impuestos, salida libre de impuestos para gastos médicos. El mejor trato fiscal que existe en la ley</td></tr>\n</table>\n<p>Los límites de aportación cambian cada año con la inflación, y las aportaciones de recuperación (catch-up) empiezan a los 50. Revisa las cifras del año en curso en irs.gov en vez de confiar en cualquier artículo, incluido este.</p>"},{"h":"La aportación del empleador (match) — haz esto primero, siempre","body":"\n<p>Muchos empleadores igualan una parte de lo que tú aportas. Una fórmula común: 100% del primer 3% de tu salario y luego 50% del siguiente 2%.</p>\n<p>Con un salario de $80,000, aportar 5% son $4,000 de tu dinero, y el empleador añade $3,200. Eso es un <strong>rendimiento instantáneo de 80%</strong>, garantizado, antes de que el mercado haga nada. No existe otra inversión en el planeta que haga esto.</p>\n<div class=\"box warn\"><b>No aportar lo suficiente para llevarte el match completo es dejar efectivo sobre la mesa.</b><p>Si haces una sola cosa después de leer esta página, entra a tu plan y confirma que tu porcentaje de aportación sea al menos lo bastante alto como para capturar todo el match.</p></div>\n<p>El <strong>vesting</strong> (consolidación) es la trampa. Tus propias aportaciones siempre son 100% tuyas. La parte del empleador puede exigirte quedarte unos años — ya sea vesting de acantilado (0% hasta el tercer año, luego 100%) o gradual (20% por año). Conoce tu calendario antes de pensar en cambiar de trabajo; irte seis meses antes de tiempo puede costarte miles.</p>"},{"h":"¿Roth o tradicional?","body":"\n<p>La versión limpia de la decisión: <strong>paga el impuesto a la tasa más baja.</strong></p>\n<ul>\n<li>Si tu tasa impositiva de hoy es <strong>más baja</strong> de lo que esperas que sea en la jubilación → <strong>Roth</strong>. Paga ahora el impuesto barato.</li>\n<li>Si tu tasa de hoy es <strong>más alta</strong> que en la jubilación → <strong>tradicional</strong>. Toma la deducción a la tasa alta y paga a la baja.</li>\n</ul>\n<p>Lo que normalmente significa: inicio de carrera, tramo bajo o muchos años de capitalización por delante → Roth. Años de máximos ingresos en un tramo alto → tradicional, al menos para el plan del trabajo.</p>\n<p>Nadie conoce las tasas impositivas futuras, ni las tuyas ni las del país. Y ese es el argumento honesto para <strong>tener ambas</strong>. Llegar a la jubilación con dinero tradicional y dinero Roth te deja controlar tu ingreso gravable año por año — sacando del Roth para quedarte debajo del umbral de un tramo, del precipicio de un subsidio de ACA o de un escalón de la prima de Medicare. Esa flexibilidad vale dinero de verdad.</p>\n<div class=\"box\"><b>Las virtudes subestimadas del Roth</b><p>Las <strong>aportaciones</strong> a una Roth IRA (no las ganancias) se pueden retirar en cualquier momento, por cualquier motivo, sin impuestos ni penalización — ya pagaron impuestos. Eso convierte a una Roth IRA en un respaldo razonable de fondo de emergencia. Las Roth IRA tampoco tienen <strong>distribuciones mínimas obligatorias</strong> mientras vivas, así que el dinero puede capitalizarse intacto todo el tiempo que quieras y pasar a tus herederos de forma eficiente.</p></div>"},{"h":"El orden de operaciones","body":"\n<ol class=\"steps\">\n<li><b>401(k) hasta el match completo del empleador</b> Dinero gratis, inmediato, garantizado. Nada le gana.</li>\n<li><b>Liquida la deuda de interés alto</b> Pagar una tarjeta de crédito al 22% es un rendimiento garantizado de 22%. Ninguna inversión ofrece eso de forma confiable.</li>\n<li><b>Fondo de emergencia: 3–6 meses de gastos</b> En una cuenta de ahorro de alto rendimiento, un fondo de mercado monetario o letras del Tesoro. Esto es lo que evita que un mes malo se convierta en un préstamo contra el 401(k).</li>\n<li><b>Llena al máximo la HSA si tienes una</b> Deducible al entrar, crecimiento libre de impuestos, salida libre de impuestos para gastos médicos calificados. Paga los gastos médicos actuales de tu bolsillo, guarda los recibos y deja que la HSA se capitalice — puedes reembolsarte a ti mismo décadas después.</li>\n<li><b>Llena al máximo una Roth IRA (o un backdoor Roth si superas el límite de ingresos)</b> Mejores opciones de inversión que la mayoría de los menús de 401(k), y libre de impuestos para siempre.</li>\n<li><b>Llena el 401(k) hasta el límite anual</b> Deducción grande, capitalización grande.</li>\n<li><b>Cuenta de corretaje gravable</b> Sin límites, flexibilidad total, y las tasas de ganancias de capital a largo plazo siguen siendo favorables.</li>\n</ol>\n<p>Este orden no es arbitrario — va del rendimiento garantizado más alto al más bajo. Ajústalo a tu situación, pero entiende a qué estás renunciando cuando te saltas un escalón.</p>"},{"h":"Sacar el dinero","body":"\n<p><strong>59½</strong> es la edad general a partir de la cual los retiros dejan de cargar la penalización de 10% por retiro anticipado. Saca dinero antes de eso y normalmente debes impuesto sobre la renta más 10%, aunque hay excepciones (discapacidad, ciertos gastos médicos, una primera vivienda hasta $10,000 desde una IRA, pagos periódicos sustancialmente iguales y la \"regla de los 55\" para un 401(k) del trabajo que acabas de dejar).</p>\n<p>Las <strong>distribuciones mínimas obligatorias (RMD)</strong> obligan a sacar dinero de las cuentas tradicionales a partir de mediados de tus 70, quieras o no, y se gravan como ingreso ordinario. Las Roth IRA están exentas. Las RMD son una gran razón por la que la gente hace conversiones Roth en sus 60.</p>\n<div class=\"box warn\"><b>La trampa del traspaso</b><p>¿Cambias de trabajo? Haz un <strong>traspaso directo (de custodio a custodio)</strong>. Si el cheque te llega a ti, el plan retiene 20% y tienes 60 días para depositar el monto original completo — incluido el 20% que nunca recibiste — o el faltante se trata como una distribución gravable con penalización. Pide un traspaso directo, con esas palabras, siempre.</p></div>"}],"pitfalls":["Cobrar y liquidar un 401(k) al cambiar de trabajo. Entre impuestos y penalización puedes perder un tercio, más cada dólar en el que se habría capitalizado.","Dejar el dinero en el fondo de fecha objetivo que viene por defecto sin revisar el ratio de gastos. Algunos menús de planes traen fondos que cobran más de 1% cuando hay una opción indexada de 0.05% tres filas más abajo.","Aportar a una Roth IRA estando por encima del límite de ingresos. Dispara una penalización por exceso de aportación cada año hasta que lo arregles. Usa el backdoor Roth en su lugar.","Olvidar 401(k) viejos en empleadores anteriores. El dinero de verdad queda huérfano así. Consolida.","No actualizar nunca las designaciones de beneficiario. Le ganan a tu testamento. Un ex cónyuge anotado en un formulario de hace 30 años heredará la cuenta.","Tomar un préstamo contra el 401(k) para algo que no es urgente. Si dejas el trabajo, el saldo suele volverse exigible rápido, y el faltante se convierte en una distribución gravada y penalizada.","Suponer que un 401(k) alcanza por sí solo. Para la mayoría de la gente, los límites de aportación por sí mismos no financiarán la jubilación que se imagina."],"terms":[{"t":"Límite de aportación","d":"El tope anual del IRS sobre lo que puedes meter. Indexado a la inflación y distinto para cada tipo de cuenta."},{"t":"Aportación del empleador (match)","d":"Dinero que tu empleador añade según lo que tú aportas. En la práctica es parte de tu compensación."},{"t":"Vesting","d":"Cuándo las aportaciones del empleador se vuelven realmente tuyas. Tu propio dinero siempre está consolidado desde el primer día."},{"t":"Tradicional","d":"Entra antes de impuestos, se grava al salir."},{"t":"Roth","d":"Entra después de impuestos, crecimiento libre de impuestos y salida libre de impuestos."},{"t":"Traspaso (rollover)","d":"Mover dinero de jubilación entre cuentas sin generar impuestos. Hazlo siempre de forma directa."},{"t":"RMD","d":"Distribución mínima obligatoria — el gobierno forzando retiros de las cuentas tradicionales a partir de mediados de tus 70."},{"t":"Aportación de recuperación (catch-up)","d":"Monto extra que puedes aportar una vez que cumples 50."},{"t":"Fondo de fecha objetivo (target-date fund)","d":"Un solo fondo que se desplaza automáticamente de acciones hacia bonos conforme se acerca tu año de jubilación."},{"t":"Backdoor Roth","d":"Aportar a una IRA tradicional sin deducirla y convertirla a Roth — la vía legal para quienes ganan mucho."},{"t":"Mega backdoor Roth","d":"Hacer aportaciones después de impuestos al 401(k) por encima del límite normal y convertirlas. Solo si tu plan lo permite."},{"t":"HSA","d":"Health Savings Account, cuenta de ahorro para gastos médicos. Deducible al entrar, crecimiento libre de impuestos, salida libre de impuestos para gastos médicos. Triple ventaja fiscal."},{"t":"Designación de beneficiario","d":"Quién hereda la cuenta. Le gana a tu testamento. Revísala después de cada evento importante de tu vida."},{"t":"Regla de los 55","d":"Deja tu trabajo en el año en que cumples 55 o después y puedes tocar ese 401(k) del empleador sin penalización."}],"deep":[{"h":"Conversiones Roth: la palanca de jubilación que casi todos se pierden","body":"\n<p>Una <strong>conversión Roth</strong> mueve dinero de una IRA tradicional o un 401(k) hacia un Roth. Pagas impuesto sobre la renta ordinaria por el monto convertido este año, y todo lo que venga después queda libre de impuestos para siempre, sin RMD.</p>\n<p>La jugada es convertir durante los años de ingresos bajos y llenar deliberadamente los tramos baratos.</p>\n<div class=\"box\"><b>La ventana clásica</b><p>Entre jubilarse (digamos a los 62) y empezar el Seguro Social y las RMD (67–75), mucha gente tiene un ingreso gravable inusualmente bajo. Convertir cada año lo suficiente para llenar los tramos de 12% y 22% durante esa ventana puede mover un saldo tradicional grande hacia Roth a una tasa mucho más baja que la que habrían pagado las RMD después. Hecho de forma sistemática, esto suele ser un ahorro fiscal de seis cifras a lo largo de la vida.</p></div>\n<p>Cosas que hay que hacer bien:</p>\n<ul>\n<li><strong>Paga el impuesto con dinero de fuera.</strong> Usar los dólares convertidos para cubrir la factura fiscal echa a perder buena parte del beneficio y puede disparar una penalización si tienes menos de 59½.</li>\n<li><strong>Cada conversión tiene su propio reloj de 5 años</strong> antes de que el principal convertido se pueda retirar sin penalización (aparte de la regla de 5 años para las ganancias del Roth).</li>\n<li><strong>Cuidado con los efectos de segundo orden.</strong> El ingreso por conversión puede empujar más de tu Seguro Social a territorio gravable, subir las primas IRMAA de Medicare dos años después y afectar los subsidios de ACA. Modélalo antes de jalar el gatillo.</li>\n<li><strong>La recaracterización ya no existe.</strong> Desde 2018 no puedes deshacer una conversión. Mide dos veces.</li>\n</ul>"},{"h":"El backdoor Roth y la regla pro-rata","body":"\n<p>Las Roth IRA tienen límites de ingresos. Quienes ganan mucho los rodean legalmente: aportar a una <strong>IRA tradicional sin deducirla</strong> y luego <strong>convertirla a Roth</strong>. No hay límite de ingresos para las conversiones. El Congreso lleva más de una década sabiéndolo y no lo ha cerrado.</p>\n<p>Sencillo, con una mina enterrada.</p>\n<div class=\"box warn\"><b>La regla pro-rata</b><p>El IRS trata todas tus IRA tradicionales, SEP y SIMPLE como una sola olla al calcular el impuesto de una conversión. Si tienes $93,000 de dinero antes de impuestos en IRA y agregas una aportación no deducible de $7,000, y luego conviertes $7,000, solo el 7% de esa conversión se trata como el dinero que ya pagó impuestos. El otro 93% es ingreso gravable. Ojo: esto cuenta solo IRA — los saldos de 401(k) quedan excluidos.</p></div>\n<p><strong>El arreglo estándar:</strong> traspasa primero los saldos de IRA antes de impuestos que ya tienes <em>hacia</em> el 401(k) de tu empleador actual, si el plan acepta traspasos entrantes. Eso vacía la olla de la IRA, y la conversión por la puerta trasera queda esencialmente libre de impuestos. Presenta el Form 8606 por la aportación no deducible cada año, y guarda esos formularios — el seguimiento de la base te toca a ti, no a tu custodio.</p>\n<p><strong>Mega backdoor Roth:</strong> si tu 401(k) permite aportaciones después de impuestos (una categoría distinta de los diferimientos Roth 401(k)) más retiros en servicio o conversiones dentro del plan, puedes empujar un monto adicional grande hacia espacio Roth cada año, muy por encima del límite normal de diferimiento. Raro en los documentos del plan, enorme cuando está disponible. Busca en la descripción resumida de tu plan las frases \"after-tax contributions\" e \"in-service distribution\".</p>"},{"h":"La HSA es la mejor cuenta de todo el código fiscal","body":"\n<p>Todas las demás cuentas te dan un beneficio fiscal en un solo extremo. La HSA te da tres: <strong>las aportaciones son deducibles</strong>, <strong>el crecimiento no se grava</strong> y <strong>los retiros médicos calificados no se gravan</strong>. Nada más hace las tres cosas. Las aportaciones vía nómina también se libran del FICA, cosa que ninguna aportación a IRA o 401(k) logra.</p>\n<p>Para calificar debes estar inscrito en un plan de salud de deducible alto y no estar en Medicare.</p>\n<div class=\"box\"><b>La estrategia que casi todos se pierden</b><p>No uses la HSA como cuenta de cheques para los copagos. Invierte el saldo en fondos indexados, paga los gastos médicos actuales de tu bolsillo y <strong>guarda cada recibo</strong>. No hay fecha límite para el reembolso — un gasto calificado de 2026 se puede reembolsar libre de impuestos en 2050, después de que el dinero se capitalizó durante 24 años. En la práctica estás convirtiendo una cuenta de inversión de horizonte ilimitado en dinero libre de impuestos.</p></div>\n<p>Después de los 65, los retiros no médicos están permitidos y se gravan como ingreso ordinario sin penalización — así que el peor caso es que tu HSA se comporte como una IRA tradicional. Mientras tanto, dado que la salud es uno de los mayores gastos de jubilación que enfrenta la mayoría de los hogares, las probabilidades de que nunca necesites el uso médico son bajas.</p>\n<p>Dos advertencias: las HSA no están exentas del impuesto estatal en todas partes (California y Nueva Jersey históricamente no se han alineado), y una HSA heredada por alguien que no sea el cónyuge pierde por completo su estatus fiscal — vale la pena nombrar al cónyuge como beneficiario cuando se pueda.</p>"},{"h":"Cómo llegar al dinero antes de los 59½","body":"\n<p>Jubilarte temprano no significa que tu dinero esté encerrado. Hay caminos legítimos.</p>\n<ul>\n<li><strong>Regla de los 55.</strong> Sepárate del empleo en el año calendario en que cumples 55 o después, y puedes tomar distribuciones sin penalización del 401(k) <em>de ese empleador</em>. Clave: esto no aplica si primero lo traspasas a una IRA — así que si el acceso anticipado te importa, déjalo en el plan.</li>\n<li><strong>72(t) / SEPP.</strong> Pagos periódicos sustancialmente iguales desde una IRA, calculados con un método aprobado por el IRS, que debes tomar durante cinco años o hasta los 59½, lo que resulte más largo. Rígido: modifica el calendario y las penalizaciones retroactivas aplican a todo.</li>\n<li><strong>La base de aportaciones Roth.</strong> Tus aportaciones directas a la Roth IRA salen en cualquier momento, sin impuestos ni penalización. Las reglas de orden sacan primero las aportaciones, luego las conversiones y luego las ganancias.</li>\n<li><strong>Escalera de conversiones Roth.</strong> El enfoque estándar para la jubilación anticipada. Convierte cada año el equivalente a un año de gastos de tradicional a Roth; una vez que cada conversión madura cinco años, ese monto se puede retirar sin penalización. Empieza la escalera cinco años antes de necesitar el primer dólar, y cubre el hueco con dinero de la cuenta gravable.</li>\n<li><strong>Otras excepciones:</strong> discapacidad total, gastos médicos por encima del umbral del AGI, primas de seguro médico mientras estás desempleado, educación superior calificada (solo IRA), $10,000 de por vida para una primera vivienda (solo IRA), nacimiento o adopción hasta $5,000, y ciertos desastres declarados a nivel federal.</li>\n</ul>\n<div class=\"box\"><b>El orden de retiros en la jubilación</b><p>El orden convencional es primero la cuenta gravable, luego la tradicional y luego la Roth — pero la versión optimizada mezcla a propósito: saca cada año lo suficiente de la tradicional para llenar los tramos bajos (o convierte a Roth), y usa la gravable y la Roth para completar el gasto sin cruzar un tramo, un escalón de IRMAA o un precipicio de subsidio. Manejar tu ingreso gravable año por año es el trabajo financiero de mayor valor en la jubilación anticipada.</p></div>"},{"h":"Qué hay realmente dentro de tu 401(k)","body":"\n<p>La cuenta es un contenedor. Lo que tienes adentro determina el resultado, y los menús de los planes van de excelentes a depredadores.</p>\n<ul>\n<li><strong>Encuentra los ratios de gastos.</strong> Están en los documentos del plan o en la página del fondo. Un fondo al 1.0% frente a un fondo indexado al 0.05% te cuesta aproximadamente 20–25% de tu saldo final a lo largo de una carrera de 30 años. Eso no es un error de redondeo; son años de jubilación.</li>\n<li><strong>Ojo con el revenue sharing y las \"cuotas administrativas\".</strong> Algunos planes montan una comisión envolvente encima de los gastos del fondo. Aparece en la divulgación anual de comisiones que el plan está legalmente obligado a enviarte.</li>\n<li><strong>Los fondos de fecha objetivo son una opción predeterminada razonable</strong> si el ratio de gastos es bajo — un solo fondo, rebalanceado automáticamente, con la trayectoria de descenso incorporada. Pero esas trayectorias difieren bastante entre proveedores, y un \"2050\" de una firma puede tener notablemente más o menos renta variable que el 2050 de otra.</li>\n<li><strong>Ventana de corretaje.</strong> Algunos planes ofrecen una opción autodirigida que abre el mercado completo. Útil si el menú principal es malo; revisa si hay comisiones extra.</li>\n<li><strong>Acciones de la empresa y NUA.</strong> Si tienes acciones apreciadas de tu empleador dentro de un 401(k), el tratamiento de <em>apreciación neta no realizada</em> puede permitirte pagar impuesto sobre la renta ordinaria solo sobre la base de costo original y ganancias de capital a largo plazo sobre la apreciación cuando la distribuyes en especie. Poderoso y fácil de arruinar — este es un tema de \"habla con un contador antes de tocarlo\". Aparte: concentrarte en las acciones de tu empleador significa que tu empleo y tus ahorros comparten un mismo punto de falla.</li>\n</ul>"},{"h":"El Seguro Social, breve pero bien","body":"\n<p>Es una parte importante de casi cualquier plan de jubilación, y decidir cuándo reclamarlo es una de las mayores decisiones financieras que toma la mayoría de la gente.</p>\n<p>Tu beneficio se calcula con tus 35 mejores años de ingresos indexados. Menos de 35 años trabajados significa que se promedian ceros. La edad plena de jubilación es 67 para cualquiera nacido en 1960 o después.</p>\n<table>\n<tr><th>Reclamar a los</th><th>Efecto sobre el beneficio mensual</th></tr>\n<tr><td>62 (lo más temprano)</td><td>Alrededor de 30% menos, de forma permanente</td></tr>\n<tr><td>67 (edad plena de jubilación)</td><td>100% de tu beneficio calculado</td></tr>\n<tr><td>70 (lo más tarde que vale la pena esperar)</td><td>Alrededor de 24% más, de forma permanente, más el ajuste por inflación (COLA) sobre una base mayor</td></tr>\n</table>\n<p>Retrasar de 67 a 70 es en la práctica una anualidad ajustada por inflación y respaldada por el gobierno que rinde cerca de 8% al año durante esos tres años. Nada en el mercado privado iguala eso ajustado por riesgo. El punto de equilibrio frente a reclamar temprano suele caer a principios o mediados de los 80.</p>\n<p>Para una pareja casada, el beneficio del que más ganó se convierte en el beneficio de sobreviviente — así que retrasar el reclamo del que gana <em>más</em> protege al cónyuge sobreviviente por el resto de su vida. Esa suele ser la decisión de Seguro Social más valiosa que toma una pareja. Crea una cuenta en ssa.gov y revisa tu historial de ingresos por errores; sí ocurren, y corregirlos después es más difícil.</p>"}]});
TOPICS_ES.push({"id":"options","icon":"⚡","c":"#8b9dff","lvl":"Derivados","name":"Opciones","tag":"Un contrato que te da el derecho de comprar o vender 100 acciones a un precio fijo antes de una fecha fija. Bien usado, es un seguro. Mal usado, es un reloj de cuenta regresiva pegado a tu dinero.","blurb":"Calls, puts, y qué paga realmente la prima. Los tres trabajos legítimos que hacen las opciones, y las formas en que la gente pierde dinero haciéndolos.","deepTeaser":"Valor intrínseco vs. extrínseco, las griegas en palabras simples, la volatilidad implícita y el IV crush, las estrategias centrales ordenadas por riesgo, la mecánica de la asignación, y la regla fiscal 60/40 de la que casi ningún trader se entera.","basics":[{"h":"Qué es realmente una opción","body":"\n<p>Una opción es un <strong>contrato entre dos personas</strong>. Un lado paga por un derecho; al otro lado le pagan por asumir una obligación. Esa es toda la estructura, y casi todos los errores vienen de olvidar en qué lado estás.</p>\n<p>Un contrato controla <strong>100 acciones</strong>. Tiene cuatro piezas que lo definen:</p>\n<ul>\n<li><strong>Tipo</strong> — una <em>call</em> (derecho a comprar) o una <em>put</em> (derecho a vender).</li>\n<li><strong>Precio de ejercicio (strike price)</strong> — el precio que el contrato deja fijado.</li>\n<li><strong>Fecha de vencimiento</strong> — cuándo desaparece el derecho. Después de eso el contrato vale exactamente cero.</li>\n<li><strong>Prima (premium)</strong> — lo que pagas o recibes por el contrato, cotizado por acción. Una prima de $2.40 cuesta $240 por un contrato.</li>\n</ul>\n<div class=\"box\"><b>La versión de una sola frase</b><p>Una call es un <strong>cupón</strong> — el derecho a comprar algo a un precio fijo, suba o no suba. Una put es una <strong>póliza de seguro</strong> — el derecho a vender a un precio fijo incluso si la cosa se desploma. En ambos casos la prima es lo que cuesta el cupón o la póliza, y vence.</p></div>\n<p>Las opciones son el mismo instrumento que los agricultores llevan un siglo usando para fijar el precio de una cosecha y que las aerolíneas usan para fijar el costo del combustible. No tienen nada de imprudente en sí mismas. Lo imprudente es una forma específica de usarlas, que se explica más abajo.</p>"},{"h":"Calls y puts, con números reales","body":"\n<p><strong>Comprar una call.</strong> La acción cotiza a $50. Compras una call de $55 que vence en tres meses por $2.00 — costo total $200. Ahora tienes el derecho de comprar 100 acciones a $55 en cualquier momento antes del vencimiento.</p>\n<table>\n<tr><th>Acción al vencimiento</th><th>Cuánto vale tu call</th><th>Tu ganancia/pérdida</th></tr>\n<tr><td>$45</td><td>$0 — nadie compra a $55 cuando el mercado está en $45</td><td>−$200 (pérdida total)</td></tr>\n<tr><td>$55</td><td>$0</td><td>−$200</td></tr>\n<tr><td>$57</td><td>$200</td><td>$0 — el punto de equilibrio es strike + prima</td></tr>\n<tr><td>$65</td><td>$1,000</td><td>+$800</td></tr>\n</table>\n<p>Fíjate en la forma. Tu pérdida máxima son los $200 que pagaste — eso es real y está limitado. Tu ganancia potencial no tiene tope. Pero necesitabas que la acción se moviera más de 14% en tres meses solo para llegar al punto de equilibrio. <strong>Acertar la dirección no alcanza; tienes que acertar dirección, tamaño y tiempo al mismo tiempo.</strong></p>\n<p><strong>Comprar una put</strong> es el espejo. Tienes 100 acciones a $50 y compras una put de $45 por $1.50. Si la acción se desploma a $30, tus acciones perdieron $2,000 pero tu put vale $1,500. Pagaste $150 por esa protección. Eso es un seguro de cartera, y funciona igual que el seguro de tu auto — la mayoría de los años pagas la prima y no pasa nada.</p>\n<div class=\"box\"><b>Vender en vez de comprar</b><p>Toda opción comprada se la vendió alguien. El <strong>vendedor</strong> (o \"lanzador\") cobra la prima por adelantado y asume la obligación: un vendedor de calls debe entregar 100 acciones si lo asignan, un vendedor de puts debe comprar 100 acciones. Los vendedores ganan casi siempre y pierden fuerte de vez en cuando; los compradores pierden casi siempre y ganan fuerte de vez en cuando. Ningún lado es dinero gratis — la prima está fijada para que ambos sean más o menos justos, menos el spread.</p></div>"},{"h":"Los tres trabajos que hacen las opciones","body":"\n<p>Confundirlos es lo que hace que la gente salga lastimada. Son actividades genuinamente distintas que casualmente usan el mismo instrumento.</p>\n<ol class=\"steps\">\n<li><b>Cobertura — comprar protección</b> Tienes algo y quieres ponerle un tope a la caída. Comprar puts sobre una posición grande, o un <em>collar</em> (compras una put, vendes una call para pagarla) alrededor de una posición concentrada como las acciones de tu empleador. Conservador, deliberado, y el propósito original de todo este mercado.</li>\n<li><b>Ingresos — que te paguen por aceptar una obligación</b> Vender una <em>call cubierta</em> contra 100 acciones que ya tienes te da prima a cambio de ponerle tope a tu ganancia por encima del strike. Vender una <em>put cubierta con efectivo</em> te da prima a cambio de aceptar comprar más barato una acción que de todos modos querías. Estrategias reales con contrapartidas honestas: te pagan ahora y renuncias a algo después.</li>\n<li><b>Especulación — comprar apalancamiento con cronómetro</b> Comprar calls fuera del dinero de vencimiento corto porque esperas un salto esta semana. Aquí es donde va la mayor parte del dinero minorista y donde se muere la mayor parte. El desgaste por tiempo juega en tu contra todos los días, y una gran mayoría de estos contratos vence sin valor.</li>\n</ol>\n<div class=\"box warn\"><b>El número que debería moldear tus expectativas</b><p>Aproximadamente el 90% del dinero que los inversionistas individuales meten en opciones fuera del dinero de vencimiento corto se pierde con el tiempo. No porque el mercado esté arreglado — sino porque la posición exige un movimiento grande en una ventana corta, y la prima ya tiene incorporada la probabilidad de ese movimiento. No estás obteniendo una ventaja; estás pagando por un billete de lotería con spread encima.</p></div>"},{"h":"Cómo operar una en la práctica","body":"\n<ol class=\"steps\">\n<li><b>Consigue aprobación de tu bróker</b> Las opciones requieren una solicitud y los brókers asignan niveles — típicamente Nivel 1 (calls cubiertas, puts protectoras), Nivel 2 (comprar calls y puts), Nivel 3 (spreads), Nivel 4 (venta descubierta). Preguntan por tus ingresos, tu patrimonio neto y tu experiencia. Los niveles existen porque el riesgo de verdad va aumentando en cada nivel.</li>\n<li><b>Lee la cadena</b> La cadena de opciones (options chain) lista cada strike y cada vencimiento. Calls de un lado, puts del otro, con bid, ask, volumen, interés abierto y volatilidad implícita para cada uno. Opera solo contratos con volumen real — un spread bid/ask ancho es una pérdida garantizada en el momento en que entras.</li>\n<li><b>Usa siempre órdenes limitadas</b> Nunca una orden a mercado en una opción. Los spreads pueden ser 5–10% del valor del contrato; una orden a mercado regala eso al instante. Empieza en el precio medio y ve moviéndote hacia el ask.</li>\n<li><b>Entiende qué significa \"buy to open\"</b> Cuatro acciones: buy to open (comprar para abrir), sell to close (vender para cerrar, si estabas largo), sell to open (vender para abrir), buy to close (comprar para cerrar, si estabas corto). Elegir la equivocada puede dejarte corto en un contrato que creías haber cerrado.</li>\n<li><b>Ten claro cómo vas a salir antes de entrar</b> La mayoría de las opciones se cierran operándolas, no ejerciéndolas. Vendes el contrato de vuelta por lo que valga. Fija de antemano un objetivo de ganancia y un límite de pérdida — las opciones se mueven lo bastante rápido como para que improvisar salga caro.</li>\n<li><b>Cuida la semana de vencimiento</b> Las opciones dentro del dinero se ejercen automáticamente al vencimiento por defecto. Si no tienes el efectivo o las acciones para cubrir eso, cierra la posición antes de la campana final. Las sorpresas por asignación son un desastre muy común y muy evitable.</li>\n</ol>"},{"h":"Por dónde empezar de verdad","body":"\n<p>Si quieres usar opciones y partes de cero, hay una progresión defendible. Va de \"te pagan por asumir un riesgo que ya aceptas\" a \"necesitas acertarle al futuro\".</p>\n<table>\n<tr><th>Paso</th><th>Estrategia</th><th>Qué estás haciendo en realidad</th></tr>\n<tr><td>1</td><td>Call cubierta</td><td>Tienes 100 acciones. Te pagan por prometer venderlas a un precio más alto. Peor caso: vendes demasiado pronto una ganadora</td></tr>\n<tr><td>2</td><td>Put cubierta con efectivo</td><td>Tienes efectivo apartado. Te pagan por prometer comprar más barato una acción que querías de todos modos. Peor caso: te quedas con una acción que siguió cayendo</td></tr>\n<tr><td>3</td><td>Put protectora / collar</td><td>Estás comprando un seguro sobre una posición que te importa</td></tr>\n<tr><td>4</td><td>Spreads verticales</td><td>Riesgo definido, recompensa definida, más barato que comprar una opción suelta. Requiere tener una opinión de verdad</td></tr>\n<tr><td>5</td><td>Todo lo demás</td><td>Solo después de haber pasado lo anterior por un ciclo de mercado completo</td></tr>\n</table>\n<div class=\"box\"><b>Reglas que evitan que esto salga caro</b><p>Opera un solo contrato hasta que la mecánica te aburra. Nunca arriesgues en opciones más de lo que estarías tranquilo perdiendo por completo. Mantén la exposición total en opciones en una rebanada pequeña de la cartera — piensa 5%, no 30%. Evita la semana de resultados hasta que entiendas el IV crush. Y nunca vendas una call descubierta: la pérdida es teóricamente ilimitada, y eso no es una manera de hablar.</p></div>\n<p>Nada de esto reemplaza el núcleo de una cartera. Las opciones son una herramienta para dar forma al riesgo de posiciones que ya tienes o que quieres. No son una estrategia de inversión por sí solas, y tratarlas como tal es el camino más común hacia una pérdida grande en poco tiempo.</p>"}],"pitfalls":["Comprar calls semanales fuera del dinero porque son baratas. Barato significa que el mercado cree que casi con seguridad no va a pasar, y el desgaste por tiempo se acelera más fuerte en la última semana.","Acertarle a la acción y aun así perder dinero. Si el movimiento tarda demasiado, o si la volatilidad implícita baja después de que compraste, la opción pierde valor incluso mientras la acción coopera.","Vender calls descubiertas. Pérdida teórica ilimitada, y puede pasar de la noche a la mañana con el anuncio de una adquisición.","Usar órdenes a mercado. En un contrato poco líquido puedes pagar 10% por encima del valor justo antes de que la operación siquiera empiece a funcionar.","Olvidar que las opciones dentro del dinero se ejercen automáticamente al vencimiento. El lunes por la mañana tienes 100 acciones que no puedes pagar, o estás corto en acciones que nunca quisiste.","Operar durante los resultados sin entender el IV crush. La acción se mueve como predijiste, la volatilidad implícita se desploma, y tu opción igual pierde dinero.","Rolar una perdedora hacia adelante una y otra vez para no asumir la pérdida. Eso convierte una pérdida pequeña y definida en una grande, un contrato a la vez.","Dimensionar las opciones como si fueran acciones. Una posición de $5,000 en opciones no equivale a $5,000 en acciones — puede controlar $60,000 de exposición y puede irse a cero.","Operar contratos 0DTE (cero días al vencimiento) como estrategia. El riesgo de gamma es extremo y la distribución de resultados se parece más a un casino que a un mercado."],"terms":[{"t":"Call","d":"El derecho a comprar 100 acciones al precio de ejercicio antes del vencimiento."},{"t":"Put","d":"El derecho a vender 100 acciones al precio de ejercicio antes del vencimiento."},{"t":"Precio de ejercicio (strike)","d":"El precio fijo que el contrato deja bloqueado."},{"t":"Prima (premium)","d":"El precio del contrato, cotizado por acción. Multiplica por 100 para el costo real."},{"t":"Vencimiento","d":"La fecha en que muere el contrato. Después de eso, la opción vale cero."},{"t":"Dentro del dinero (in the money, ITM)","d":"La opción tiene valor de ejercicio real — una call con la acción por encima del strike, una put con la acción por debajo."},{"t":"Fuera del dinero (out of the money, OTM)","d":"Todavía sin valor de ejercicio. Toda la prima es tiempo y volatilidad."},{"t":"En el dinero (at the money, ATM)","d":"El strike es más o menos igual al precio actual de la acción. Aquí vive el máximo valor temporal."},{"t":"Valor intrínseco","d":"La parte de la prima que sería dinero real si ejercieras ahora mismo."},{"t":"Valor extrínseco (temporal)","d":"Todo lo demás que estás pagando — tiempo restante y volatilidad esperada. Se desgasta hasta cero al vencimiento."},{"t":"Volatilidad implícita (IV)","d":"El pronóstico del mercado sobre cuánto se moverá la acción, deducido a partir del precio de la opción. IV alta significa opciones caras."},{"t":"Theta","d":"Desgaste diario por tiempo. Cuánto pierde la opción por día, con todo lo demás igual."},{"t":"Delta","d":"Cuánto se mueve el precio de la opción por cada $1 que se mueve la acción. También es una aproximación de la probabilidad de terminar dentro del dinero."},{"t":"Gamma","d":"Qué tan rápido cambia delta. Se dispara cerca del vencimiento, por eso las opciones de corto plazo se comportan de forma violenta."},{"t":"Vega","d":"Sensibilidad a los cambios en la volatilidad implícita."},{"t":"Call cubierta (covered call)","d":"Vender una call contra 100 acciones que tienes. Ingreso a cambio de una ganancia con tope."},{"t":"Put cubierta con efectivo (cash-secured put)","d":"Vender una put con efectivo apartado para comprar las acciones si te asignan."},{"t":"Descubierta (naked / uncovered)","d":"Vender una opción sin las acciones ni el efectivo que la respalden. Riesgo ilimitado en las calls."},{"t":"Asignación","d":"Quedar obligado a cumplir tu parte — entregar o comprar 100 acciones."},{"t":"Ejercicio","d":"Usar tu derecho a comprar o vender al strike. La mayoría de los traders cierra el contrato en vez de eso."},{"t":"Spread vertical","d":"Comprar un strike y vender otro en el mismo vencimiento. Le pone tope tanto al riesgo como a la recompensa."},{"t":"La rueda (the wheel)","d":"Vender puts cubiertas con efectivo hasta que te asignen, luego vender calls cubiertas hasta que te las quiten. Repetir."},{"t":"LEAPS","d":"Opciones de largo plazo, típicamente a un año o más. Desgaste por tiempo mucho más lento."},{"t":"Interés abierto (open interest)","d":"Cuántos contratos existen en ese strike. Una señal de liquidez."},{"t":"0DTE","d":"Cero días al vencimiento. Vence hoy. Gamma extrema, riesgo extremo."},{"t":"Máximo dolor (max pain)","d":"El strike donde vence sin valor la mayor cantidad de contratos. Muy citado, poco predictivo."}],"deep":[{"h":"Por lo que realmente estás pagando","body":"\n<p>Toda prima de opción se divide en exactamente dos partes, y esa división explica casi todos los resultados confusos que vas a tener.</p>\n<p>El <strong>valor intrínseco</strong> es el valor de ejercicio real e inmediato. Una call de $50 con la acción a $58 tiene $8 de valor intrínseco. No puede valer menos que eso.</p>\n<p>El <strong>valor extrínseco</strong> es todo lo que está por encima del intrínseco — lo que el mercado te cobra por el tiempo que queda y el movimiento esperado. Una call de $60 con la acción a $58 tiene <em>cero</em> valor intrínseco, así que el 100% de lo que pagaste es extrínseco. Y el valor extrínseco llega a cero exacto al vencimiento, garantizado, todas las veces.</p>\n<div class=\"box warn\"><b>Por qué las opciones \"baratas\" son caras</b><p>Una call semanal fuera del dinero a $0.15 es puro valor extrínseco. No estás comprando un activo con descuento; estás comprando uno que se derrite rápido. Lo barato <em>es</em> la estimación del mercado de que no va a pasar. El desgaste por tiempo tampoco es lineal — se acelera de golpe en las últimas dos o tres semanas, y en los últimos días es brutal.</p></div>\n<p>Dos fuerzas fijan el precio extrínseco:</p>\n<ul>\n<li><strong>Tiempo</strong> — más días significa más oportunidades de que la acción se mueva, así que más prima.</li>\n<li><strong>Volatilidad implícita</strong> — cuánto movimiento espera el mercado. Este es el factor que agarra desprevenida a la gente, porque cambia de forma independiente a la acción.</li>\n</ul>\n<p>La consecuencia que vale la pena interiorizar: <strong>puedes tener toda la razón sobre la acción y aun así perder dinero.</strong> Si el movimiento tarda cuatro semanas en vez de una, te comió theta. Si la IV estaba elevada cuando compraste y después se normalizó, te comió vega. La dirección es una de tres variables, y es la única en la que piensa casi todo el mundo.</p>"},{"h":"Las griegas, en palabras simples","body":"\n<p>Las griegas son solo sensibilidades — cómo responde el precio de la opción cuando se mueve cada variable. No necesitas las matemáticas; necesitas saber cuál está jugando en tu contra.</p>\n<table>\n<tr><th>Griega</th><th>Mide</th><th>Qué significa en la práctica</th></tr>\n<tr><td><strong>Delta</strong></td><td>Cambio por cada $1 que se mueve la acción</td><td>Un delta de 0.40 significa que la opción gana unos $0.40 por cada $1 de movimiento de la acción — y aproximadamente 40% de probabilidad de terminar dentro del dinero. También te dice tu exposición equivalente en acciones: 3 contratos con delta 0.40 ≈ 120 acciones</td></tr>\n<tr><td><strong>Gamma</strong></td><td>Qué tan rápido cambia delta</td><td>El acelerador. Cerca del vencimiento y cerca del strike, gamma explota — por eso las posiciones 0DTE pasan de no valer nada a ser rentables y de vuelta en cuestión de minutos</td></tr>\n<tr><td><strong>Theta</strong></td><td>Desgaste diario</td><td>−0.05 significa que pierdes unos $5 por contrato por día solo por el calendario. Los compradores pelean contra theta; los vendedores la cobran. Esta es la asimetría fundamental del mercado</td></tr>\n<tr><td><strong>Vega</strong></td><td>Sensibilidad a la IV</td><td>Una vega de 0.12 significa que un movimiento de 1 punto en la IV cambia la opción en $12 por contrato. Las opciones compradas quieren que la IV suba; las vendidas quieren que baje</td></tr>\n<tr><td><strong>Rho</strong></td><td>Sensibilidad a las tasas de interés</td><td>Insignificante en contratos de corto plazo. Importa en LEAPS</td></tr>\n</table>\n<div class=\"box\"><b>La disyuntiva en una línea</b><p>Comprar opciones: gamma positiva, vega positiva, <strong>theta negativa</strong>. Obtienes una ganancia potencial explosiva y pagas renta todos los días. Vender opciones: gamma negativa, vega negativa, <strong>theta positiva</strong>. Cobras renta a diario y cargas con el riesgo de cola. Elige a conciencia, porque esos dos perfiles producen resultados opuestos en el mismo mercado.</p></div>\n<p>El uso práctico de delta: es tu herramienta para dimensionar posiciones. Si no te sentirías cómodo teniendo 300 acciones de algo, no tengas opciones que te den 300 acciones de exposición por delta. Esta sola verificación evita la mayoría de las pérdidas catastróficas en opciones, y casi nadie la hace.</p>"},{"h":"Volatilidad implícita y el IV crush","body":"\n<p>La IV es el pronóstico del mercado sobre el movimiento futuro, incorporado al precio de la opción. Es la variable más importante que la mayoría de los traders minoristas ignora por completo.</p>\n<p>La idea clave: <strong>la IV sube cuando sube la incertidumbre y se desploma cuando la incertidumbre se resuelve.</strong> Antes de un reporte de resultados, nadie sabe el número, así que las opciones se ponen caras. A la mañana siguiente — sin importar el resultado — la incertidumbre desapareció y la IV cae con fuerza. Esa caída es el <em>IV crush</em>.</p>\n<div class=\"box warn\"><b>La trampa clásica de los resultados</b><p>Compras calls antes de los resultados. La empresa supera las expectativas, la acción salta 6%, y tus calls están <em>abajo</em>. Qué pasó: pagaste una prima inflada por una IV elevada, el reporte resolvió la incertidumbre, la IV cayó de 85 a 40, y la pérdida por vega superó la ganancia por delta. Predijiste el evento correctamente y aun así perdiste. La acción tenía que moverse más que el \"movimiento esperado\" que ya estaba en el precio — y ese movimiento esperado es exactamente lo que representaba la prima elevada.</p></div>\n<p>Dos herramientas para esto:</p>\n<ul>\n<li><strong>IV Rank / IV Percentile.</strong> Dónde está la IV actual respecto al último año para esa acción específica. Una IV de 45 no significa nada por sí sola — 45 es barato para una biotecnológica y carísimo para una empresa de servicios públicos. Un IV rank alto favorece vender prima; un IV rank bajo favorece comprarla.</li>\n<li><strong>El movimiento esperado.</strong> Aproximadamente el precio del straddle en el dinero. Te dice el movimiento que el mercado ya tiene incorporado. Si compras opciones de cara a los resultados, estás apostando a que el movimiento real supere eso — una apuesta que es prácticamente un 50/50 menos el spread.</li>\n</ul>\n<p>También vale la pena saber esto: el <strong>sesgo de volatilidad (volatility skew)</strong>. Las puts casi siempre cargan una IV más alta que las calls equidistantes, porque los desplomes son más rápidos que las subidas y las instituciones pujan por la protección a la baja. Ese sesgo es la razón por la que los collars a menudo se pueden armar con poco o ningún costo neto.</p>"},{"h":"Las estrategias que sí importan, ordenadas por riesgo","body":"\n<table>\n<tr><th>Estrategia</th><th>Estructura</th><th>Pérdida máxima</th><th>Evaluación honesta</th></tr>\n<tr><td><strong>Call cubierta</strong></td><td>Tienes 100 acciones, vendes una call</td><td>Que la acción se vaya a cero, menos la prima cobrada</td><td>Ingreso razonable sobre un
